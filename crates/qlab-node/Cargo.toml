[package]
name = "qlab-node"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# M9-N1 node skeleton: the persistent, restart-safe consensus state a Qumbra
# full node maintains — the chain store, the depth-32 commitment tree, and the
# permanent nullifier set (protocol-spec §3/§6) — behind swappable store traits
# (the N2–N6 consumption surface), with atomic disk snapshots and sync-from-
# genesis replay. Prover-free: transaction-proof verification is injected via
# qlab-devnet's `TxVerifier`, so the real M3 verifier (qlab-consensus) plugs in
# without this crate depending on the prover.

[dependencies]
# Chain state / fork choice / finality, block header + body types, and the
# body-validation rule (anchor-final + posted-fee + in-block double-spend).
# `serde` is the #660 sidecar seam: the registry types moved to qlab-devnet
# and this crate — the sole sidecar writer — is their only serde consumer.
qlab-devnet = { path = "../qlab-devnet", default-features = false, features = ["serde"] }

# The depth-32 incremental commitment tree (the exact consensus tree the M3
# bucket proves membership against).
qlab-cbserver = { path = "../qlab-cbserver", default-features = false }
# [u64;4] ↔ [u8;32] digest lane conversions (protocol-spec §1 lane-major LE).
qlab-note = { path = "../qlab-note" }
# The closed-form emission curve (frozen B2 constants) — the coinbase(h) =
# S_atomic(h+1) − S_atomic(h) normative integer emission the block assembler
# pays out (protocol-spec §6). Pure arithmetic, no chain/crypto deps.
qlab-econ = { path = "../qlab-econ" }

# Deterministic on-disk snapshot + block-log encoding.
serde = { version = "1", features = ["derive"] }
bincode = "1"
# Minimal maintained blocking HTTP/1.1 server for the localhost node-RPC read
# endpoints (M9-N6). Same pin as qlab-cbserver's reference server.
tiny_http = "=0.12.0"

[dev-dependencies]
# Real ML-KEM note encryption + the cbserver light client, to prove the embedded
# serving is byte-identical end-to-end (a reference wallet scans a live node).
rand = "0.10"

# Passthrough (lab #400): see qlab-devnet. This crate itself touches no RandomX
# symbol — only codec/tree from qlab-cbserver and qlab-devnet's pure surface.
[features]
default = ["randomx"]
randomx = ["qlab-devnet/randomx"]
