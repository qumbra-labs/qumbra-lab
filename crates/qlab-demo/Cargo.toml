[package]
name = "qlab-demo"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "qlab-demo"
path = "src/bin/qlab-demo.rs"

[dependencies]
qlab-air = { path = "../qlab-air" }
# Single source of truth for the consensus StarkConfig + wrappers (issue #38).
# Replaces the hand-reconstructed prover config this crate used to carry (F1).
qlab-consensus = { path = "../qlab-consensus" }
qlab-note = { path = "../qlab-note" }
qlab-wallet = { path = "../qlab-wallet" }
qlab-devnet = { path = "../qlab-devnet" }
qlab-cbserver = { path = "../qlab-cbserver" }

# The prover config + proof type now come from qlab-consensus (issue #38); the
# demo no longer depends on any p3 crate directly.
rand = "0.10"
