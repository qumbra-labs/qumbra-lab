[package]
name = "qlab-bench"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
qlab-air = { path = "../qlab-air" }

# Plonky3, pinned exactly at 0.6.2 (bench discipline: numbers against a
# moving prover are meaningless). p3-maybe-rayon/parallel turns on the
# multithreaded code paths in every p3 crate via feature unification.
#
# EXPERIMENT BRANCH (claude/mwhir-step0): main stays frozen on the fully-
# measured 0.6.1 record; this branch upgrades to 0.6.2 for the M-WHIR step-0
# calibration and NEVER merges back before an adoption decision. 0.6.2
# (released 2026-07-20) carries a WHIR PoW-rounding soundness fix — use it,
# never 0.6.1's whir.
p3-air = "=0.6.2"
p3-blake3-air = "=0.6.2"
p3-challenger = "=0.6.2"
p3-commit = "=0.6.2"
p3-dft = "=0.6.2"
p3-field = "=0.6.2"
p3-fri = "=0.6.2"
p3-keccak = "=0.6.2"
p3-keccak-air = "=0.6.2"
p3-koala-bear = "=0.6.2"
p3-matrix = "=0.6.2"
p3-maybe-rayon = { version = "=0.6.2", features = ["parallel"] }
p3-merkle-tree = "=0.6.2"
p3-poseidon2-air = "=0.6.2"
p3-symmetric = "=0.6.2"
p3-uni-stark = "=0.6.2"
p3-util = "=0.6.2"
# WHIR PCS (M-WHIR step 0). MMCS-generic like p3-fri; the mwhir bench mode
# instantiates it with the same Keccak MerkleTreeMmcs + SerializingChallenger32
# as the FRI lane. 0.6.2 only (contains the WHIR PoW-rounding soundness fix).
p3-whir = "=0.6.2"

# rand 0.10 matches what the p3 0.6.1 crates and their examples use.
rand = "0.10"
# Proof serialization for the proof-size column.
postcard = { version = "1", features = ["alloc"] }
# Fixed-width codec: the honest wire-format proxy for dense field values
# (postcard varints inflate uniform 31-bit values to ~5 B).
bincode = "1"
# Serialize trait bound for per-component proof accounting (breakdown mode);
# already in the dependency tree via the p3 crates.
serde = "1"
