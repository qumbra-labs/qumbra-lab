[package]
name = "qlab-disclosure"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Selective disclosure-proof prototype: the single-note STARK that fills the
# wallet-interop spec §3 envelope (auditable-privacy §4 "Selective" layer,
# closing the ZIP-311 gap). Strictly ADDITIVE — depends on qlab-air /
# qlab-wallet / qlab-note but changes none of them; their packings are this
# crate's binding spec (see packing.rs regression locks).

[dependencies]
# The commitment/address packings are cross-checked byte-for-byte against
# these — never forked (see packing.rs). reference::keccak_f is the semantic
# authority the disclosure AIR chains against.
qlab-air = { path = "../qlab-air" }
qlab-note = { path = "../qlab-note" }
qlab-wallet = { path = "../qlab-wallet" }

# Plonky3, pinned exactly at 0.6.1 (bench discipline — same revs as qlab-bench).
p3-air = "=0.6.1"
p3-challenger = "=0.6.1"
p3-commit = "=0.6.1"
p3-dft = "=0.6.1"
p3-field = "=0.6.1"
p3-fri = "=0.6.1"
p3-keccak = "=0.6.1"
p3-koala-bear = "=0.6.1"
p3-matrix = "=0.6.1"
p3-merkle-tree = "=0.6.1"
p3-symmetric = "=0.6.1"
p3-uni-stark = "=0.6.1"

# Proof serialization for proof_bytes in the §3 envelope + size reporting.
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# Regression locks build a real bucket instance and a real wallet address to
# compare the packings against qlab-air / qlab-wallet public outputs.
rand = "0.10"
bincode = "1"
