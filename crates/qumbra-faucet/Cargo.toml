[package]
name = "qumbra-faucet"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Issue #123: the T1 **faucet listener** — an HTTP surface a browser can use, over
# `qlab-faucet`'s tested request core, running in-process with a KEYLESS node.
#
# Its own crate rather than a `[[bin]]` inside `qlab-faucet`, for one mechanical
# reason and two structural ones (argued in the PR):
#
#   1. Cargo has no per-target dependencies. A bin in `qlab-faucet` puts
#      `qumbra-node` — and behind it qlab-p2p, randomx-rs, tiny_http, toml, ctrlc —
#      into the *library's* `[dependencies]`, so every consumer of the faucet
#      library, and every workspace test build, pays the whole node graph. Today
#      `qumbra-node` is a **dev**-dependency of `qlab-faucet` and the library's own
#      deps are wallet/tree/devnet/note/air only.
#   2. Precedent, twice. M10-T0-1 refused a bin in `qlab-node` (PR #65); #117
#      refused one in `qumbra-node` for `qumbra-opview` — "weight it does not need
#      is weight the node's build graph would pay for. The dependency arrow points
#      ONE way."
#   3. `qlab-faucet`'s crate docs say "There is no listener here, deliberately",
#      and the sentence is load-bearing: the library is what a future non-HTTP
#      front end reuses. Keeping the listener out of it keeps that literally true.
#
# The arrow points one way: this crate depends on `qlab-faucet` and `qumbra-node`;
# neither knows it exists.

[[bin]]
name = "qumbra-faucet"
path = "src/main.rs"

[dependencies]
# The tested request core: gate → queue → plan → prove → hand back for submission.
# NOT reimplemented here; this crate calls `Faucet::accept` and `Faucet::dispense`
# and nothing else builds a grant.
qlab-faucet = { path = "../qlab-faucet" }
# The node this faucet runs in-process with (composition, not a network write path:
# `RunningNode::submit_local_tx` is `P2pNode::announce_tx`, the local-origination
# path a mining node already uses). Also the real RandomX/verifier wiring.
qumbra-node = { path = "../qumbra-node" }
# Live consensus state: the commitment tree witnesses are cut from, the anchor set,
# and `coinbase_note` — how the faucet re-derives the notes its own node mined
# (issue #101). Also `coinbase_leaf_appears_at`, the frozen §2 append schedule this
# binary reads to decide when a mined note is worth proving against (issue #102 moved
# enforcement into the tree; this crate no longer imposes the rule, only reports it).
qlab-node = { path = "../qlab-node" }
# The faucet's spending key (HD account, never rendered) and `Address` decode for
# the recipient a browser submits.
qlab-wallet = { path = "../qlab-wallet" }
# `[u64;4]` ↔ `[u8;32]` lane conversions on the note-commitment/anchor boundary.
qlab-note = { path = "../qlab-note" }
# The depth-32 commitment tree type `ChainView::tree` hands the faucet.
qlab-cbserver = { path = "../qlab-cbserver" }
# The block body / tx entry types, the posted-fee table, and RandomX for the
# in-process node's PoW engine.
qlab-devnet = { path = "../qlab-devnet" }
# `adapter::MiningClock` (the wall-clock header-timestamp opt-in the node binary
# also takes) and `peers()` for the status page's peer count. Already in the graph
# via qumbra-node; named because this binary uses it directly.
qlab-p2p = { path = "../qlab-p2p" }
# Annulet mode (lab #716, B6): the circuit's host-side types, and the L2 spend
# assembly the wallet shares (promoted to qlab-l2spend in C2, lab #720).
qlab-air = { path = "../qlab-air" }
qlab-l2spend = { path = "../qlab-l2spend" }
# TOML service config, same posture and same `=`-free pin as the node's.
toml = "0.8"
serde = { version = "1", features = ["derive"] }
# The HTTP listener. Same `=` pin as qlab-node's RPC surface, qlab-cbserver's
# reference server and qumbra-node's /metrics + /v1/telemetry — one HTTP
# implementation in the tree, not four.
tiny_http = "=0.12.0"
# Grant proving needs a CSPRNG (the note ρ/rseed the requester's output binds).
# Workspace rev, same as qlab-faucet's.
rand = "0.10"
# Signal handling: the same graceful-shutdown posture as the node, because the
# shutdown flushes the node's snapshot. The workspace declaration carries the
# `termination` feature (SIGTERM/SIGHUP as well as SIGINT, issue #145) — this
# line was `ctrlc = "3.4"` until #238, which armed SIGTERM only by feature
# unification through the qumbra-node dependency above.
ctrlc = { workspace = true }

# ---------------------------------------------------------------------------
# OTel adoption — the svc-lane three-piece kit (observability-plan §C.1).
#
# 🔴 **These five lines are the entire dependency delta, and they are confined to
# this leaf binary on purpose.** No `qlab-*` crate gains a dependency: the
# instrumentation lives at the dispatch seam and at the service tick, both of which
# are this crate's. The arrow keeps pointing one way.
#
# Version-pinned with `=`, the same posture `tiny_http` takes above and for a
# sharper reason: the OTel Rust stack version-locks across five crates
# (`tracing-opentelemetry` 0.33 ↔ `opentelemetry` 0.32), so an unpinned minor bump
# on any one of them is a build break rather than a nuisance. When these are bumped
# they are bumped together.
tracing = "=0.1.44"
# `registry` and nothing else — see the "no fmt layer, ever" decision in
# `src/telemetry.rs`. A fmt layer would put a second, unreviewed rendering of every
# span's fields on the operator's stdout next to the redacted journal line.
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["registry", "std"] }
tracing-opentelemetry = { version = "=0.33.0", default-features = false }
opentelemetry = { version = "=0.32.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["trace"] }
# `trace` only: no OTLP metrics and no OTLP logs. Metrics are Prometheus-pull on a
# loopback port (piece 3 of the kit) and logs are the existing journal line, so the
# two other OTLP signals would be dependency weight with no consumer.
#
# `internal-logs` is OFF on all three OTel crates. That is what makes "no error/warn
# spam when export is disabled" structural rather than remembered — there is no path
# from the SDK to a file descriptor. The cost is named in the PR: a *failing* export
# is currently silent, and surfacing it belongs with the transport baton that
# actually has a collector to fail against.
opentelemetry-otlp = { version = "=0.32.0", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
# Piece 3: the exemplar-carrying histogram. The official Prometheus Rust client —
# `qumbra-node`'s `/metrics` hand-renders its exposition, which is right for a
# snapshot with no exemplars and wrong here, because OpenMetrics exemplar syntax is
# exactly the part nobody should be hand-rendering.
prometheus-client = "=0.23.1"

[dev-dependencies]
# The acceptance suite drives the whole HTTP path to a REAL grant against a real
# in-process node, and then has the requester scan the chain for it with the
# unmodified reference light client (`qlab_cbserver::client::light_client_scan`) over
# a real socket — already a dependency above, so nothing extra is needed here.
