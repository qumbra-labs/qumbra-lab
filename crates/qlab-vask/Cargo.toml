[package]
name = "qlab-vask"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Exchange/VASP kit verifier lib — STAGE 1 (lab #483, docs/kit-stage0-survey.md
# §2–§3, both ratified at the stage-0 boundary). Verify-only by policy: wraps
# qlab-disclosure's envelope parse + verify behind the kit's stable surface —
# the pinned DISCLOSURE_V1_CFG, the named-refusal taxonomy, and the qvask C ABI
# under the #246 bidirectional header pin (include/qvask.h). Re-exports no
# prover entry point; verification is a pure function, no I/O, no chain model.

[lib]
# staticlib/cdylib: the artifacts a C consumer links; rlib so Rust tests can
# call the ABI directly (the qumbra-ffi pattern).
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# The disclosure STARK this kit verifies (statement, envelope, verifier —
# survey §1.1). Verify-only surface is API policy, not compile graph:
# p3-uni-stark ships prove+verify together (survey §2 dependency note).
qlab-disclosure = { path = "../qlab-disclosure" }

[dev-dependencies]
# The prove-class golden tests (tests/golden_v1.rs — CI lane's to run) build a
# real deterministic disclosure instance: address + KEM keypair + seeded rng,
# plus digest/keccak helpers for the chain-cm view and fixture digests.
qlab-note = { path = "../qlab-note" }
qlab-wallet = { path = "../qlab-wallet" }
rand = "0.10"
