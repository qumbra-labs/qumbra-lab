[package]
name = "qumbra-explorer"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Issue #235: the **public minimal explorer** — one read-only chain-health page for
# an outsider with no shell access, served from this binary's OWN keyless node's
# view of the network.
#
# Its own crate for the same one-way-arrow reasons `qumbra-faucet` argues in its
# manifest: this crate depends on `qumbra-node`; nothing knows it exists.
#
# What it is deliberately NOT (binding, testnet-plan §6): a transaction explorer.
# No tx lookup, no address lookup, no note browsing — this is a single-pool
# privacy chain and a chain-health page is the whole scope. And per §6.2, the
# fleet's telemetry endpoints stay private: this binary learns over P2P like any
# peer and its own HTTP port is its only public surface.

[[bin]]
name = "qumbra-explorer"
path = "src/main.rs"

[dependencies]
# The in-process keyless observer node (same composition seam as qumbra-faucet's;
# read-only here: no wallet, no mining, no tx origination).
qumbra-node = { path = "../qumbra-node" }
# `Telemetry` and its rendering disciplines (`age_field`, `supply_coverage`) — the
# one availability rule for every figure this page publishes.
qlab-node = { path = "../qlab-node" }
# RandomX for the observer node's PoW verification, and `FinalityStatus`.
qlab-devnet = { path = "../qlab-devnet" }
# `adapter::MiningClock` — the wall-clock header-timestamp opt-in every binary takes.
qlab-p2p = { path = "../qlab-p2p" }
# TOML service config, same posture as the node's and the faucet's.
toml = "0.8"
serde = { version = "1", features = ["derive"] }
# The HTTP listener. Same `=` pin as everywhere else in the tree — one HTTP
# implementation, not five.
tiny_http = "=0.12.0"
# Graceful shutdown flushes the node's snapshot. The workspace declaration
# carries `termination` (SIGTERM/SIGHUP too, issue #145) — since #238 no crate
# declares its own version/features, so the faucet's bare-redeclaration slip
# cannot recur here.
ctrlc = { workspace = true }

# ---------------------------------------------------------------------------
# OTel adoption — the svc-lane three-piece kit (observability-plan §C.1), the
# explorer's copy of the faucet's block (PR #498). Same crates, same `=` pins,
# same confinement: **these lines are the entire dependency delta and no
# `qlab-*` crate gains a dependency** — the instrumentation lives at this
# binary's dispatch seam and its projection walks, both of which are this
# crate's own code. The arrow keeps pointing one way.
#
# The pins are shared with `qumbra-faucet` deliberately: the OTel Rust stack
# version-locks across five crates (`tracing-opentelemetry` 0.33 ↔
# `opentelemetry` 0.32), so the two svc binaries must move in one commit or the
# workspace holds two incompatible stacks. When these are bumped, bump both.
tracing = "=0.1.44"
# `registry` and nothing else — see the "no fmt layer, ever" decision in
# `src/telemetry.rs`. A fmt layer would put an unreviewed rendering of every
# span's fields on the operator's stdout next to the route-only journal line.
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["registry", "std"] }
tracing-opentelemetry = { version = "=0.33.0", default-features = false }
opentelemetry = { version = "=0.32.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["trace"] }
# `trace` only: no OTLP metrics and no OTLP logs — metrics are Prometheus-pull
# on a loopback port (piece 3) and the journal line is the log. `internal-logs`
# OFF on all three OTel crates, same grounds as the faucet's: no path from the
# SDK to a file descriptor, so "zero noise when export is off" is structural.
opentelemetry-otlp = { version = "=0.32.0", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
# Piece 3: the exemplar-carrying histogram. OpenMetrics exemplar syntax is
# exactly the part nobody should be hand-rendering (the faucet's argument,
# unchanged here).
prometheus-client = "=0.23.1"

[dev-dependencies]
# Parse-and-assert for the hand-rolled encoder, and **dev-only on purpose**
# (issue #281): the encoder itself ships zero new runtime dependencies, and a
# real parser in the test is what proves the hand-rolled bytes are JSON rather
# than something that merely looks like it. The whole workspace carries no
# `serde_json` at runtime and this does not change that.
serde_json = "1"
# `keccak256` for the golden digest only — the same helper #277 locks its leaf-stream
# framing with. Test machinery: the binary depends on qlab-note transitively but
# this crate does not, and must not, at runtime.
qlab-note = { path = "../qlab-note" }
