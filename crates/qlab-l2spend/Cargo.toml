[package]
name = "qlab-l2spend"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The L2 spend assembly (lab #720, L2 C2): served witnesses → instance → real
# prove → the transaction with its encrypted discovery group → POST /v1/tx.
# Promoted out of qumbra-faucet's B6 module so the wallet and the faucet share
# ONE copy: both depend on this crate, and neither depends on the other (the
# wallet already dev-depends on the faucet, so the faucet depending on the
# wallet would put two copies of the wallet's types in its tests).

[dependencies]
qlab-air = { path = "../qlab-air" }
qlab-l2 = { path = "../qlab-l2" }
qlab-note = { path = "../qlab-note" }
qlab-cbserver = { path = "../qlab-cbserver", default-features = false }
qlab-devnet = { path = "../qlab-devnet", default-features = false }
qlab-p2p = { path = "../qlab-p2p", default-features = false }
qlab-node = { path = "../qlab-node", default-features = false }
# Lab #896 seam E4: the v2 builders build the Annulet intent and the
# single-party signer uses the authorization keys (Candidate A).
qlab-remote-auth = { path = "../qlab-remote-auth" }
bincode = "1"
rand = "0.10"

[features]
# Lab #924: `qlab_l2spend::fixtures` (honest signed S/P bundles) for other
# crates' tests. Dev-dependencies only; never in a release build.
fixtures = []
