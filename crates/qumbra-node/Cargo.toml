[package]
name = "qumbra-node"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# M10-T0-1: the `qumbra-node` binary + genesis tooling. Makes N7's in-process
# FullNode composition (qlab-p2p `adapter::NodeAdapter` + `P2pNode`) a REAL
# deployable binary: a TOML-configured full node over the real TCP transport
# (qlab-p2p `TcpTransport`) with RandomXPow (N3) as the default engine and the
# qlab-node disk stores for persistence, plus `genesis init` — a versioned
# genesis file baking the FROZEN v1.0 constant table + committee₀ verifying keys
# + the genesis block, byte-verified by every node on startup.
#
# Conflict boundary (issue #62): this new crate + its members line, the one
# orphan-sync-kick fix + the equivocation-slash convergence in qlab-p2p. Zero
# contact with qlab-bench/m4gate and T0-2's ops/telemetry surfaces.
#
# The transaction verifier is INJECTED (the N7 stack is verifier-agnostic). Since
# M10-T0-4 (issue #68) the DEFAULT is the real M3 verifier
# (`qlab_consensus::verify_proof`, frozen CONSENSUS_CFG); the NO-OP rehearsal
# stand-in is an explicit `--rehearsal-verifier` opt-in, logged loudly at startup.

[[bin]]
name = "qumbra-node"
path = "src/main.rs"

# ── halt-height upgrade drill binaries (issue #74) ──────────────────────────
#
# H1: the halt height is a BINARY RELEASE CONSTANT with no runtime override — not
# config, not CLI, not env. The only way to change where a node pauses is to build
# a different binary, which is exactly what a real upgrade is. These features are
# how the drill builds those binaries; `src/release.rs` holds the one `RELEASE`
# const each of them selects. Default (no feature) = the un-armed v1.0 release, so
# every ordinary build and every test in the workspace is unaffected.
#
#   drill-arm           halts at DRILL_HALT_HEIGHT (the pre-upgrade release)
#   drill-resume        the upgrade: inert revision v1.0.1-drill, resumes past H
#   drill-resume-norev  drill (c)'s negative: resumes past H with NO revision;
#                       MUST refuse to start
#   drill-cancel        drill (d): the stand-down — the upgrade at H is cancelled,
#                       so this binary does not halt there
#
# They are mutually exclusive by construction (the cfg arms in release.rs); a build
# enabling two is rejected by the compiler as a duplicate `RELEASE` definition.
[features]
default = []
drill-arm = []
drill-resume = []
drill-resume-norev = []
drill-cancel = []
# The post-boundary release of lab #299 + #303: resumes past
# `RULE_BOUNDARY_HEIGHT` under the exact-decimal schedule. See `release::RELEASE`
# for why arming is the default and resuming is the flag.
rule-boundary-resume = []

[dependencies]
# The N7 full-node composition: NodeAdapter (real chain/PoW/state/mempool/
# committee over the five N1 traits), P2pNode (gossip/sync/relay), the real TCP
# transport, and the peer/sync types.
qlab-p2p = { path = "../qlab-p2p" }
# The disk-backed node-state stores + genesis block + committee/emission wiring.
qlab-node = { path = "../qlab-node" }
# Real PoW: RandomX (light mode) + LWMA + key-block schedule (N3).
qlab-pow = { path = "../qlab-pow" }
# Consensus objects (BlockHeader/Committee/Validator/CommitteeState), the frozen
# params surface, the SimConfig parameter carrier, and posted-fee table.
qlab-devnet = { path = "../qlab-devnet" }
# The single-source frozen consensus config (CONSENSUS_CFG label, LOG_HEIGHT,
# wire byte count) baked into the genesis constant table, and the real M3
# prove/verify wrappers the default tx verifier calls (M10-T0-4).
qlab-consensus = { path = "../qlab-consensus" }
# The fixed-shape 2×2 bucket AIR + public-value packing (`build_bucket`, `pv_vec`),
# used by the real tx verifier to reconstruct the canonical verifier instance and
# the declared public surface (M10-T0-4, issue #68). Already built transitively
# via qlab-consensus; named directly here for the verifier's reconstruction path.
qlab-air = { path = "../qlab-air" }
# The wallet KERNEL, for `mine` (lab #475). Two things come from here and
# nothing else does:
#
#   store::create_from_os_entropy_gated  the ONLY place a wallet is minted, so
#                                        `mine` never re-implements entropy →
#                                        seed → seed file, and the seed is
#                                        written by the wallet crate rather than
#                                        held here. This process keeps the
#                                        public rkm and nothing more.
#   store::miner_rkm_hex                 lab #425's one-derivation rule: the
#                                        `miner_rkm` this node mines to IS the
#                                        wallet's rkm by construction.
#
# 🔴 `features = ["net"]` puts rustls in THIS BINARY's graph — deliberate, and
# argued on lab #475 before it was built. `net.rs`'s own note records why TLS
# was kept out of `qlab-cbserver` (issue #297): it would land in `qlab-node`'s
# graph and therefore in the CONSENSUS library's. This is the leaf binary crate,
# which nothing depends on, and it buys the one thing `mine` cannot do without —
# fetching `https://seed.qumbra.org/genesis.qmb`. `default-features = false`
# keeps `prove`/`randomx`/`host` out; the fetch is a hash-pinned artifact, so
# TLS is transport hygiene here and not the thing the verification rests on.
#
# The reverse edge (`qumbra-wallet`'s dev-dependency on this crate) makes this a
# dev-dependency cycle, which cargo resolves — checked, not assumed.
qumbra-wallet = { path = "../qumbra-wallet", default-features = false, features = ["net"] }
# ML-DSA-65 verifying-key encode/decode for committee₀ in the genesis file.
ml-dsa = "=0.1.1"
# CSPRNG for `genesis init --t2 --launch` (lab #506): 21 committee seeds from
# OS randomness, then `Validator::from_seed` — the existing keygen seam, so
# KeyFile still stores seed_hex and `load_validators` is unchanged. Same crate
# the rest of the workspace uses; `rand::rng()` is the house OsRng-class path
# (see qumbra-wallet `store.rs`). Tests also use it (was a dev-dep only).
rand = "0.10"

# Deterministic on-disk genesis-file encoding (same serde/bincode posture as the
# qlab-node snapshot/log). The genesis hash is keccak256 over the bincode.
serde = { version = "1", features = ["derive"] }
bincode = "1"
# TOML node config (data dir, listen addr, dial peers, committee-key paths,
# mining on/off) — the issue's specified config format.
toml = "0.8"
# Lab #511: GET /v1/mine/template and POST /v1/mine/block are JSON over the
# existing discovery listener (pure route addition, no RPC_VERSION bump).
serde_json = "1"
# The /metrics scrape endpoint (issue #87). Same minimal blocking HTTP/1.1 server,
# and the same `=` pin, as qlab-node's RPC surface and qlab-cbserver's reference
# server — one HTTP implementation in the tree, not three.
tiny_http = "=0.12.0"

[dev-dependencies]
# Issue #101 acceptance (`tests/coinbase_spend.rs`): the miner's key hierarchy —
# `Wallet::rkm(d)` is what a block's `coinbase_rkm` carries, and `spend_input` is
# the only spend-witness constructor, so this is what proves the minted note is
# spendable by its payee and by nobody else.
qlab-wallet = { path = "../qlab-wallet" }
# `[u64;4]` ↔ `[u8;32]` lane conversions on the note-commitment/anchor boundary,
# and — since issue #188 baton 2 — the real ML-KEM/AEAD note encryption plus
# `scan::detect_matches`, so the discovery acceptance test detects a payment the
# way a wallet does rather than by re-deriving a tag in the test.
qlab-note = { path = "../qlab-note" }
# The ratified compact-block wire DECODER, used only to read back what the
# discovery endpoint serves. The encoder this binary serves with is
# `qlab_node::compact_response`; a test that decoded with anything other than the
# reference decoder would not be testing the wire.
qlab-cbserver = { path = "../qlab-cbserver" }
# CSPRNG for the acceptance test's ML-KEM keypairs and note material (workspace rev).
# Also a [dependencies] entry since lab #506 (launch-mode committee keygen).
rand = "0.10"
# Lab #511 live-leg: login → job from a REAL node → share → POST → tip advances.
# default-features = false so the test does not construct a RandomX VM.
qumbra-pool = { path = "../qumbra-pool", default-features = false }
qlab-stratum = { path = "../qlab-stratum" }

# ── graceful shutdown: one seam, two platform mechanisms (src/shutdown.rs) ──
#
# unix — ctrlc with `termination`: SIGINT + SIGTERM + SIGHUP. Default ctrlc
# registers SIGINT only; `termination` also arms SIGTERM and SIGHUP (issue
# #145). Docker `compose stop` / systemd `systemctl stop` send SIGTERM to PID 1
# — without this feature those paths never set the shutdown flag and the
# post-loop flush is never attempted. Version + feature live in
# `[workspace.dependencies]` since #238, so no composing crate can redeclare the
# dep bare (tests/ctrlc_pairing.rs enforces it, and it reads target tables too).
#
# 🔴 SCOPED TO `cfg(unix)` SINCE LAB #478, AND THE SCOPING IS THE POINT. ctrlc
# compiles on Windows, but its handler releases a semaphore and returns TRUE
# immediately — and Windows terminates the process the moment a CTRL_CLOSE_EVENT
# handler returns. Under ctrlc alone, closing the console window sets the flag
# and then kills the process before the loop can read it, i.e. the snapshot
# flush the task book requires to survive does not. Windows gets this binary's
# own SetConsoleCtrlHandler instead (below), and running BOTH would be worse
# than either: handlers fire most-recently-registered first and the first TRUE
# ends the chain, so ctrlc's would be dead code with a thread parked on it.
[target.'cfg(unix)'.dependencies]
ctrlc = { workspace = true }

# windows — SetConsoleCtrlHandler, hand-registered. Adds no package to the tree:
# `windows-sys` is already in Cargo.lock as ctrlc's own Windows dependency, at
# this version, with these features among the ones it asks for.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
