[package]
name = "qumbra-wallet"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Issue #243: the **end-user wallet CLI** — keygen / restore / address / backup /
# scan, and deliberately NOT send (C3-gated; the seam is named in the PR).
#
# This is the kernel rehearsal the wallet briefs name: every non-UI component a
# browser-extension or mobile shell wraps is exercised here first, minus the
# browser. Same one-way-arrow posture as qumbra-faucet/qumbra-explorer: this
# crate depends on the libraries; nothing knows it exists. It runs NO node —
# scan talks to a cbserver URL.

[[bin]]
name = "qumbra-wallet"
path = "src/main.rs"
required-features = ["net", "prove"]

[[bin]]
name = "qumbra-prover-host"
path = "src/bin/prover_host.rs"
required-features = ["host"]

[dependencies]
# Key hierarchy, non-BIP-39 mnemonic (golden-frozen), diversified addresses.
qlab-wallet = { path = "../qlab-wallet" }
# The ledger, extracted so non-CLI shells can render it too (lab #407). This
# crate supplies the fee table the ledger asks for via its `fee_for` seam.
qlab-ledger = { path = "../qlab-ledger" }
# The whole light-client scan flow and its honesty vocabulary (ScanOutcome,
# Completeness) — reused, never reimplemented.
qlab-cbserver = { path = "../qlab-cbserver", default-features = false }
# Lab #631: the shared HTTP/1.1 response decoder, gated with `net` so the
# wasm/ffi core (no sockets) does not take it. Leaf crate, zero runtime deps
# — this is not a new external crate on the wallet's surface.
qlab-http-framing = { path = "../qlab-http-framing", optional = true }
# ML-KEM Keypair/Dk types the scan takes.
qlab-note = { path = "../qlab-note" }
# OS CSPRNG for seed entropy and the scan's decoy rng.
rand = "0.10"
# QR encoding for payment URIs (lab #342, name-service-decision §3's T1
# interim). Pure Rust, no C deps. `default-features = false` keeps the `image`
# stack out — we render Unicode half-blocks and SVG text ourselves in `qr.rs`,
# so only the core matrix encoder is used.
qrcode = { version = "0.14", default-features = false }
# The send path (written ahead of the mint; acceptance rides it): the frozen
# 2x2 builder incl. build_bucket_dummy1 (#219's latch, merged in lab PR #252),
# the REAL prover, tx body types + the posted-fee table, and the canonical tx
# wire bytes.
qlab-air = { path = "../qlab-air" }
qlab-consensus = { path = "../qlab-consensus", optional = true }
qlab-devnet = { path = "../qlab-devnet", default-features = false }
qlab-p2p = { path = "../qlab-p2p", optional = true }
# The L2 spend assembly (lab #720): selection is here, the witness assembly,
# the prove and the tx wire are qlab-l2spend's — shared with the faucet.
qlab-l2spend = { path = "../qlab-l2spend", optional = true }
# The served wires this wallet consumes, decoded by their OWN codecs, never a
# second reading of them: `TreeLeaves` (golden-frozen by #275, stamp rider 1)
# and `AnchorSet`. Adds NO crate to the build — qlab-p2p above already depends
# on qlab-node, so this promotes a transitive dependency to a declared one.
# The wallet still runs no node (the brief's A2 rejection): it uses the codecs.
qlab-node = { path = "../qlab-node", default-features = false }
bincode = "1"
# Only for the send test's declared-surface comparison (PrimeField32 → u32),
# same pin as qlab-consensus.
p3-field = "=0.6.1"
zeroize = "1.9"

# TLS for the wallet↔edge hop (issue #297, coordinator ruling 2026-08-08):
# rustls as a STREAM LAYER under this crate's existing hand-rolled HTTP/1.1 —
# not ureq, not hyper. The typed 202/400/503 vocabulary in `net.rs` is
# load-bearing per the stamped A1 decision, and it already works; the problem
# lives entirely at the transport.
#
# `ring` rather than the default `aws-lc-rs` provider: aws-lc-rs wants cmake in
# the build environment and this workspace has never needed one. `logging` is
# left off so no `log` crate enters a leaf binary that prints its own diagnostics.
# `tls12` is kept: the edge negotiates 1.3, but refusing 1.2 outright would make
# a wallet that fails against a correctly-configured origin somebody else runs.
#
# `rustls-pki-types` is deliberately NOT a direct dependency: `ServerName` comes
# through `rustls::pki_types`, rustls' own public re-export, so there is one
# version to keep in step instead of two. It is pinned in `Cargo.lock` either way.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"], optional = true }
# The Mozilla root program, compiled in. No `rustls-native-certs`: reading the
# platform trust store makes the wallet's answer depend on the operator's
# machine, and a wallet that trusts a locally-injected root is a wallet whose
# server authentication — the ONLY property classical TLS buys us here — is
# whatever the host says it is.
webpki-roots = { version = "1", optional = true }
# The prover host's native-messaging frames are JSON (Chrome's contract, not
# ours). Workspace precedent: qumbra-explorer. Optional, host-gated.
serde_json = { version = "1", optional = true }

# The first-spend e2e (issue #276) runs a REAL local devnet: a node the test
# mines directly and serves over a real socket, the faucet that funds the
# sender, and the production verifier. Dev-only — the wallet itself stays
# nodeless (the brief's A2 rejection); nothing below enters the library's
# dependency graph. (`qlab-node` is NOT repeated here: it is a real dependency
# above, for the served wires' codecs.)
[dev-dependencies]
qlab-faucet = { path = "../qlab-faucet" }
qumbra-faucet = { path = "../qumbra-faucet" }
qumbra-node = { path = "../qumbra-node" }
# Lab #631: `tests/http_framing.rs` drives the wallet's public GET against a
# real `tiny_http` on a loopback port. Same `=` pin as every other HTTP
# surface in the tree. Dev-only — the shipped binary's graph is unchanged.
tiny_http = "=0.12.0"

# wasm32 (the browser-extension shell, lab #400): getrandom needs the JS backend
# wired explicitly (crypto.getRandomValues) — same block as qumbra-ffi's.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

# lab #400: the wallet CORE (seed/keys, scan helpers, spent subtraction, tree
# catch-up, the select driver, the witness bundle) must compile to wasm32 for
# the browser shell. Heavy halves are default-ON features — every existing
# consumer is unchanged; qumbra-ffi opts down to the core.
[features]
default = ["net", "prove", "randomx", "host"]
# rustls under the hand-rolled HTTP/1.1 — everything that touches a socket.
net = ["dep:rustls", "dep:webpki-roots", "dep:qlab-http-framing"]
# the REAL prover and the canonical tx wire — the host/CLI half of a spend.
prove = ["dep:qlab-consensus", "dep:qlab-p2p", "dep:qlab-l2spend"]
# the RandomX C++ chain, via the qlab-devnet/qlab-node passthroughs.
randomx = ["qlab-devnet/randomx", "qlab-node/randomx"]
# the native-messaging prover host (lab #400 rung): prove + submit behind a
# framed stdio pipe. In default so `cargo test` builds and exercises the bin.
host = ["net", "prove", "dep:serde_json"]
