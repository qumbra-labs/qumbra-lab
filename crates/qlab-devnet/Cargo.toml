[package]
name = "qlab-devnet"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# M6 consensus/network devnet: a local multi-node simulation of Qumbra's hybrid
# consensus (PoW block production + BFT finality committee). Strictly additive —
# never touches qlab-air / qlab-bench / qlab-note beyond depending on the shared
# Keccak primitive. See docs/m6-devnet-plan.md for the staged plan + the contract.

[dependencies]
# The conservative-hash primitive shared across the whole consensus stack
# ("conservative hash everywhere in consensus", performance-budget §2). The
# Keccak-256 sponge is built on qlab-air's reference::keccak_f — never forked.
qlab-air = { path = "../qlab-air" }

# The ratified §2 compact-group framing (`qlab_note::compact`) — the exact bytes
# a block body now commits to per transaction
# (`discovery-on-the-consensus-wire.md` D2). This crate used to depend on
# qlab-note "only for the shared Keccak primitive"; body-bound discovery ends
# that, because D2 requires ONE encoder for these bytes and qlab-cbserver (their
# previous home) depends on this crate. Still no prover and no IO here; serde
# is reachable ONLY behind the off-by-default `serde` feature below (lab #660).
qlab-note = { path = "../qlab-note" }

# Lab #660: derives for `name_registry`'s types, so qlab-node's `names.bin`
# sidecar can keep serializing them after the registry replay moved here.
# OPTIONAL and off by default — this amends the long-standing "no serde here"
# contract as narrowly as possible: the default build, the wallet graph, and
# the wasm graph carry no serde edge; only qlab-node turns the feature on.
serde = { version = "1", features = ["derive"], optional = true }

# The real CPU-friendly PoW primitive (RandomX) + the LWMA-120 retarget and the
# key-block rotation schedule (M9-N3). The `PowEngine` adapter (`pow::RandomXPow`)
# and the difficulty wiring (`validation`) live here; qlab-pow is the reusable,
# dependency-light primitives crate underneath.
qlab-pow = { path = "../qlab-pow", default-features = false }


# ML-DSA-65 finality-committee checkpoint votes (consensus §5). RustCrypto,
# pure-Rust, FIPS-204-final, ACVP/Wycheproof KATs; UNAUDITED (self-declared),
# production alternative = libcrux-ml-dsa (Cryspen). Pinned >=0.1.1 (never rc):
# malleability advisory GHSA-5x2r-hc65-25f9 is fixed in rc.4/0.1.1. See
# docs/m6-devnet-plan.md "ML-DSA crate selection". Mirrors M5's ml-kem choice.
ml-dsa = "=0.1.1"

[dev-dependencies]
# Independent Keccak-256 authority to cross-check the local sponge (so a sponge
# transcription bug can't self-validate) — same discipline as qlab-note.
tiny-keccak = { version = "2", features = ["keccak"] }

# Passthrough (lab #400): default ON so every existing consumer is byte-for-byte
# unchanged; the wallet-core/wasm graph opts out. Gates ONLY the RandomX-backed
# engine — lwma/keyblock and the KeccakPow placeholder stay unconditional.
[features]
default = ["randomx"]
randomx = ["qlab-pow/randomx"]
# Serde derives on the name-registry types (lab #660) — for the node's sidecar
# only; see the dependency's note above.
serde = ["dep:serde"]
