[package]
name = "qlab-air"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[features]
# Issue #219 / QUM-69: the `ROLE_BNF2` liveness latch — in-circuit dummy input
# slots (protocol-spec §59 "in-circuit dummies"). DEFAULT OFF, deliberately:
# the latch adds three trace columns, which moves the consensus proof wire and
# therefore `qumbra_node::genesis::CONSENSUS_WIRE_BYTES` — a FROZEN v1.0
# constant baked into the genesis hash. Turning this on is a genesis change and
# rides the mint that `#215` (i) and `#188` (a) already ride; it is not a
# builder's call. See `narrow.rs`'s latch section and the PR body.
q69-latch = []

# Issue #215 (i) / #219 option 4, the ONE-permutation form: output note rho' is
# derived rather than witnessed — `rho'_0 = nf_0` (structural, inherited from the
# checked double-spend rule) and `rho'_1 = H(nf_0 || D_P|1)` via `ROLE_ARHO`,
# bound by a third equality bank. Closes #215's faerie-gold hole. DEFAULT OFF for
# the same reason as `q69-latch`: it moves the consensus proof wire and therefore
# the FROZEN `CONSENSUS_WIRE_BYTES` inside the genesis hash. Both features go
# unconditional together at the mint. See `narrow.rs`'s option-4 section.
q215-rho = []

[dependencies]
# Pinned exactly at 0.6.1, matching qlab-bench (bench discipline).
p3-air = "=0.6.1"
p3-field = "=0.6.1"
p3-matrix = "=0.6.1"

[dev-dependencies]
# Published Keccak-f used as the authority the reference implementation
# is cross-checked against.
p3-keccak = "=0.6.1"
p3-koala-bear = "=0.6.1"
p3-symmetric = "=0.6.1"
