[package]
name = "qlab-cbserver"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Compact-block reference server + light-client scan flow: wallet-interop-spec
# §2 over the ratified note-discovery §2 wire. See docs/cbserver-plan.md.

[dependencies]
# The ratified note wire (KEM/AEAD/cm/tag/scan) — this crate serves & scans it.
qlab-note = { path = "../qlab-note" }
# The consensus Merkle node hash for the commitment tree/frontier, and cm packing.
qlab-air = { path = "../qlab-air" }
# Real devnet block/header/chain types for the data source.
qlab-devnet = { path = "../qlab-devnet", optional = true }
# Minimal maintained blocking HTTP/1.1 server (no async runtime). Pinned exactly
# per bench discipline. Chosen over axum/hyper for a localhost reference server.
tiny_http = "=0.12.0"
# CSPRNG for keypair/note generation and randomized decoy fetches (workspace rev).
rand = "0.10"

[dev-dependencies]
# Issue #215: the collision the scan defends against is a property of the REAL
# key hierarchy — one `nk` per spend key, `dk_d` per diversifier, `nf` binding
# neither the diversifier nor the value. The tests build real wallets and real
# diversified addresses and check `nf` with the wallet's own `derive_nf` (which is
# regression-locked to the circuit) rather than restating the derivation.
# Not a cycle: qlab-wallet depends on qlab-note/qlab-air, never on this crate.
qlab-wallet = { path = "../qlab-wallet" }

[[bin]]
name = "cbreport"
path = "src/bin/cbreport.rs"
required-features = ["devnet"]

[features]
# The devnet fixture (`data`), the reference server over it (`server`),
# `client::scan_local` and the `cbreport` bin. Default ON — every existing
# consumer keeps exactly what it had. OFF for consumers that need only the
# light-client scan (qumbra-ffi: iOS cannot build RandomX, which rides in via
# qlab-devnet -> qlab-pow -> randomx-rs's C++ cmake).
default = ["devnet"]
devnet = ["dep:qlab-devnet"]
