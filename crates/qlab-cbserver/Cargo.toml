[package]
name = "qlab-cbserver"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Compact-block reference server + light-client scan flow: wallet-interop-spec
# §2 over the ratified note-discovery §2 wire. See docs/cbserver-plan.md.

[dependencies]
# The ratified note wire (KEM/AEAD/cm/tag/scan) — this crate serves & scans it.
qlab-note = { path = "../qlab-note" }
# The consensus Merkle node hash for the commitment tree/frontier, and cm packing.
qlab-air = { path = "../qlab-air" }
# Real devnet block/header/chain types for the data source.
qlab-devnet = { path = "../qlab-devnet" }
# Minimal maintained blocking HTTP/1.1 server (no async runtime). Pinned exactly
# per bench discipline. Chosen over axum/hyper for a localhost reference server.
tiny_http = "=0.12.0"
# CSPRNG for keypair/note generation and randomized decoy fetches (workspace rev).
rand = "0.10"

[[bin]]
name = "cbreport"
path = "src/bin/cbreport.rs"
