# Emission-curve simulator — the quantitative validator for the consensus-
# parameters appendix's emission constants (tokenomics-and-issuance.md §1/§3/§4/§6).
#
# PURE ARITHMETIC. Zero crypto, zero chain deps, no Plonky3 — a standalone
# numeric model. Its ONE job is to let the coordinator SEE the emission trade
# space (supply curve, inflation trajectory, tail activation, 65/15/20 flows,
# committee wage) so constants can be *proposed* in the appendix. This crate
# decides no constant.
#
# std-only on purpose: the whole point is that supply-at-height is a closed
# form anyone can evaluate independently (the §1 job-4 audit anchor). No deps
# to trust.

