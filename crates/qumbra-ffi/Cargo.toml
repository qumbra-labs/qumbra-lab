[package]
name = "qumbra-ffi"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Issue #246 rung A: the wallet kernel over a **hand-written C ABI**, for the
# iOS shell (and later Android — same ABI, second binding).
#
# Hand ABI, not UniFFI, deliberately: the surface is ~10 functions whose
# payloads are already strings (mnemonic, bech32m address, rendered scan
# report). UniFFI buys codegen for a new proc-macro dependency tree and a
# generated layer nobody here reads; a surface this small is auditable
# line-by-line, which is worth more on a wallet boundary than convenience.
# Revisit past ~15 functions.
#
# No storage here: seed persistence is the platform's job (Keychain on iOS,
# files in the CLI). No entropy sourcing here either: the platform CSPRNG
# (SecRandomCopyBytes) provides the 32 bytes, so the RNG audit trail is the
# platform's own.

[lib]
name = "qumbra_ffi"
# staticlib for the xcframework; rlib so Rust tests can call the ABI.
crate-type = ["staticlib", "rlib"]

[dependencies]
qlab-wallet = { path = "../qlab-wallet" }
# The light-client scan and its honesty vocabulary (ScanOutcome/Completeness).
# default-features off: the devnet fixture rides qlab-devnet -> qlab-pow ->
# randomx-rs (C++/cmake), which does not build for iOS. The scan client is all
# this crate needs.
qlab-cbserver = { path = "../qlab-cbserver", default-features = false }
# ML-KEM Keypair/Dk types the scan takes.
qlab-note = { path = "../qlab-note" }
# The scan's decoy rng is seeded from bytes the platform passes in.
rand = "0.10"
