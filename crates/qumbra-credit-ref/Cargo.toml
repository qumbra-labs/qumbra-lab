[package]
name = "qumbra-credit-ref"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Exchange crediting-flow reference service — STAGE 0 SKELETON (lab #483,
# docs/kit-stage0-survey.md §2/§4). Own bin crate per the #117/#128
# precedents: Cargo has no per-target deps, so this service's HTTP/runtime
# graph must never land in qlab-vask's library dependencies. Stage 2 builds
# the service; stage 0 reserves the crate and carries citation tests on the
# existing seams the service will consume (survey §1.3).

[dependencies]
# The kit verifier surface (stage 1 fills it).
qlab-vask = { path = "../qlab-vask" }
# The scan / full-fetch / payload seams the crediting flow reuses verbatim
# (survey §1.3): light_client_scan_with, /v1/compact + /full codecs.
qlab-cbserver = { path = "../qlab-cbserver" }
# Dk / PAYLOAD_LEN — the types the scan seam takes and the wire constant the
# survey's memo-gap finding cites.
qlab-note = { path = "../qlab-note" }

[dev-dependencies]
rand = "0.10"
