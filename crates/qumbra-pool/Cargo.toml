[package]
name = "qumbra-pool"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Lab #482 stage 2: share-PoW (RandomX composition), PPLNS, payee-list.
#
# Its own crate rather than a [[bin]] inside qlab-stratum, for the same
# mechanical reason qumbra-faucet / qumbra-node argued: Cargo has no
# per-target deps, so a listener inside the protocol lib would drag TCP /
# qlab-devnet / qlab-pow into every codec consumer. The arrow points one
# way: this crate depends on qlab-stratum; qlab-stratum does not know it
# exists.
#
# Hashing lives in qlab_pow::RandomXHasher. This crate composes it
# behind feature `randomx` (default ON — a pool that cannot hash is
# not a pool). Unit tests inject FixedHasher and do not construct
# RandomXShareHasher. qlab-devnet stays default-features = false.

[[bin]]
name = "qumbra-pool"
path = "src/main.rs"

[features]
default = ["randomx"]
randomx = ["qlab-pow/randomx"]

[dependencies]
qlab-stratum = { path = "../qlab-stratum" }
qlab-devnet = { path = "../qlab-devnet", default-features = false }
qlab-pow = { path = "../qlab-pow", default-features = false }
qlab-http-framing = { path = "../qlab-http-framing" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Workspace entry carries `termination` (SIGTERM/SIGHUP, issue #145).
# Bare redeclare is structurally refused by qumbra-node's ctrlc_pairing.
ctrlc = { workspace = true }

[dev-dependencies]
# Targeted debug tests only. No RandomX, no in-process node.
#
# Exception, and the reason it is worth the graph (lab #547): the pool must
# refuse the node's `UNCONFIGURED_MINER_RKM` placeholder by name, and that
# constant lives in `qlab-p2p`, which this crate must NOT depend on at
# build time (the arrow points one way, and Cargo has no per-target deps).
# So `payee::UNCONFIGURED_NODE_RKM` mirrors it and `tests/cross_assert.rs`
# pins the two together. A dev-dep constructs no node; it buys a compile
# failure instead of a silent divergence on a value that already burned
# three blocks' issuance.
qlab-p2p = { path = "../qlab-p2p" }
# Lab #626: the pool's HTTP client must be tested against the server that
# actually broke it. `tests/node_rpc_framing.rs` drives a real `tiny_http`
# on a loopback port, because a hand-written byte fixture only encodes the
# author's belief about what the server sends — and in #626 that belief
# WAS the bug (the fix was written against "chunked above 8192 bytes"; the
# real default threshold is 32768, and only a live server says so).
#
# Dev-dep only: the shipped binary's dependency surface is unchanged, and
# `tiny_http` is already in this workspace's lock at the same `=0.12.0`
# pin the five crates that serve HTTP use.
tiny_http = "=0.12.0"
