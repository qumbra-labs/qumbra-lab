[package]
name = "qumbra-pool"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Lab #482 stage 2: share-PoW (RandomX composition), PPLNS, payee-list.
#
# Its own crate rather than a [[bin]] inside qlab-stratum, for the same
# mechanical reason qumbra-faucet / qumbra-node argued: Cargo has no
# per-target deps, so a listener inside the protocol lib would drag TCP /
# qlab-devnet / qlab-pow into every codec consumer. The arrow points one
# way: this crate depends on qlab-stratum; qlab-stratum does not know it
# exists.
#
# Hashing lives in qlab_pow::RandomXHasher. This crate composes it
# behind feature `randomx` (default ON — a pool that cannot hash is
# not a pool). Unit tests inject FixedHasher and do not construct
# RandomXShareHasher. qlab-devnet stays default-features = false.

[[bin]]
name = "qumbra-pool"
path = "src/main.rs"

[features]
default = ["randomx"]
randomx = ["qlab-pow/randomx"]

[dependencies]
qlab-stratum = { path = "../qlab-stratum" }
qlab-devnet = { path = "../qlab-devnet", default-features = false }
qlab-pow = { path = "../qlab-pow", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Workspace entry carries `termination` (SIGTERM/SIGHUP, issue #145).
# Bare redeclare is structurally refused by qumbra-node's ctrlc_pairing.
ctrlc = { workspace = true }

[dev-dependencies]
# Targeted debug tests only. No RandomX, no in-process node.
