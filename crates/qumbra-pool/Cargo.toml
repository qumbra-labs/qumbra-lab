[package]
name = "qumbra-pool"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Lab #482 stage 1: the shipping pool binary — TCP stratum endpoint + job
# lifecycle + share accounting + a template source keyed by ChainRules.form.
#
# Its own crate rather than a [[bin]] inside qlab-stratum, for the same
# mechanical reason qumbra-faucet / qumbra-node argued: Cargo has no
# per-target deps, so a listener inside the protocol lib would drag TCP /
# qlab-devnet / qlab-pow into every codec consumer. The arrow points one
# way: this crate depends on qlab-stratum; qlab-stratum does not know it
# exists.
#
# RandomX is NOT a runtime dep of this crate (qlab-devnet / qlab-pow are
# taken with default-features = false). Share-validation's PoW predicate
# is #490's export and lands in a later commit after that PR merges —
# this crate must not re-mirror those bytes locally.

[[bin]]
name = "qumbra-pool"
path = "src/main.rs"

[dependencies]
qlab-stratum = { path = "../qlab-stratum" }
# Header preimage + GenesisForm / ChainRules. default-features = false so
# this crate does not pull the RandomX C++ chain (share-validation is
# deferred to #490; template assembly only needs the header serializer).
qlab-devnet = { path = "../qlab-devnet", default-features = false }
# Key-block schedule (seed_hash / next_seed_hash arithmetic). Same
# default-features = false: we want keyblock only.
qlab-pow = { path = "../qlab-pow", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Workspace entry carries `termination` (SIGTERM/SIGHUP, issue #145).
# Bare redeclare is structurally refused by qumbra-node's ctrlc_pairing.
ctrlc = { workspace = true }

[dev-dependencies]
# Targeted debug tests only. No RandomX, no in-process node.
