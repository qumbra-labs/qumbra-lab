# Qumbra T0 internal-net — Phase B-lite localhost/docker net (issue #64 amendment 3).
#
# 4 real node containers on real TCP over a docker bridge network, real RandomX
# light, wall-clock header timestamps, frozen 75 s block time, distinct on-disk
# data-dir volumes. A one-shot `genesis-init` mints the shared genesis + 21
# committee keys (split 6/5/5/5) exactly once into the `shared` volume; the nodes
# depend on it, byte-verify the genesis, and pin its hash.
#
#   docker compose -f deploy/docker/docker-compose.yml up --build         # all 4
#   docker compose -f deploy/docker/docker-compose.yml up -d --build node0 node1 node2
#   docker compose -f deploy/docker/docker-compose.yml up -d --build faucet  # +#123
#   deploy/docker/soak.sh                                                 # scenarios
#
# THE THREE HOST PROPERTIES THIS HARNESS MODELS — the canonical list, with the caveat
# that belongs to each, is soak.sh's header. Two of the three are set here:
#
#   WAN latency (step 1b)         `soak.sh netem <ms>`, which needs the NET_ADMIN
#                                 capability granted in x-node-common below.
#   advertised-addr absence (1c)  QUMBRA_ADVERTISE_ADDR / NODE<i>_ADVERTISE, an env
#                                 var read by entrypoint.sh.
#   CPU budget (step 1d)          `cpus:` / `cpuset:` on each service below, or
#                                 `soak.sh cpu-budget <n>` live on a running net.
#
# They are INDEPENDENT and all three default to "as every run before 2026-07-30 was",
# so an ordinary soak is byte-for-byte unchanged and any of the combinations is a
# legible run. Each node stamps the two it can see on its own greppable startup line
# (ADVERTISE_MODE, CPU_BUDGET); latency is a qdisc and `soak.sh netem-show` reads it.
#
# QUMBRA_ADVERTISE_ADDR=none brings the net up with NO advertised address on any
# node — the configuration the four T0 hosts actually run (issue #107 step 1c).
# Default `auto` is what every run before 2026-07-30 did, so an ordinary soak is
# unchanged. Per node: NODE<i>_ADVERTISE. `soak.sh advertise-show` reads back which
# mode each running node is in, from inside the container.
#
# CPU BUDGET (issue #107 step 1d). The harness can now be held to the T0 hosts'
# CPU budget, which until 2026-07-30 it could not: the four hosts are t4g.small with
# 2 vCPU each, while these containers shared every core the Docker VM has (18 on
# the dev rig). Two knobs, BOTH DEFAULTING TO UNCONSTRAINED so an ordinary soak is
# byte-for-byte what it was — at the defaults compose drops both keys from the
# resolved config entirely, so there is nothing left to behave differently:
#
#   QUMBRA_CPUS=2       CFS quota: 2 CPU-seconds per second. `nproc` still says 18.
#   QUMBRA_CPUSET=0-1   affinity: the container sees exactly 2 CPUs, `nproc` says 2.
#   NODE<i>_CPUS / NODE<i>_CPUSET   per node — and the per-node form is the one that
#                       matters for cpuset, because containers pinned to the
#                       SAME pair oversubscribe it instead of modelling separate hosts.
#   FAUCET_CPUS / FAUCET_CPUSET     the fifth container (#128) has the same two knobs.
#                       It MINES, so leaving it unbudgeted while the four are budgeted
#                       puts an unlimited competitor on their dedicated cores — which
#                       is why it is a knob and not an omission.
#
# `soak.sh cpu-budget 2` sets quota 2 + a distinct core block per container (the
# faucet included, when it is up) and is the recipe to use; `soak.sh cpu-show` reads
# back what each one actually got.
# A run WITHOUT a limit says nothing about CPU-scarce behaviour — see soak.sh's header.
#
# RIG DISCIPLINE: do NOT `up`/`build` while the b4 bench is running
# (`pgrep -f qlab_bench`) — 4 RandomX light caches on the Docker-Desktop Linux VM
# on top of the ~30 GB bench will OOM. Wait it out.

name: qumbra-t0-lite

x-node-common: &node-common
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile
  image: qumbra-node:t0-lite
  restart: "no"            # manual control — the restart/partition scenarios stop nodes
  networks: [qumbra]
  # NET_ADMIN is what lets `soak.sh netem <delay_ms>` install a `tc netem` qdisc on
  # this container's eth0 (issue #107 step 1b). It is granted to the CONTAINER, not
  # used by the node process — `qumbra-node` never touches the network stack's
  # configuration. Without it `tc qdisc add` fails with RTNETLINK "Operation not
  # permitted" and the harness cannot express a latency question at all.
  cap_add: [NET_ADMIN]
  depends_on:
    genesis-init:
      condition: service_completed_successfully

volumes:
  shared:                   # the ONE shared genesis + 21 keys (init writes, nodes read)
  dataf:                    # the faucet's node data + its own key material (#123)
  data0:
  data1:
  data2:
  data3:

networks:
  qumbra:
    name: qumbra_t0         # the normal full-mesh network
  sideb:
    name: qumbra_t0_sideb   # used only by soak.sh to keep the B-side pair talking
                            # during a true 2+2 `docker network disconnect` partition

services:
  genesis-init:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: qumbra-node:t0-lite
    command: ["init"]
    volumes:
      - shared:/shared

  # ── the T1 faucet (issue #123) ────────────────────────────────────────────
  #
  # A FIFTH node, and deliberately not one of the four: it holds NO committee keys
  # (testnet-plan.md §6.2 — a node that holds committee keys exposes nothing beyond
  # P2P, so the faucet's hot spending key never shares a host with them), and
  # `qumbra-faucet` refuses to start if its node config names any. It mines like the
  # others and pays its coinbase to its own rkm, which is the whole funding story.
  #
  #   docker compose -f deploy/docker/docker-compose.yml up -d --build faucet
  #   open http://127.0.0.1:9450/
  #
  # 🔴 The faucet cannot serve a grant until its own coinbase matures: 144 blocks
  # (FROZEN §2) at the FROZEN 75 s block time is ~3 h after it wins its first two
  # blocks. Until then the page says so, with the height, and refuses rather than
  # queueing a request it cannot honour.
  faucet:
    <<: *node-common
    hostname: faucet
    environment:
      # `required` (default) or `open`. Open makes the faucet saturable by roughly a
      # hundred subnets — qlab_faucet::policy prices it exactly.
      QUMBRA_FAUCET_TICKETS: ${QUMBRA_FAUCET_TICKETS:-required}
    # CPU budget (issue #107 step 1d) — its OWN pair of variables, deliberately NOT
    # ${QUMBRA_CPUS}. The faucet is a fifth container and not one of the four T0 hosts,
    # so folding it into the global knob would silently change what "the four hosts'
    # budget" means. But it is not exempt either: it mines RandomX on the same
    # synchronous main loop, so an unbudgeted faucet is an unlimited competitor sitting
    # on the four nodes' dedicated cores, which is precisely the premise a dedicated
    # cpuset is supposed to establish. Default unconstrained, like the others.
    cpus: ${FAUCET_CPUS:-0}
    cpuset: ${FAUCET_CPUSET:-}
    # Published to the HOST's loopback only. The in-container bind is 0.0.0.0 inside a
    # private bridge namespace, which is not a host-exposure decision; this line is
    # where the exposure decision actually lives, and it says loopback.
    ports:
      - "127.0.0.1:9450:9450"
      - "127.0.0.1:9414:9410"
    command: ["faucet"]
    volumes:
      - shared:/shared
      - dataf:/data

  # ── the T2 pool (lab #511 / G4) ───────────────────────────────────────────
  #
  # Second binary in this image. Profile `pool` so an ordinary soak is unchanged:
  #
  #   docker compose -f deploy/docker/docker-compose.yml --profile pool up -d pool
  #
  # The pool talks to ITS OWN node on the same host. Default node_rpc is
  # http://127.0.0.1:9420 — that is the discovery loopback. For a sidecar
  # talking to node0's published discovery, set QUMBRA_NODE_RPC and bind
  # the node's discovery off loopback. Operator file: QUMBRA_POOL_CONFIG.
  # Config path documented here (deploy #197's compose template is the
  # deploy-repo sibling; this is the lab-side copy).
  pool:
    <<: *node-common
    hostname: pool
    profiles: ["pool"]
    environment:
      QUMBRA_NODE_RPC: ${QUMBRA_NODE_RPC:-http://127.0.0.1:9420}
      QUMBRA_POOL_LISTEN: ${QUMBRA_POOL_LISTEN:-0.0.0.0:3333}
      QUMBRA_POOL_SHARE_DIFFICULTY: ${QUMBRA_POOL_SHARE_DIFFICULTY:-1024}
      QUMBRA_POOL_POLL_MS: ${QUMBRA_POOL_POLL_MS:-1000}
      QUMBRA_POOL_CONFIG: ${QUMBRA_POOL_CONFIG:-}
    ports:
      - "127.0.0.1:3333:3333"
    command: ["pool"]
    volumes:
      - shared:/shared

  node0:                    # de-facto bootstrap (all nodes full-mesh dial each other)
    <<: *node-common
    hostname: node0
    # Which release this node runs (issue #74 drill). Default = the un-armed v1.0
    # binary, so an ordinary soak is byte-for-byte what it was. soak.sh sets these
    # per-scenario; see deploy/docker/entrypoint.sh for the binary names.
    environment:
      QUMBRA_BIN: ${NODE0_BIN:-qumbra-node}
      QUMBRA_SAMPLE_SECS: ${QUMBRA_SAMPLE_SECS:-30}
      # auto (default) = this node advertises itself dialable, as every run before
      # 2026-07-30 did. none = the field is absent from its node.toml, which is what
      # the four T0 hosts run. Global for all four, or NODE0_ADVERTISE per node.
      QUMBRA_ADVERTISE_ADDR: ${NODE0_ADVERTISE:-${QUMBRA_ADVERTISE_ADDR:-auto}}
    # CPU budget (issue #107 step 1d) — see the header. `0` / empty are how compose
    # is told to omit the key altogether, so the DEFAULT container is unconstrained
    # and identical to every run before 2026-07-30. Independent of the advertise mode
    # above: neither knob reads the other. Per node here; QUMBRA_CPUS / QUMBRA_CPUSET
    # set all four at once (and FAUCET_CPUS / FAUCET_CPUSET the fifth container).
    cpus: ${NODE0_CPUS:-${QUMBRA_CPUS:-0}}
    cpuset: ${NODE0_CPUSET:-${QUMBRA_CPUSET:-}}
    # /v1/telemetry (issue #117), published so `qumbra-opview` can be run from the
    # host: `qumbra-opview node0=http://127.0.0.1:9410 …`. Read-only, GET only,
    # bound to localhost on the host side — nothing here is reachable off-machine.
    ports:
      - "127.0.0.1:9410:9410"
    command: ["run", "0"]   # holds committee keys 00..05 (6)
    volumes:
      - shared:/shared
      - data0:/data

  node1:
    <<: *node-common
    hostname: node1
    # Which release this node runs (issue #74 drill). Default = the un-armed v1.0
    # binary, so an ordinary soak is byte-for-byte what it was. soak.sh sets these
    # per-scenario; see deploy/docker/entrypoint.sh for the binary names.
    environment:
      QUMBRA_BIN: ${NODE1_BIN:-qumbra-node}
      QUMBRA_SAMPLE_SECS: ${QUMBRA_SAMPLE_SECS:-30}
      # auto (default) = this node advertises itself dialable, as every run before
      # 2026-07-30 did. none = the field is absent from its node.toml, which is what
      # the four T0 hosts run. Global for all four, or NODE1_ADVERTISE per node.
      QUMBRA_ADVERTISE_ADDR: ${NODE1_ADVERTISE:-${QUMBRA_ADVERTISE_ADDR:-auto}}
    # CPU budget (issue #107 step 1d) — see the header. `0` / empty are how compose
    # is told to omit the key altogether, so the DEFAULT container is unconstrained
    # and identical to every run before 2026-07-30. Independent of the advertise mode
    # above: neither knob reads the other. Per node here; QUMBRA_CPUS / QUMBRA_CPUSET
    # set all four at once (and FAUCET_CPUS / FAUCET_CPUSET the fifth container).
    cpus: ${NODE1_CPUS:-${QUMBRA_CPUS:-0}}
    cpuset: ${NODE1_CPUSET:-${QUMBRA_CPUSET:-}}
    # /v1/telemetry (issue #117), published so `qumbra-opview` can be run from the
    # host: `qumbra-opview node0=http://127.0.0.1:9410 …`. Read-only, GET only,
    # bound to localhost on the host side — nothing here is reachable off-machine.
    ports:
      - "127.0.0.1:9411:9410"
    command: ["run", "1"]   # holds committee keys 06..10 (5)
    volumes:
      - shared:/shared
      - data1:/data

  node2:
    <<: *node-common
    hostname: node2
    # Which release this node runs (issue #74 drill). Default = the un-armed v1.0
    # binary, so an ordinary soak is byte-for-byte what it was. soak.sh sets these
    # per-scenario; see deploy/docker/entrypoint.sh for the binary names.
    environment:
      QUMBRA_BIN: ${NODE2_BIN:-qumbra-node}
      QUMBRA_SAMPLE_SECS: ${QUMBRA_SAMPLE_SECS:-30}
      # auto (default) = this node advertises itself dialable, as every run before
      # 2026-07-30 did. none = the field is absent from its node.toml, which is what
      # the four T0 hosts run. Global for all four, or NODE2_ADVERTISE per node.
      QUMBRA_ADVERTISE_ADDR: ${NODE2_ADVERTISE:-${QUMBRA_ADVERTISE_ADDR:-auto}}
    # CPU budget (issue #107 step 1d) — see the header. `0` / empty are how compose
    # is told to omit the key altogether, so the DEFAULT container is unconstrained
    # and identical to every run before 2026-07-30. Independent of the advertise mode
    # above: neither knob reads the other. Per node here; QUMBRA_CPUS / QUMBRA_CPUSET
    # set all four at once (and FAUCET_CPUS / FAUCET_CPUSET the fifth container).
    cpus: ${NODE2_CPUS:-${QUMBRA_CPUS:-0}}
    cpuset: ${NODE2_CPUSET:-${QUMBRA_CPUSET:-}}
    # /v1/telemetry (issue #117), published so `qumbra-opview` can be run from the
    # host: `qumbra-opview node0=http://127.0.0.1:9410 …`. Read-only, GET only,
    # bound to localhost on the host side — nothing here is reachable off-machine.
    ports:
      - "127.0.0.1:9412:9410"
    command: ["run", "2"]   # holds committee keys 11..15 (5)
    volumes:
      - shared:/shared
      - data2:/data

  node3:                    # the late-joiner in the sync-from-genesis scenario
    <<: *node-common
    hostname: node3
    # Which release this node runs (issue #74 drill). Default = the un-armed v1.0
    # binary, so an ordinary soak is byte-for-byte what it was. soak.sh sets these
    # per-scenario; see deploy/docker/entrypoint.sh for the binary names.
    environment:
      QUMBRA_BIN: ${NODE3_BIN:-qumbra-node}
      QUMBRA_SAMPLE_SECS: ${QUMBRA_SAMPLE_SECS:-30}
      # auto (default) = this node advertises itself dialable, as every run before
      # 2026-07-30 did. none = the field is absent from its node.toml, which is what
      # the four T0 hosts run. Global for all four, or NODE3_ADVERTISE per node.
      QUMBRA_ADVERTISE_ADDR: ${NODE3_ADVERTISE:-${QUMBRA_ADVERTISE_ADDR:-auto}}
    # CPU budget (issue #107 step 1d) — see the header. `0` / empty are how compose
    # is told to omit the key altogether, so the DEFAULT container is unconstrained
    # and identical to every run before 2026-07-30. Independent of the advertise mode
    # above: neither knob reads the other. Per node here; QUMBRA_CPUS / QUMBRA_CPUSET
    # set all four at once (and FAUCET_CPUS / FAUCET_CPUSET the fifth container).
    cpus: ${NODE3_CPUS:-${QUMBRA_CPUS:-0}}
    cpuset: ${NODE3_CPUSET:-${QUMBRA_CPUSET:-}}
    # /v1/telemetry (issue #117), published so `qumbra-opview` can be run from the
    # host: `qumbra-opview node0=http://127.0.0.1:9410 …`. Read-only, GET only,
    # bound to localhost on the host side — nothing here is reachable off-machine.
    ports:
      - "127.0.0.1:9413:9410"
    command: ["run", "3"]   # holds committee keys 16..20 (5)
    volumes:
      - shared:/shared
      - data3:/data
