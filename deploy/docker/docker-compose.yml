# Qumbra T0 internal-net — Phase B-lite localhost/docker net (issue #64 amendment 3).
#
# 4 real node containers on real TCP over a docker bridge network, real RandomX
# light, wall-clock header timestamps, frozen 75 s block time, distinct on-disk
# data-dir volumes. A one-shot `genesis-init` mints the shared genesis + 21
# committee keys (split 6/5/5/5) exactly once into the `shared` volume; the nodes
# depend on it, byte-verify the genesis, and pin its hash.
#
#   docker compose -f deploy/docker/docker-compose.yml up --build         # all 4
#   docker compose -f deploy/docker/docker-compose.yml up -d --build node0 node1 node2
#   docker compose -f deploy/docker/docker-compose.yml up -d --build faucet  # +#123
#   deploy/docker/soak.sh                                                 # scenarios
#
# QUMBRA_ADVERTISE_ADDR=none brings the net up with NO advertised address on any
# node — the configuration the four T0 hosts actually run (issue #107 step 1c).
# Default `auto` is what every run before 2026-07-30 did, so an ordinary soak is
# unchanged. Per node: NODE<i>_ADVERTISE. `soak.sh advertise-show` reads back which
# mode each running node is in, from inside the container.
#
# RIG DISCIPLINE: do NOT `up`/`build` while the b4 bench is running
# (`pgrep -f qlab_bench`) — 4 RandomX light caches on the Docker-Desktop Linux VM
# on top of the ~30 GB bench will OOM. Wait it out.

name: qumbra-t0-lite

x-node-common: &node-common
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile
  image: qumbra-node:t0-lite
  restart: "no"            # manual control — the restart/partition scenarios stop nodes
  networks: [qumbra]
  # NET_ADMIN is what lets `soak.sh netem <delay_ms>` install a `tc netem` qdisc on
  # this container's eth0 (issue #107 step 1b). It is granted to the CONTAINER, not
  # used by the node process — `qumbra-node` never touches the network stack's
  # configuration. Without it `tc qdisc add` fails with RTNETLINK "Operation not
  # permitted" and the harness cannot express a latency question at all.
  cap_add: [NET_ADMIN]
  depends_on:
    genesis-init:
      condition: service_completed_successfully

volumes:
  shared:                   # the ONE shared genesis + 21 keys (init writes, nodes read)
  dataf:                    # the faucet's node data + its own key material (#123)
  data0:
  data1:
  data2:
  data3:

networks:
  qumbra:
    name: qumbra_t0         # the normal full-mesh network
  sideb:
    name: qumbra_t0_sideb   # used only by soak.sh to keep the B-side pair talking
                            # during a true 2+2 `docker network disconnect` partition

services:
  genesis-init:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: qumbra-node:t0-lite
    command: ["init"]
    volumes:
      - shared:/shared

  # ── the T1 faucet (issue #123) ────────────────────────────────────────────
  #
  # A FIFTH node, and deliberately not one of the four: it holds NO committee keys
  # (testnet-plan.md §6.2 — a node that holds committee keys exposes nothing beyond
  # P2P, so the faucet's hot spending key never shares a host with them), and
  # `qumbra-faucet` refuses to start if its node config names any. It mines like the
  # others and pays its coinbase to its own rkm, which is the whole funding story.
  #
  #   docker compose -f deploy/docker/docker-compose.yml up -d --build faucet
  #   open http://127.0.0.1:9450/
  #
  # 🔴 The faucet cannot serve a grant until its own coinbase matures: 144 blocks
  # (FROZEN §2) at the FROZEN 75 s block time is ~3 h after it wins its first two
  # blocks. Until then the page says so, with the height, and refuses rather than
  # queueing a request it cannot honour.
  faucet:
    <<: *node-common
    hostname: faucet
    environment:
      # `required` (default) or `open`. Open makes the faucet saturable by roughly a
      # hundred subnets — qlab_faucet::policy prices it exactly.
      QUMBRA_FAUCET_TICKETS: ${QUMBRA_FAUCET_TICKETS:-required}
    # Published to the HOST's loopback only. The in-container bind is 0.0.0.0 inside a
    # private bridge namespace, which is not a host-exposure decision; this line is
    # where the exposure decision actually lives, and it says loopback.
    ports:
      - "127.0.0.1:9450:9450"
      - "127.0.0.1:9414:9410"
    command: ["faucet"]
    volumes:
      - shared:/shared
      - dataf:/data

  node0:                    # de-facto bootstrap (all nodes full-mesh dial each other)
    <<: *node-common
    hostname: node0
    # Which release this node runs (issue #74 drill). Default = the un-armed v1.0
    # binary, so an ordinary soak is byte-for-byte what it was. soak.sh sets these
    # per-scenario; see deploy/docker/entrypoint.sh for the binary names.
    environment:
      QUMBRA_BIN: ${NODE0_BIN:-qumbra-node}
      QUMBRA_SAMPLE_SECS: ${QUMBRA_SAMPLE_SECS:-30}
      # auto (default) = this node advertises itself dialable, as every run before
      # 2026-07-30 did. none = the field is absent from its node.toml, which is what
      # the four T0 hosts run. Global for all four, or NODE0_ADVERTISE per node.
      QUMBRA_ADVERTISE_ADDR: ${NODE0_ADVERTISE:-${QUMBRA_ADVERTISE_ADDR:-auto}}
    # /v1/telemetry (issue #117), published so `qumbra-opview` can be run from the
    # host: `qumbra-opview node0=http://127.0.0.1:9410 …`. Read-only, GET only,
    # bound to localhost on the host side — nothing here is reachable off-machine.
    ports:
      - "127.0.0.1:9410:9410"
    command: ["run", "0"]   # holds committee keys 00..05 (6)
    volumes:
      - shared:/shared
      - data0:/data

  node1:
    <<: *node-common
    hostname: node1
    # Which release this node runs (issue #74 drill). Default = the un-armed v1.0
    # binary, so an ordinary soak is byte-for-byte what it was. soak.sh sets these
    # per-scenario; see deploy/docker/entrypoint.sh for the binary names.
    environment:
      QUMBRA_BIN: ${NODE1_BIN:-qumbra-node}
      QUMBRA_SAMPLE_SECS: ${QUMBRA_SAMPLE_SECS:-30}
      # auto (default) = this node advertises itself dialable, as every run before
      # 2026-07-30 did. none = the field is absent from its node.toml, which is what
      # the four T0 hosts run. Global for all four, or NODE1_ADVERTISE per node.
      QUMBRA_ADVERTISE_ADDR: ${NODE1_ADVERTISE:-${QUMBRA_ADVERTISE_ADDR:-auto}}
    # /v1/telemetry (issue #117), published so `qumbra-opview` can be run from the
    # host: `qumbra-opview node0=http://127.0.0.1:9410 …`. Read-only, GET only,
    # bound to localhost on the host side — nothing here is reachable off-machine.
    ports:
      - "127.0.0.1:9411:9410"
    command: ["run", "1"]   # holds committee keys 06..10 (5)
    volumes:
      - shared:/shared
      - data1:/data

  node2:
    <<: *node-common
    hostname: node2
    # Which release this node runs (issue #74 drill). Default = the un-armed v1.0
    # binary, so an ordinary soak is byte-for-byte what it was. soak.sh sets these
    # per-scenario; see deploy/docker/entrypoint.sh for the binary names.
    environment:
      QUMBRA_BIN: ${NODE2_BIN:-qumbra-node}
      QUMBRA_SAMPLE_SECS: ${QUMBRA_SAMPLE_SECS:-30}
      # auto (default) = this node advertises itself dialable, as every run before
      # 2026-07-30 did. none = the field is absent from its node.toml, which is what
      # the four T0 hosts run. Global for all four, or NODE2_ADVERTISE per node.
      QUMBRA_ADVERTISE_ADDR: ${NODE2_ADVERTISE:-${QUMBRA_ADVERTISE_ADDR:-auto}}
    # /v1/telemetry (issue #117), published so `qumbra-opview` can be run from the
    # host: `qumbra-opview node0=http://127.0.0.1:9410 …`. Read-only, GET only,
    # bound to localhost on the host side — nothing here is reachable off-machine.
    ports:
      - "127.0.0.1:9412:9410"
    command: ["run", "2"]   # holds committee keys 11..15 (5)
    volumes:
      - shared:/shared
      - data2:/data

  node3:                    # the late-joiner in the sync-from-genesis scenario
    <<: *node-common
    hostname: node3
    # Which release this node runs (issue #74 drill). Default = the un-armed v1.0
    # binary, so an ordinary soak is byte-for-byte what it was. soak.sh sets these
    # per-scenario; see deploy/docker/entrypoint.sh for the binary names.
    environment:
      QUMBRA_BIN: ${NODE3_BIN:-qumbra-node}
      QUMBRA_SAMPLE_SECS: ${QUMBRA_SAMPLE_SECS:-30}
      # auto (default) = this node advertises itself dialable, as every run before
      # 2026-07-30 did. none = the field is absent from its node.toml, which is what
      # the four T0 hosts run. Global for all four, or NODE3_ADVERTISE per node.
      QUMBRA_ADVERTISE_ADDR: ${NODE3_ADVERTISE:-${QUMBRA_ADVERTISE_ADDR:-auto}}
    # /v1/telemetry (issue #117), published so `qumbra-opview` can be run from the
    # host: `qumbra-opview node0=http://127.0.0.1:9410 …`. Read-only, GET only,
    # bound to localhost on the host side — nothing here is reachable off-machine.
    ports:
      - "127.0.0.1:9413:9410"
    command: ["run", "3"]   # holds committee keys 16..20 (5)
    volumes:
      - shared:/shared
      - data3:/data
