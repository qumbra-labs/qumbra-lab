# COLLECTING COMPARISON DATA. Still not the acceptance bar.
#
# The bar remains the rig -- CLAUDE.md section 5 -- and stays there until this
# workflow and the rig have agreed on the same number across several PRs. One
# experiment proved it CAN run; it did not prove it keeps running correctly, and
# those are different claims.
#
# ⚠️ THAT SENTENCE IS UNDER REVIEW AND IS STILL TRUE UNTIL IT IS NOT (2026-08-12,
# lab #377). #377 proposes promoting this lane to acceptance-equivalent for
# PASS/FAIL, on the strength of the agreement ledger the header above asked for:
# `docs/ci-runner-cost-decision.md` section 6 records EIGHT same-tree CI-vs-rig
# comparisons and eight agreements. The proposed CLAUDE.md wording is in the
# #377 PR body and **the coordinator ratifies it, not this file** -- so this
# header does not flip itself, and until CLAUDE.md changes, the rig is the bar.
# Measured NUMBERS are not in that proposal at all and never move here: bench
# discipline rules 1-3 keep them on the pinned rig.
#
# What two manual runs established (2026-08-01, commit 9b5cf1a):
#
#   fits     15.58 / 15.54 GB peak against 32 GB. macOS M3 measured 15.6 GB --
#            three measurements, two operating systems, one number. The memory
#            profile is architecture-independent, which was assumed and is now
#            measured.
#   passes   1029 / 0 / 1 both times, exactly the rig's count. Not "about".
#   time     34:41 cold, 33:45 warm. The cache works -- the release build
#            finished in 57s with zero Compiling lines -- so ~32 of those
#            minutes are the tests themselves. An arm64 core is ~1.8x slower
#            than the M3 Max at single-threaded work, and --test-threads=1
#            means core count cannot help. 34 minutes is this runner's floor;
#            there is no cache fix to find.
#   cost     ~$0.7 per run against a $20/month budget cap with stop-usage on.
#
# arm64 deliberately: the rig is M3 and the four T0 hosts are AWS t4g.small
# Graviton, so arm64 is the deployment architecture and not merely the dev one.
name: suite (arm64)

on:
  # Two filters, and they answer two different questions.
  #
  # `paths` -- only when Rust actually changed. A docs PR cannot fail this
  # suite, so it must not spend 34 minutes proving that; the exception every
  # acceptance comment has stated by hand is encoded here instead of restated
  # each time.
  #
  # `types: [labeled]` -- only on the tree somebody will actually READ.
  # The verification procedure is same-tree comparison: the coordinator merges
  # `main` into the PR, pushes THAT tree, and compares this run's count against
  # the rig's on it. A run triggered by a builder's intermediate push is a
  # number on a tree nobody will merge -- never read, never quoted in an
  # acceptance comment, never entered in the agreement ledger.
  #
  # Measured before this change (docs/ci-runner-cost-decision.md Section 5):
  # several PRs ran the suite two or three times against exactly one read, and
  # roughly HALF the month's spend bought numbers nobody looked at. On
  # 2026-08-02 one in-flight baton had already burned two runs on a PR that had
  # not yet been opened.
  #
  # So the suite runs when the `verify` label is applied, which is the
  # coordinator's explicit "this is the tree" -- and re-applying the label
  # re-runs it. Not `synchronize`: that is the builder-push trigger this change
  # exists to remove.
  pull_request:
    types: [labeled]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

# SECRETS POSTURE: this workflow reads NO secret and must never need one.
#
# It clones a repo the runner can already read, installs two packages from the
# distro, restores a cache, and runs the test suite. There is no registry login
# (the node image on GHCR is public), no host access, no signing key, no
# `secrets.` reference anywhere in this file -- and `qumbra-deploy` and every
# deployed host are out of scope for it by construction.
#
# So the permission grant below is the whole grant: read the contents, nothing
# else. `GITHUB_TOKEN` defaults to a wider set at the repository level, and this
# job needs none of it.
#
# 🔴 IF A CHANGE TO THIS FILE APPEARS TO NEED A SECRET, THAT IS A STOP. Do not
# add one and do not widen `permissions:` to reach around it. A workflow that
# runs pull-request code and also holds a credential is a different security
# object than this one, and the trade belongs to Larry (R3), not to the change
# that discovered it.
permissions:
  contents: read

concurrency:
  # Per PR, and superseded runs ARE cancelled here -- unlike the manual path.
  # Once a newer commit exists the older run's answer is about a tree nobody
  # will merge, so the remaining minutes buy nothing. Cancelling early is the
  # cheaper half of a paid run.
  group: suite-arm64-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    # The label gate. `types: [labeled]` fires for ANY label, so the name is
    # checked here -- otherwise adding an unrelated label would spend 34 paid
    # minutes. `workflow_dispatch` bypasses this deliberately: the manual path
    # is already an explicit act and predates the label.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'verify'
    runs-on: qumbra-arm64-8
    timeout-minutes: 120        # if it needs longer than this it is not viable
                                # as a bar anyway, and that is itself the answer

    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0

    steps:
      - uses: actions/checkout@v4

      - name: C++ toolchain for randomx-rs
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cmake g++

      - name: Provenance
        run: |
          echo "commit   $(git rev-parse HEAD)"
          uname -m; nproc; free -g | head -2
          rustc --version; cargo --version; cmake --version | head -1

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: arm64-suite-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: arm64-suite-

      # /usr/bin/time -v gives Maximum resident set size, which is question 1.
      # Kept separate from the test command's own exit code: `set -o pipefail`
      # plus tee, so a failing suite still leaves a readable log AND fails.
      - name: Full workspace suite, serial, unfiltered
        run: |
          set -o pipefail
          /usr/bin/time -v cargo test --release --workspace --locked \
            -- --test-threads=1 2>&1 | tee suite.log

      # The reconciliation, in the JOB SUMMARY rather than only in the step log.
      #
      # WHY THE SUMMARY AND NOT JUST THE LOG: the arithmetic here is the thing a
      # human actually reads at acceptance -- "your total must equal main's
      # baseline plus your new tests" (CLAUDE.md section 5). Making the reader
      # open a 40-minute log and scroll to find it is how a reconciliation gets
      # skipped. The step log keeps everything too; this only adds a surface.
      #
      # WHAT THIS STEP RULES ON: nothing. The suite step above owns pass/fail --
      # `set -o pipefail` plus tee means cargo's own exit code IS that step's
      # exit code, with no launcher in between. So the greps below are a human
      # cross-check, NOT a gate, and they are deliberately not allowed to turn a
      # green suite red:
      #
      #   `panicked at` is reachable on a GREEN run. This workspace has five
      #   `#[should_panic]` tests (`qlab-disclosure/src/air.rs` x4,
      #   `qlab-node/src/node.rs` x1). The harness captures a passing test's
      #   output, so they normally leave no line -- but a panic raised on a
      #   spawned thread escapes that capture, and this workspace is full of
      #   threaded tests. A gate that CAN fire on a correct run teaches the
      #   reader to override it, which is the alarm-nobody-reads failure
      #   `prefilter.yml` already refuses once for clippy.
      #
      # The counts are printed either way and a non-zero one is marked, so the
      # coordinator sees it without the workflow pre-empting the ruling.
      - name: Reconciliation and the four answers
        if: always()
        run: |
          # `if: always()` means this runs even when the suite step died before
          # `tee` created the log. Say so rather than reporting zeros over a
          # file that does not exist -- a reconciliation of nothing must not
          # read like a clean run.
          if [ ! -f suite.log ]; then
            echo "## Workspace suite — arm64" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "🔴 **No \`suite.log\`.** The suite step did not get far enough to write one," \
                 "so there is nothing to reconcile — this is not a zero-failure run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # grep -c exits 1 on zero matches; that is a count, not an error.
          fail_c=$(grep -c 'FAILED' suite.log || true)
          panic_c=$(grep -c 'panicked at' suite.log || true)
          err_c=$(grep -cE '^error' suite.log || true)
          mark() { [ "$1" = "0" ] && echo "OK" || echo "SEE LOG"; }

          {
            echo "## Workspace suite — arm64 (\`${GITHUB_SHA:0:12}\`)"
            echo
            echo "\`cargo test --release --workspace --locked -- --test-threads=1\`"
            echo
            echo "### Reconciliation"
            echo
            echo '| | passed | failed | ignored |'
            echo '|---|---:|---:|---:|'
            grep -E '^test result:' suite.log \
              | awk '{p+=$4; f+=$6; i+=$8} END {print "| **total** | **"p"** | **"f"** | **"i"** |"}'
            echo
            echo "The coordinator's arithmetic is \`total == main's baseline + this branch's new tests\`."
            echo "**This job does not know the baseline and does not assert one** — it reports the"
            echo "left-hand side only. The per-binary table below is here so a delta is attributable"
            echo "to a crate instead of to the workspace."
            echo
            echo "### Negatives"
            echo
            echo '| grep | count | |'
            echo '|---|---:|---|'
            echo "| \`FAILED\` (case-sensitive) | $fail_c | $(mark $fail_c) |"
            echo "| \`panicked at\` | $panic_c | $(mark $panic_c) |"
            echo "| \`^error\` | $err_c | $(mark $err_c) |"
            echo
            echo "Advisory, not a gate — see this step's comment for why \`panicked at\` is"
            echo "reachable on a green run. **Pass/fail is the suite step's exit code.**"
            echo
            echo "### Cost of the run"
            echo
            echo '```'
            grep -E 'Maximum resident set size' suite.log || echo "(time -v line not captured)"
            grep -E 'Elapsed \(wall clock\)' suite.log || true
            echo '```'
            echo
            echo "<details><summary>Per-binary counts</summary>"
            echo
            echo '| binary | passed | failed | ignored |'
            echo '|---|---:|---:|---:|'
            awk '
              /^ *(Running|Doc-tests)/ { bin = $0; sub(/^ */, "", bin); next }
              /^test result:/ {
                name = bin
                if (match(name, /\/deps\/[^)]*/))
                  name = substr(name, RSTART + 6, RLENGTH - 6)
                if (name == "") name = "(unattributed)"
                print "| `" name "` | " $4 " | " $6 " | " $8 " |"
              }
            ' suite.log
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          # The same four answers still go to the step log, unchanged in
          # substance -- a job summary is not readable from `gh run view --log`.
          echo "=== 2. counts ==="
          grep -E '^test result:' suite.log \
            | awk '{p+=$4; f+=$6; i+=$8} END {print "passed="p" failed="f" ignored="i}'
          echo "(the rig baseline is compared by the coordinator at acceptance,"
          echo " not asserted here -- this job reports, it does not rule)"
          echo "=== negatives ==="
          echo "FAILED(cs)=$fail_c  panicked=$panic_c  ^error=$err_c"
          echo "=== 1. peak memory ==="
          grep -E 'Maximum resident set size' suite.log || echo "(time -v line not captured)"
          echo "=== 3. wall time ==="
          grep -E 'Elapsed \(wall clock\)' suite.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-log
          path: suite.log
          retention-days: 14
