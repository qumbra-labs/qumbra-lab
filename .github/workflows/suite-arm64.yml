# COLLECTING COMPARISON DATA. Still not the acceptance bar.
#
# The bar remains the rig -- CLAUDE.md section 5 -- and stays there until this
# workflow and the rig have agreed on the same number across several PRs. One
# experiment proved it CAN run; it did not prove it keeps running correctly, and
# those are different claims.
#
# What two manual runs established (2026-08-01, commit 9b5cf1a):
#
#   fits     15.58 / 15.54 GB peak against 32 GB. macOS M3 measured 15.6 GB --
#            three measurements, two operating systems, one number. The memory
#            profile is architecture-independent, which was assumed and is now
#            measured.
#   passes   1029 / 0 / 1 both times, exactly the rig's count. Not "about".
#   time     34:41 cold, 33:45 warm. The cache works -- the release build
#            finished in 57s with zero Compiling lines -- so ~32 of those
#            minutes are the tests themselves. An arm64 core is ~1.8x slower
#            than the M3 Max at single-threaded work, and --test-threads=1
#            means core count cannot help. 34 minutes is this runner's floor;
#            there is no cache fix to find.
#   cost     ~$0.7 per run against a $20/month budget cap with stop-usage on.
#
# arm64 deliberately: the rig is M3 and the four T0 hosts are AWS t4g.small
# Graviton, so arm64 is the deployment architecture and not merely the dev one.
name: suite (arm64)

on:
  # Two filters, and they answer two different questions.
  #
  # `paths` -- only when Rust actually changed. A docs PR cannot fail this
  # suite, so it must not spend 34 minutes proving that; the exception every
  # acceptance comment has stated by hand is encoded here instead of restated
  # each time.
  #
  # `types: [labeled]` -- only on the tree somebody will actually READ.
  # The verification procedure is same-tree comparison: the coordinator merges
  # `main` into the PR, pushes THAT tree, and compares this run's count against
  # the rig's on it. A run triggered by a builder's intermediate push is a
  # number on a tree nobody will merge -- never read, never quoted in an
  # acceptance comment, never entered in the agreement ledger.
  #
  # Measured before this change (docs/ci-runner-cost-decision.md Section 5):
  # several PRs ran the suite two or three times against exactly one read, and
  # roughly HALF the month's spend bought numbers nobody looked at. On
  # 2026-08-02 one in-flight baton had already burned two runs on a PR that had
  # not yet been opened.
  #
  # So the suite runs when the `verify` label is applied, which is the
  # coordinator's explicit "this is the tree" -- and re-applying the label
  # re-runs it. Not `synchronize`: that is the builder-push trigger this change
  # exists to remove.
  pull_request:
    types: [labeled]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

concurrency:
  # Per PR, and superseded runs ARE cancelled here -- unlike the manual path.
  # Once a newer commit exists the older run's answer is about a tree nobody
  # will merge, so the remaining minutes buy nothing. Cancelling early is the
  # cheaper half of a paid run.
  group: suite-arm64-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    # The label gate. `types: [labeled]` fires for ANY label, so the name is
    # checked here -- otherwise adding an unrelated label would spend 34 paid
    # minutes. `workflow_dispatch` bypasses this deliberately: the manual path
    # is already an explicit act and predates the label.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'verify'
    runs-on: qumbra-arm64-8
    timeout-minutes: 120        # if it needs longer than this it is not viable
                                # as a bar anyway, and that is itself the answer

    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0

    steps:
      - uses: actions/checkout@v4

      - name: C++ toolchain for randomx-rs
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cmake g++

      - name: Provenance
        run: |
          echo "commit   $(git rev-parse HEAD)"
          uname -m; nproc; free -g | head -2
          rustc --version; cargo --version; cmake --version | head -1

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: arm64-suite-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: arm64-suite-

      # /usr/bin/time -v gives Maximum resident set size, which is question 1.
      # Kept separate from the test command's own exit code: `set -o pipefail`
      # plus tee, so a failing suite still leaves a readable log AND fails.
      - name: Full workspace suite, serial, unfiltered
        run: |
          set -o pipefail
          /usr/bin/time -v cargo test --release --workspace --locked \
            -- --test-threads=1 2>&1 | tee suite.log

      - name: The four answers
        if: always()
        run: |
          echo "=== 2. counts ==="
          grep -E '^test result:' suite.log \
            | awk '{p+=$4; f+=$6; i+=$8} END {print "passed="p" failed="f" ignored="i}'
          echo "(the rig baseline is compared by the coordinator at acceptance,"
          echo " not asserted here -- this job reports, it does not rule)"
          echo "=== negatives, all must be 0 ==="
          echo "FAILED(cs)=$(grep -c 'FAILED' suite.log)  panicked=$(grep -c 'panicked at' suite.log)"
          echo "=== 1. peak memory ==="
          grep -E 'Maximum resident set size' suite.log || echo "(time -v line not captured)"
          echo "=== 3. wall time ==="
          grep -E 'Elapsed \(wall clock\)' suite.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-log
          path: suite.log
          retention-days: 14
