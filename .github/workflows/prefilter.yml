# A PRE-FILTER. NOT the acceptance bar.
#
# The acceptance bar is, and stays, the full unfiltered workspace suite run
# serially on the rig — see CLAUDE.md §5. This workflow exists for one reason:
# four batons queueing for one machine is the project's actual bottleneck, and a
# compile error should never consume an 18-minute rig slot to be discovered.
#
# It deliberately does NOT run tests. A CI that ran "everything except the heavy
# tests" would be a filtered run reported as a pass, which is exactly what
# lab PR #166 cost us. This one cannot be mistaken for the bar because it never
# claims to have run one.
name: pre-filter

# push is restricted to main. A branch push and its PR produce DIFFERENT
# github.ref values (refs/heads/x vs refs/pull/N/merge), so the concurrency
# group below cannot merge them — an unrestricted `push:` bills every branch
# commit twice, once as push and once as pull_request. Observed on this
# workflow's own first two runs (30673165146 + 30673165522, same commit).
on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same ref. Private-repo Actions minutes are
# billed; a force-push should not pay for the run it just made irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0        # incremental is a loss on a cold CI cache

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30        # a runaway build must not bill indefinitely

    steps:
      - uses: actions/checkout@v7

      # randomx-rs builds a C++ library at compile time. cmake and g++ are
      # preinstalled on ubuntu-latest today; installing explicitly means a
      # change to the runner image fails here, loudly, instead of failing
      # inside a dependency's build script where it reads as a Rust error.
      - name: C++ toolchain for randomx-rs
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cmake g++

      # No rust-toolchain.toml exists in this repo, so CI uses whatever stable
      # the runner image ships. Printing it puts the version in every log:
      # this repo pins Plonky3 revs because "bench numbers against a moving
      # prover are meaningless", and the toolchain moves too. See the PR.
      - name: Toolchain provenance
        run: |
          rustc --version
          cargo --version
          cmake --version | head -1

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # --locked: Cargo.lock is committed and holds the pinned prover revs.
      # A CI that silently updated them would check a different tree than the
      # rig does.
      - name: cargo check --workspace --all-targets
        run: cargo check --workspace --all-targets --locked

      # lab #400: the wallet core + the ffi kernel must stay wasm32-clean — the
      # browser shell builds from exactly this graph, and the last time a wasm
      # enablement lived only on a branch it silently rotted for nine days
      # (#395's finding). Checked here so the rot is a red X, not an archaeology.
      - name: wasm32 core stays buildable
        run: |
          rustup target add wasm32-unknown-unknown
          RUSTFLAGS='--cfg getrandom_backend="wasm_js"' cargo check -p qumbra-wallet --no-default-features --target wasm32-unknown-unknown --locked
          RUSTFLAGS='--cfg getrandom_backend="wasm_js"' cargo check -p qumbra-ffi --target wasm32-unknown-unknown --locked

      # Reporting only, NOT failing. The tree has pre-existing warnings
      # (qlab-bench alone generated 37 on 2026-08-01). A gate that is red on
      # its first run teaches everyone to ignore it — the same failure as an
      # alarm at 99.9% that nobody reads again (lab issue #105). Promote to
      # `-D warnings` in a follow-up, once the baseline is zero and staying
      # there is a real signal.
      - name: cargo clippy (advisory)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked

  # ── The shell suites under .github/workflows/tests/ ─────────────────────────
  #
  # WHY THIS DOES NOT CONTRADICT THIS FILE'S HEADER. The header says this
  # workflow "deliberately does NOT run tests", and that position stands: it is
  # about the CARGO suite, and about this workflow never being mistakable for the
  # acceptance bar. Running a filtered subset of the cargo tests and reporting it
  # as a pass is lab PR #166's mistake and is still forbidden here. These suites
  # are a different animal — they exercise the RELEASE-LANE SHELL SCRIPTS against
  # captured fixtures, need no toolchain, no network, no docker and no credential,
  # and finish in about two seconds. They are a separate job so that `check`'s
  # identity above is untouched, and this job claims nothing about the crates.
  #
  # 🔴 WHY IT IS WIRED AT ALL (lab #636). All three of these suites ran NOWHERE.
  # release-assertions/run.sh said so in its own header — "NOT WIRED INTO ANY
  # WORKFLOW. It costs nothing until a human runs it" — and the cost of that was
  # exactly what #636 is: it had gone red, its ONLY positive case was the one
  # failing, and nobody knew, so the file asserted nothing about a publishable
  # artifact for two months across two separate stub regressions (#581, #605).
  # A gate whose own test nothing runs is the bug this issue is about, one level
  # up. The suites under test guard the release lane, which by construction
  # cannot be rehearsed: it runs on paid arm64 and 10x-billed macOS runners and
  # publishes to a PUBLIC repository, so a fixture run on a free runner is the
  # only place its refusals are ever exercised at all.
  shell-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      # Each suite is listed BY NAME rather than globbed. A glob would silently
      # cover a new suite, which sounds like a feature until the new suite is red
      # on arrival and this job is what everyone learns to ignore (lab #105's
      # alarm-at-99.9% argument, the same one that keeps clippy advisory above).
      # Adding a suite here should be a deliberate line in a diff.
      - name: release-assertions (the release lane's artifact gate)
        run: .github/workflows/tests/release-assertions/run.sh

      - name: release-net (the t1|t2 net selection)
        run: .github/workflows/tests/release-net/run.sh

      - name: explorer-provenance (the explorer image's readback)
        run: .github/workflows/tests/explorer-provenance/run.sh

      # `deploy/dry-run.sh` is deliberately NOT a fourth line here. It needs a
      # release `qumbra-node` — a `cargo build --release -p qumbra-node` on
      # every PR for a script that changes rarely (PR #670's objection). It has
      # its own workflow, `deploy-dryrun.yml`, gated on `paths: deploy/**` and
      # `crates/qumbra-node/**`, so it fires exactly where the gap it closes is
      # open and costs nothing elsewhere. This job stays toolchain-free.
