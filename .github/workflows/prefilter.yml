# A PRE-FILTER. NOT the acceptance bar.
#
# The acceptance bar is, and stays, the full unfiltered workspace suite run
# serially on the rig — see CLAUDE.md §5. This workflow exists for one reason:
# four batons queueing for one machine is the project's actual bottleneck, and a
# compile error should never consume an 18-minute rig slot to be discovered.
#
# It deliberately does NOT run tests. A CI that ran "everything except the heavy
# tests" would be a filtered run reported as a pass, which is exactly what
# lab PR #166 cost us. This one cannot be mistaken for the bar because it never
# claims to have run one.
name: pre-filter

# push is restricted to main. A branch push and its PR produce DIFFERENT
# github.ref values (refs/heads/x vs refs/pull/N/merge), so the concurrency
# group below cannot merge them — an unrestricted `push:` bills every branch
# commit twice, once as push and once as pull_request. Observed on this
# workflow's own first two runs (30673165146 + 30673165522, same commit).
on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same ref. Private-repo Actions minutes are
# billed; a force-push should not pay for the run it just made irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0        # incremental is a loss on a cold CI cache

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30        # a runaway build must not bill indefinitely

    steps:
      - uses: actions/checkout@v7

      # randomx-rs builds a C++ library at compile time. cmake and g++ are
      # preinstalled on ubuntu-latest today; installing explicitly means a
      # change to the runner image fails here, loudly, instead of failing
      # inside a dependency's build script where it reads as a Rust error.
      - name: C++ toolchain for randomx-rs
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cmake g++

      # No rust-toolchain.toml exists in this repo, so CI uses whatever stable
      # the runner image ships. Printing it puts the version in every log:
      # this repo pins Plonky3 revs because "bench numbers against a moving
      # prover are meaningless", and the toolchain moves too. See the PR.
      - name: Toolchain provenance
        run: |
          rustc --version
          cargo --version
          cmake --version | head -1

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # --locked: Cargo.lock is committed and holds the pinned prover revs.
      # A CI that silently updated them would check a different tree than the
      # rig does.
      - name: cargo check --workspace --all-targets
        run: cargo check --workspace --all-targets --locked

      # The lab's lints on its own sources. Each test named here READS the
      # workspace's .rs files (or manifests, or workflows) as text and asserts a
      # coding rule on them; none proves, mines, spawns a binary or opens a
      # socket, so each runs in well under a second. They are listed here
      # because they once cost a lane for nothing: PR #909's 100-minute Graviton
      # run existed to catch `genesis_form_is_matched_exhaustively_everywhere`
      # (lab #706), a 0.16-second scan. A rule a scanner states should fail
      # here, in minutes, not on the lane.
      #
      # This does not contradict the header's "does NOT run tests", for the
      # reason the shell-suites job below gives: it is not a filtered subset of
      # the cargo suite reported as a pass. It is a short list, by name, of
      # lints that happen to be written as tests, and it claims nothing about
      # the suite. Like shell-suites, each entry is a deliberate line in a diff
      # and never a glob: a new scanner is added here by hand.
      #
      # COST: not the scans, the test BUILD. `cargo check` above does not
      # produce test binaries, so each crate here pays one dev-profile test
      # build (codegen, not metadata). The first measurement of that cost is
      # this PR's own prefilter run. The cache above holds target/, so later
      # runs on a warm cache should pay only the incremental part.
      - name: source-scan tests (the lab's lints on its own sources)
        run: |
          # qlab-node, lab #559: outside qlab-node no production code calls a v4-only coinbase derivation (+ its exemption list cannot go stale)
          cargo test -p qlab-node --test coinbase_derivation_guard --locked -- --test-threads=1
          # qlab-node, lab #785 F5-5c: blocks.log is opened append-only, named only at its doors, in every production source
          cargo test -p qlab-node --lib --locked -- --test-threads=1 blocks_log_is_append_only_in_every_production_source
          # qumbra-node, lab #706: GenesisForm is matched exhaustively everywhere, never == / != / a catch-all arm (+ the scanner's own self-test)
          cargo test -p qumbra-node --test genesis_form_exhaustive --locked -- --test-threads=1
          # qumbra-node, lab #937: no == / != / matches! against L2AuthForm::CandidateA outside an explicit allowlist — format 34 is CandidateAV3, so say has_auth() / sp_outputs() / match (+ the scanner's own self-test)
          cargo test -p qumbra-node --test l2_auth_form_comparisons --locked -- --test-threads=1
          # qumbra-node, lab #238 (and #145): every ctrlc declaration is the workspace entry, which keeps `termination`
          cargo test -p qumbra-node --test ctrlc_pairing --locked -- --test-threads=1
          # qumbra-node, lab #785: no source calls the wrapper rule's test knobs; the knobs sit directly under their feature gate
          cargo test -p qumbra-node --lib --locked -- --test-threads=1 --exact bundle::tests::no_production_source_calls_a_test_knob
          # qumbra-node, lab #785: the test-knob feature is named in exactly two manifests
          cargo test -p qumbra-node --lib --locked -- --test-threads=1 --exact bundle::tests::only_two_manifests_name_the_test_knobs
          # qumbra-node, lab #785: no workflow, script or deploy recipe switches the knobs on or builds with every feature
          cargo test -p qumbra-node --lib --locked -- --test-threads=1 --exact bundle::tests::no_workflow_or_script_enables_the_test_knobs
          # qlab-devnet, lab #303: the exact-emission module's code contains no float token (the rule clippy states but the bar never runs)
          cargo test -p qlab-devnet --lib --locked -- --test-threads=1 --exact emission_exact::tests::the_module_source_contains_no_float
          # qlab-p2p, lab #86 / #289: node.rs has exactly one dial call site (one path, one cap, one backoff)
          cargo test -p qlab-p2p --lib --locked -- --test-threads=1 the_node_has_exactly_one_dial_call_site
          # qlab-bench, lab #847: no f5box source (incl. its qumbra-sequencer half) calls the wrapper rule's test knobs
          cargo test -p qlab-bench --bin qlab-bench --locked -- --test-threads=1 --exact f4::f5box::tests::f5box_calls_no_rule_knob
          # qumbra-sequencer, lab #847 S4: no source Debug-formats an opening; every Debug placeholder carries a debug-ok marker
          cargo test -p qumbra-sequencer --lib --locked -- --test-threads=1 tests::non_test_cuts_at_either_test_module_spelling tests::no_source_debug_formats_an_opening tests::every_debug_format_is_marked
          # qumbra-sequencer, lab #847 Q4 / #860 R3b: the pass plans no R member and builds no P of its own; the binary names the one real prover
          cargo test -p qumbra-sequencer --lib --locked -- --test-threads=1 tests::the_pass_plans_no_r_member tests::the_pass_builds_no_p_of_its_own tests::run_names_the_real_prover

      # lab #740: the L2-E1 pilot scenario sits behind `--features pilot` so the
      # workspace suite does not compile it (it runs as its own `verify-pilot`
      # job on the Graviton lane). The step above therefore never sees it; this
      # one does, so the pilot cannot rot between the runs that execute it.
      - name: the pilot scenario compiles (--features pilot)
        run: cargo check -p qumbra-wallet --features pilot --tests --locked

      # lab #742 (A5 lever 4a): `qlab-bench --features phasemem` is the bench
      # build behind `zkpeak --phases` (counting allocator + tracing layer). No
      # default build compiles it, so this step is what keeps it from rotting.
      - name: the phase-memory bench build compiles (--features phasemem)
        run: cargo check -p qlab-bench --features phasemem --locked

      # lab #400: the wallet core + the ffi kernel must stay wasm32-clean — the
      # browser shell builds from exactly this graph, and the last time a wasm
      # enablement lived only on a branch it silently rotted for nine days
      # (#395's finding). Checked here so the rot is a red X, not an archaeology.
      - name: wasm32 core stays buildable
        run: |
          rustup target add wasm32-unknown-unknown
          RUSTFLAGS='--cfg getrandom_backend="wasm_js"' cargo check -p qumbra-wallet --no-default-features --target wasm32-unknown-unknown --locked
          RUSTFLAGS='--cfg getrandom_backend="wasm_js"' cargo check -p qumbra-ffi --target wasm32-unknown-unknown --locked

      # lab #858 WA2: the TEST list signer (qumbra-wallet's `test-support`)
      # must not reach qumbra-ffi's release graph — native/iOS here; wasm32 is
      # also held by a compile-time assertion in qumbra-ffi's annulet.rs. The
      # `verify` line is the sentinel: a probe that sees no features at all
      # fails instead of passing on an empty tree.
      - name: the test list signer is not in qumbra-ffi's release graph
        run: |
          tree=$(cargo tree -e normal,features -p qumbra-ffi -i qumbra-wallet --locked)
          echo "$tree"
          echo "$tree" | grep -q 'qumbra-wallet feature "verify"' || { echo "probe broken: no qumbra-wallet feature line"; exit 1; }
          if echo "$tree" | grep -q 'feature "test-support"'; then
            echo "qumbra-wallet's test-support reached qumbra-ffi's release graph"; exit 1
          fi

      # Reporting only, NOT failing. The tree has pre-existing warnings
      # (qlab-bench alone generated 37 on 2026-08-01). A gate that is red on
      # its first run teaches everyone to ignore it — the same failure as an
      # alarm at 99.9% that nobody reads again (lab issue #105). Promote to
      # `-D warnings` in a follow-up, once the baseline is zero and staying
      # there is a real signal.
      - name: cargo clippy (advisory)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked

  # ── The shell suites under .github/workflows/tests/ ─────────────────────────
  #
  # WHY THIS DOES NOT CONTRADICT THIS FILE'S HEADER. The header says this
  # workflow "deliberately does NOT run tests", and that position stands: it is
  # about the CARGO suite, and about this workflow never being mistakable for the
  # acceptance bar. Running a filtered subset of the cargo tests and reporting it
  # as a pass is lab PR #166's mistake and is still forbidden here. These suites
  # are a different animal — they exercise the RELEASE-LANE SHELL SCRIPTS against
  # captured fixtures, need no toolchain, no network, no docker and no credential,
  # and finish in about two seconds. They are a separate job so that `check`'s
  # identity above is untouched, and this job claims nothing about the crates.
  #
  # 🔴 WHY IT IS WIRED AT ALL (lab #636). All three of these suites ran NOWHERE.
  # release-assertions/run.sh said so in its own header — "NOT WIRED INTO ANY
  # WORKFLOW. It costs nothing until a human runs it" — and the cost of that was
  # exactly what #636 is: it had gone red, its ONLY positive case was the one
  # failing, and nobody knew, so the file asserted nothing about a publishable
  # artifact for two months across two separate stub regressions (#581, #605).
  # A gate whose own test nothing runs is the bug this issue is about, one level
  # up. The suites under test guard the release lane, which by construction
  # cannot be rehearsed: it runs on paid arm64 and 10x-billed macOS runners and
  # publishes to a PUBLIC repository, so a fixture run on a free runner is the
  # only place its refusals are ever exercised at all.
  shell-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      # Each suite is listed BY NAME rather than globbed. A glob would silently
      # cover a new suite, which sounds like a feature until the new suite is red
      # on arrival and this job is what everyone learns to ignore (lab #105's
      # alarm-at-99.9% argument, the same one that keeps clippy advisory above).
      # Adding a suite here should be a deliberate line in a diff.
      - name: release-assertions (the release lane's artifact gate)
        run: .github/workflows/tests/release-assertions/run.sh

      - name: release-net (the t1|t2 net selection)
        run: .github/workflows/tests/release-net/run.sh

      - name: explorer-provenance (the explorer image's readback)
        run: .github/workflows/tests/explorer-provenance/run.sh

      # The acceptance lane's reconciliation against two REAL suite.log
      # artifacts (lab #691): the "this run was cut off — these counts are
      # partial" branch fires only when a 50-minute Graviton suite is killed,
      # which nobody rehearses, so this is the only place it ever executes.
      # One case in it calls the runner's preinstalled cargo for
      # `cargo metadata --no-deps` on a three-line fixture workspace — a
      # manifest read, not a build; the job stays toolchain-free in the
      # sense that matters (nothing here compiles a crate).
      - name: suite-reconcile (the acceptance lane's truncation detector)
        run: .github/workflows/tests/suite-reconcile/run.sh

      # `deploy/dry-run.sh` is deliberately NOT a fourth line here. It needs a
      # release `qumbra-node` — a `cargo build --release -p qumbra-node` on
      # every PR for a script that changes rarely (PR #670's objection). It has
      # its own workflow, `deploy-dryrun.yml`, gated on `paths: deploy/**` and
      # `crates/qumbra-node/**`, so it fires exactly where the gap it closes is
      # open and costs nothing elsewhere. This job stays toolchain-free.
