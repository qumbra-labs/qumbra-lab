# The remote prover image (lab #924, Candidate A): built here, never on a laptop.
#
# WHY THIS FILE EXISTS: `ghcr.io/qumbra-labs/qumbra-prover-service` was last pushed
# by hand for the valueless L1 experiment, before the Annulet mode existed. The
# prover host (qumbra-deploy `terraform/prover-1`) pins an image by digest, and a
# digest nothing in CI can re-derive is the gap node-image.yml exists to close.
# Same shape as that file's `image` job, minus its drift alarm: the prover carries
# no consensus constants, and a stale prover image endangers no running node.
#
# Manual only, gated on typing `confirm=build`: an image build is a deliberate
# act. Native arm64 on the standard hosted arm runner (free for this public repo),
# no QEMU — the prover host is Graviton.
name: prover image

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "build" to build and push the prover image. Anything else does nothing.'
        required: false
        default: ""

concurrency:
  group: prover-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    name: build + push the prover image (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'build'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: jq for the provenance readback
        run: command -v jq >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends jq)

      - name: Provenance
        run: |
          echo "commit   $(git rev-parse HEAD)"
          uname -m; nproc; free -g | head -2
          docker --version; docker buildx version

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        run: |
          set -euo pipefail
          REV=$(git rev-parse HEAD); SHORT=$(git rev-parse --short HEAD)
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          TAG="annulet-$SHORT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # The prover's own stage, named explicitly: the Dockerfile's last stage
          # is the fleet node image. The description label is set HERE, not by
          # editing the Dockerfile's stale "valueless-only" LABEL: deploy/docker/
          # Dockerfile is on node-image.yml's drift path list, and touching it
          # would report the fleet node image STALE for a prover-only change.
          docker build -f deploy/docker/Dockerfile --target runtime-prover-service \
            --platform linux/arm64 --load \
            --build-arg GIT_REVISION="$REV" \
            --label "org.opencontainers.image.description=Remote prover: Candidate A holder spends (Annulet mode, submits the proved tx) and the L1 valueless experiment; each mode off unless configured." \
            -t "ghcr.io/${{ github.repository_owner }}/qumbra-prover-service:$TAG" .

      - name: Verify the binary BEFORE the push
        run: |
          set -euo pipefail
          T="ghcr.io/${{ github.repository_owner }}/qumbra-prover-service:${{ steps.build.outputs.tag }}"
          EXP_REV=$(git rev-parse HEAD)
          # It runs, and it is the Annulet-capable binary (its help names the mode).
          docker run --rm "$T" --help | tee help.txt
          grep -qF "QUMBRA_PROVER_ANNULET_" help.txt || { echo "::error::the binary's help names no Annulet mode — not the prover this host needs"; exit 1; }
          # The build rev reached the compiler: the stamp is compiled in
          # (QUMBRA_BUILD_REV, read by build_revision()), so the binary carries
          # the commit string. A stamp nothing reads back can silently fail to
          # apply (lab #590).
          n=$(docker run --rm --entrypoint sh "$T" -c "grep -c '$EXP_REV' /usr/local/bin/qumbra-prover-service || true")
          echo "build rev occurrences in the binary: ${n:-0}"
          [ "${n:-0}" -ge 1 ] || { echo "::error::the binary does not carry $EXP_REV — QUMBRA_BUILD_REV did not reach the builder stage"; exit 1; }
          # It runs as the unprivileged user the compose file expects.
          U=$(docker run --rm --entrypoint id "$T" -u)
          [ "$U" = "10001" ] || { echo "::error::the image runs as uid '$U', the prover host expects 10001"; exit 1; }
          echo "binary verification: OK"

      - name: Push
        run: docker push "ghcr.io/${{ github.repository_owner }}/qumbra-prover-service:${{ steps.build.outputs.tag }}"

      - name: Read the provenance back from the registry
        run: |
          set -euo pipefail
          T="ghcr.io/${{ github.repository_owner }}/qumbra-prover-service:${{ steps.build.outputs.tag }}"
          DIG=$(docker buildx imagetools inspect "$T" --format '{{.Manifest.Digest}}')
          echo "digest: $DIG"
          # Per-platform `.Image` read with jq, never `{{json .}}` or grep
          # (node-image.yml, lab #428).
          GOT=$(docker buildx imagetools inspect "$T" --format '{{json .Image}}' \
                | jq -r '.config.Labels["org.opencontainers.image.revision"] // .Config.Labels["org.opencontainers.image.revision"] // empty')
          [ "$GOT" = "${{ steps.build.outputs.rev }}" ] || { echo "::error::provenance mismatch — registry says '$GOT', built from ${{ steps.build.outputs.rev }}"; exit 1; }
          DESC=$(docker buildx imagetools inspect "$T" --format '{{json .Image}}' \
                 | jq -r '.config.Labels["org.opencontainers.image.description"] // .Config.Labels["org.opencontainers.image.description"] // empty')
          case "$DESC" in *"Annulet mode"*) ;; *) echo "::error::the description label is '$DESC' — the build-time override did not apply"; exit 1 ;; esac
          echo "provenance OK: $GOT"
          echo ""
          echo "Pin in qumbra-deploy (compose/docker-compose.prover-1.yml):"
          echo "  image: ghcr.io/${{ github.repository_owner }}/qumbra-prover-service@$DIG"
