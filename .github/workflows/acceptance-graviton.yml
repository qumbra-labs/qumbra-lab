# THE ON-DEMAND GRAVITON LANE. Deploy #130's S2 half — the yaml side of a
# machine that exists as a STOPPED m7g.2xlarge and runs only while a suite runs.
#
# This is the acceptance suite lane. Its hosted start/stop jobs wake persistent
# AWS instances, the self-hosted suite job runs the bar with a warm `target/`,
# and the stop job parks the iron afterward. The former GitHub-hosted comparison
# lane was retired in e9bf14c after its comparison finished; there is no sibling
# acceptance workflow to keep in sync or use as fallback.
#
# THE CONTRACT WITH THE DEPLOY HALF (deploy #130 S1/S3/S4, coordinator-
# executed): three repository VARIABLES, set after `terraform/ci-runner/` is
# applied. Instance identity never belongs in yaml.
#
#   vars.CI_RUNNER_INSTANCE_ID   the one instance the role may touch
#   vars.CI_RUNNER_ROLE_ARN      IAM role, trust pinned to this repo via OIDC
#   vars.CI_RUNNER_REGION        us-east-1 at S1, but the vars are the truth
#
# Until all three are set, the start job refuses BY NAME at its first step —
# a missing var must read as "deploy half not landed", never as an opaque
# AWS error.
#
# SECRETS POSTURE: this workflow reads NO secret and must never need one.
# Repository variables are not secrets; the AWS credential is a ~15-minute
# OIDC session token that exists only inside the start/stop jobs, scoped by
# the role's policy to start/stop/describe ON THIS ONE INSTANCE. No AWS key
# is stored anywhere in GitHub (deploy #130 S3: zero long-lived keys).
# `id-token: write` below is the OIDC mechanism itself, not a data grant —
# it lets the job mint its own identity assertion and nothing else. The
# suite job holds neither: `contents: read` is its whole grant.
# 🔴 IF A CHANGE TO THIS FILE APPEARS TO NEED A SECRET, THAT IS A STOP (S7) —
# do not add one, do not widen a grant to reach around it.
#
# THE STOP-SAFETY INVARIANT: concurrent PRs must not stop each other's iron.
# The stop job runs `if: always()` — deliberately not `!cancelled()`, so a
# manually cancelled run still parks the instance — but it stops the
# instance ONLY after listing this workflow's OTHER runs and finding none
# queued or in progress. The race that check cannot close (a run created in
# the same second the stop lands) is harmless: the newcomer's start job
# starts the instance right back up, `start-instances` being idempotent on
# a running instance exactly as `stop-instances` is on a stopped one. The
# belt-and-suspenders for a lost stop job entirely is ON the instance, not
# here: S1's idle watchdog (no runner job for 2 h ⇒ shutdown), so a red stop
# job is a cost bug, never an overnight burn.
name: suite (graviton-rig)

on:
  # Recovered from suite-arm64.yml, retired e9bf14c: the two filters answer
  # different questions. `paths` runs the bar only when Rust or its dependency
  # graph changed; a docs/workflow-only PR cannot fail it and should not wake
  # the rig. `types: [labeled]` runs only on a tree the coordinator intends to
  # read, rather than every intermediate builder push. `verify-graviton` is
  # that explicit "this is the tree" signal; re-applying it reruns the current
  # head, while `workflow_dispatch` remains the deliberate manual path.
  pull_request:
    types: [labeled]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
  # The first live calibration run (S6) arrives here, on main.
  workflow_dispatch:

concurrency:
  # Per PR, superseded runs are cancelled because their answer is about a tree
  # nobody will merge. Cancellation does not bypass the stop job: `if: always()`
  # runs on a cancelled run too, and its check sees the superseding run as
  # active, so the iron stays up for it.
  group: acceptance-graviton-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Deny-all at the top; each job states its own whole grant.
permissions: {}

jobs:
  # ── job A ── wake the instance. A free hosted runner spends ~a minute of
  # billed time to save an hour of idle Graviton.
  start:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'verify-graviton'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write   # OIDC only; no checkout, no contents
      actions: read     # count this workflow's active runs for the queue-depth start
    steps:
      - name: The contract, or refuse by name
        env:
          INSTANCE_ID: ${{ vars.CI_RUNNER_INSTANCE_ID }}
          ROLE_ARN: ${{ vars.CI_RUNNER_ROLE_ARN }}
          REGION: ${{ vars.CI_RUNNER_REGION }}
        run: |
          missing=0
          [ -n "$INSTANCE_ID" ] || { echo "::error::repo variable CI_RUNNER_INSTANCE_ID is unset — deploy #130's terraform half not landed?"; missing=1; }
          [ -n "$ROLE_ARN" ]    || { echo "::error::repo variable CI_RUNNER_ROLE_ARN is unset — deploy #130's terraform half not landed?"; missing=1; }
          [ -n "$REGION" ]      || { echo "::error::repo variable CI_RUNNER_REGION is unset — deploy #130's terraform half not landed?"; missing=1; }
          exit $missing

      - name: Assume the runner-control role (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.CI_RUNNER_ROLE_ARN }}
          aws-region: ${{ vars.CI_RUNNER_REGION }}

      # Queue-depth-proportional start (Larry's order, 2026-08-19): one
      # active run needs one instance; the second wakes only when a second
      # run is actually in the lane. Depth = this workflow's non-completed
      # runs INCLUDING this one (queued/in_progress/waiting/pending all
      # count — the same conservative direction as the stop guard, and the
      # same asymmetry: an extra start costs cents, a missed one costs a
      # queued wait). Idempotent per instance: starting a running instance
      # is a no-op, so two concurrent runs computing depth=2 both starting
      # both instances is harmless.
      # Known trade vs start-them-all: if the ONE instance we start has a
      # dead runner service, the suite sits queued (bounded: GitHub queue
      # limit + the 2 h idle watchdog on the woken instance) where the old
      # behavior might have been saved by the second box. Priced, accepted.
      - name: Start as many instances as the queue needs
        env:
          INSTANCE_ID: ${{ vars.CI_RUNNER_INSTANCE_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/acceptance-graviton.yml/runs?per_page=100" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')
          [ "$active" -ge 1 ] || active=1
          set -- $INSTANCE_ID   # unquoted on purpose: space-separated LIST (deploy #184)
          want=$active; [ "$want" -gt $# ] && want=$#
          to_start=$(printf '%s\n' "$@" | head -n "$want" | tr '\n' ' ')
          echo "queue depth $active → starting $want of $# instance(s): $to_start"
          aws ec2 start-instances --instance-ids $to_start
          aws ec2 wait instance-running --instance-ids $to_start
          aws ec2 describe-instances --instance-ids $to_start \
            --query 'Reservations[].Instances[].[InstanceId,State.Name]' --output text

      # WHY THERE IS NO "poll until the runner reports online" STEP, though
      # deploy #130 S2 asks for one: listing a repo's self-hosted runners
      # (GET /repos/{r}/actions/runners) requires `administration: read`,
      # a permission the workflow GITHUB_TOKEN cannot be granted at all —
      # the only way to that endpoint is a PAT, i.e. a stored secret, which
      # is S7's stop. The queue does the job instead: the suite job below
      # targets [self-hosted, graviton-rig] and GitHub holds it queued until
      # that runner registers online (the runner is persistent, so it exists
      # even while stopped — a queued wait, not a "no runner" hard fail).
      # Known bound: if the runner service never comes up, the suite job
      # sits queued until GitHub's queue limit; the instance itself is
      # protected by S1's 2 h idle watchdog, so the sat-queued failure mode
      # costs minutes of hosted time, not a night of Graviton.

  # ── job B ── the bar on the self-hosted Graviton rig.
  suite:
    needs: start
    runs-on: [self-hosted, graviton-rig]
    timeout-minutes: 120      # beyond this it is not viable as the bar
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0

    steps:
      - uses: actions/checkout@v7

      # THE WARM CACHE LIVES OUTSIDE THE WORKSPACE, DELIBERATELY.
      # actions/checkout cleans the work tree (`git clean -ffdx`) on a
      # persistent runner, so a `target/` inside the workspace would be
      # deleted at the top of every run — silently rebuilding cold each
      # time while S1 pays for 150 GB of gp3 to avoid exactly that. No
      # actions/cache either: the disk IS the cache. `~/.cargo` (registry,
      # git db) persists on its own for the same reason.
      - name: Persistent target dir (the warm cache S1 exists for)
        run: |
          echo "CARGO_TARGET_DIR=$HOME/.cache/qumbra-lab-target" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.cache/qumbra-lab-target"

      # No toolchain install step: S1 provisions rustc/cargo/cmake/g++ into
      # the image, and this job must not assume passwordless sudo. If the
      # provenance below cannot find a tool, that is a deploy-half defect
      # to report, not something this file papers over with apt-get.
      - name: Provenance
        run: |
          echo "commit   $(git rev-parse HEAD)"
          uname -m; nproc; free -g | head -2
          rustc --version; cargo --version; cmake --version | head -1
          echo "target   $CARGO_TARGET_DIR"; df -h "$HOME" | tail -1

      # THE BAR (CLAUDE.md §5) — this command, verbatim. §5 quotes it; if the
      # command changes, §5 changes in the same PR.
      #
      # `--no-fail-fast` (lab #691): without it cargo stops at the first failing
      # BINARY and the reconciliation below printed the partial sums in the
      # same table as a complete run — run 32922325707 executed 25 of 143
      # result sets and reported `passed=836 failed=1 ignored=3`. On a green
      # run the flag changes nothing; on a red run one cycle returns every
      # failure instead of the next single one.
      #
      # `--test-threads=1` STAYS. Not a parallelism change: two 12 GB proves at
      # once do not fit (windows-x86_64.yml's memory rationale, unchanged).
      #
      # `suite.exit` is written ONLY after cargo returns, with its exit code. Its
      # absence is how the reconciliation knows the step was cut off (timeout,
      # OOM of cargo itself, eviction, cancel) rather than finished. `rc` is
      # cargo's own code via pipefail; the step still exits with it, so pass/
      # fail stays this step's exit code and nothing else's.
      - name: Full workspace suite, serial, unfiltered
        run: |
          set -o pipefail
          rc=0
          # suite.log stays RAW (the reconcile script parses it); the job console gets a
          # wall-clock stamp per line so a watcher can see where the run is and what each
          # test cost — libtest's own --report-time is nightly-only (asked 2026-09-23).
          /usr/bin/time -v cargo test --release --workspace --locked --no-fail-fast \
            -- --test-threads=1 2>&1 | tee suite.log \
            | awk '{ print strftime("[%H:%M:%S]"), $0; fflush() }' || rc=$?
          echo "$rc" > suite.exit
          exit "$rc"

      # The reconciliation — the job-summary table a human reads at acceptance,
      # and (lab #691) the sentence that says when the numbers are PARTIAL.
      # Same non-gate posture as ever: pass/fail is the suite step's exit code;
      # the greps are a human cross-check and are not allowed to turn a green
      # suite red — the script exits 0 on every path, including its loud ones.
      # The body lives in scripts/reconcile-suite.sh so that its truncation
      # branch can be exercised against saved logs (tests/suite-reconcile/,
      # run by prefilter.yml); the rationale is in that script's header.
      #
      # `if: always()` is WHY the truncation detector exists: a run cut off by
      # `timeout-minutes`, an OOM or an eviction still reaches this step, and
      # without the check it would print 25 binaries' worth of counts with the
      # same confidence as 143.
      - name: Reconciliation and the four answers
        if: always()
        env:
          SUITE_LANE: graviton-rig
        run: bash .github/workflows/scripts/reconcile-suite.sh suite.log suite.exit

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: suite-log-graviton
          path: |
            suite.log
            suite.exit
          retention-days: 14

  # ── job C ── park the instance, unless someone else is using the lane.
  stop:
    needs: [start, suite]
    # `always()` so a failed or cancelled suite still parks the iron — but
    # re-gated on the same label condition as `start` (`types: [labeled]`
    # fires for ANY label, and a skipped start must not leave an always()
    # stop job free to park an instance somebody started by hand), and on
    # the vars being set at all (before the deploy half lands there is no
    # instance to stop, and one named red job — start's — beats two).
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.label.name == 'verify-graviton') &&
      vars.CI_RUNNER_INSTANCE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write         # OIDC for the stop call
      actions: read           # list this workflow's runs for the guard below
    steps:
      # ONLY stop when no OTHER run of THIS workflow is active. One API
      # call, no status enumeration: anything not `completed` (queued,
      # in_progress, waiting, pending, requested) counts as active — the
      # conservative direction, since the failure modes are asymmetric: a
      # skipped stop costs at most 2 h of watchdog-bounded idle, a wrong
      # stop kills a live suite mid-run.
      #
      # 🔴 THIS COUNTS ONLY THIS WORKFLOW'S RUNS, AND THAT IS LOAD-BEARING.
      # It is correct precisely because acceptance-graviton is the lane's ONLY
      # user. The day a second workflow is given `runs-on: [self-hosted,
      # graviton-rig]`, this guard becomes wrong in the DANGEROUS direction:
      # that build would be running on a rig this job believes nobody is using,
      # and this job would park the iron out from under it. The `start` job's
      # queue-depth count carries the same single-user assumption.
      #
      # So adding a second user of the rigs is NOT a one-line `runs-on` change.
      # Occupancy has to become lane-wide first: count the non-completed runs of
      # EVERY workflow targeting the rigs, from one list both jobs read.
      #
      # For whoever builds that — the direct question, "is any graviton runner
      # busy?", is NOT reachable from a workflow. GET /repos/{repo}/actions/runners
      # needs `administration: read`, which a workflow GITHUB_TOKEN cannot be
      # granted at all; the only route is a stored PAT, which deploy #130 S7
      # refuses. Run-counting is the reachable proxy. (A local operator CAN ask it;
      # qumbra-deploy's terraform/ci-runner/apply.sh does.)
      #
      # Costed and DECLINED 2026-08-21: moving explorer-image/node-image here would
      # have required it, and the saving was ~$1.7/month once paid-runner EXECUTIONS
      # were counted rather than workflow RUNS — those workflows are
      # workflow_dispatch-gated and reach the paid runner ~2 times in 40 runs. The
      # ARM SKU's spend was ~91% suite-arm64, now retired.
      - name: Is any other run using the lane?
        id: lane
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          active=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/acceptance-graviton.yml/runs?per_page=100" \
            --jq "[.workflow_runs[] | select(.id != $RUN_ID) | select(.status != \"completed\")] | length")
          echo "active=$active" >> "$GITHUB_OUTPUT"
          if [ "$active" -eq 0 ]; then
            echo "lane free — stopping the instance" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "$active other run(s) queued or in progress — leaving the instance up for them" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Assume the runner-control role (OIDC)
        if: steps.lane.outputs.active == '0'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.CI_RUNNER_ROLE_ARN }}
          aws-region: ${{ vars.CI_RUNNER_REGION }}

      # Idempotent: stopping a stopped (or never-started) instance is a
      # no-op, so a run whose start job failed before the instance woke
      # still ends green here rather than red on a phantom.
      - name: Stop the instance
        if: steps.lane.outputs.active == '0'
        env:
          INSTANCE_ID: ${{ vars.CI_RUNNER_INSTANCE_ID }}
        run: |
          aws ec2 stop-instances --instance-ids $INSTANCE_ID # unquoted: space-separated list
          aws ec2 describe-instances --instance-ids $INSTANCE_ID \
            --query 'Reservations[].Instances[].[InstanceId,State.Name]' --output text
