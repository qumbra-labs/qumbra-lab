# THE ON-DEMAND GRAVITON LANE. Deploy #130's S2 half — the yaml side of a
# machine that exists as a STOPPED m7g.2xlarge and runs only while a suite runs.
#
# This is a different RUNNER LANE, not a second copy of the suite lane:
# `suite-arm64.yml` is the GitHub-hosted lane (`qumbra-arm64-8`, per-minute
# billing, fresh VM + actions/cache every run); this file starts a persistent
# AWS instance whose warm `target/` is the whole point, runs the same bar on
# it, and stops it after. Per deploy #130 S6, the hosted lane STAYS
# dispatchable as fallback/overflow — the default moves to `graviton-rig`
# only after the first live suite passes here, and that flip is the
# coordinator's, not this file's.
#
# THE CONTRACT WITH THE DEPLOY HALF (deploy #130 S1/S3/S4, coordinator-
# executed): three repository VARIABLES, set after `terraform/ci-runner/` is
# applied. Instance identity never belongs in yaml.
#
#   vars.CI_RUNNER_INSTANCE_ID   the one instance the role may touch
#   vars.CI_RUNNER_ROLE_ARN      IAM role, trust pinned to this repo via OIDC
#   vars.CI_RUNNER_REGION        us-east-1 at S1, but the vars are the truth
#
# Until all three are set, the start job refuses BY NAME at its first step —
# a missing var must read as "deploy half not landed", never as an opaque
# AWS error.
#
# SECRETS POSTURE: this workflow reads NO secret and must never need one.
# Repository variables are not secrets; the AWS credential is a ~15-minute
# OIDC session token that exists only inside the start/stop jobs, scoped by
# the role's policy to start/stop/describe ON THIS ONE INSTANCE. No AWS key
# is stored anywhere in GitHub (deploy #130 S3: zero long-lived keys).
# `id-token: write` below is the OIDC mechanism itself, not a data grant —
# it lets the job mint its own identity assertion and nothing else. The
# suite job holds neither: it gets `contents: read`, exactly like
# suite-arm64's. 🔴 IF A CHANGE TO THIS FILE APPEARS TO NEED A SECRET, THAT
# IS A STOP (S7) — do not add one, do not widen a grant to reach around it.
#
# THE STOP-SAFETY INVARIANT: concurrent PRs must not stop each other's iron.
# The stop job runs `if: always()` — deliberately not `!cancelled()`, so a
# manually cancelled run still parks the instance — but it stops the
# instance ONLY after listing this workflow's OTHER runs and finding none
# queued or in progress. The race that check cannot close (a run created in
# the same second the stop lands) is harmless: the newcomer's start job
# starts the instance right back up, `start-instances` being idempotent on
# a running instance exactly as `stop-instances` is on a stopped one. The
# belt-and-suspenders for a lost stop job entirely is ON the instance, not
# here: S1's idle watchdog (no runner job for 2 h ⇒ shutdown), so a red stop
# job is a cost bug, never an overnight burn.
name: suite (graviton-rig)

on:
  # Same two filters as suite-arm64.yml, same two questions — see the long
  # rationale there; it is not restated. The label differs BY NAME:
  # `verify-graviton` instead of `verify`, so the coordinator chooses the
  # lane per tree and applying one label can never bill both. While S6
  # holds, `verify` stays the acceptance default and this label is the
  # explicit "run it on the rig-to-be".
  pull_request:
    types: [labeled]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
  # The first live calibration run (S6) arrives here, on main.
  workflow_dispatch:

concurrency:
  # Per PR, superseded runs cancelled — as suite-arm64. Cancellation does not
  # bypass the stop job: `if: always()` runs on a cancelled run too, and its
  # check sees the superseding run as active, so the iron stays up for it.
  group: acceptance-graviton-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Deny-all at the top; each job states its own whole grant.
permissions: {}

jobs:
  # ── job A ── wake the instance. A free hosted runner spends ~a minute of
  # billed time to save an hour of idle Graviton.
  start:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'verify-graviton'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write   # OIDC only; no checkout, no contents
    steps:
      - name: The contract, or refuse by name
        env:
          INSTANCE_ID: ${{ vars.CI_RUNNER_INSTANCE_ID }}
          ROLE_ARN: ${{ vars.CI_RUNNER_ROLE_ARN }}
          REGION: ${{ vars.CI_RUNNER_REGION }}
        run: |
          missing=0
          [ -n "$INSTANCE_ID" ] || { echo "::error::repo variable CI_RUNNER_INSTANCE_ID is unset — deploy #130's terraform half not landed?"; missing=1; }
          [ -n "$ROLE_ARN" ]    || { echo "::error::repo variable CI_RUNNER_ROLE_ARN is unset — deploy #130's terraform half not landed?"; missing=1; }
          [ -n "$REGION" ]      || { echo "::error::repo variable CI_RUNNER_REGION is unset — deploy #130's terraform half not landed?"; missing=1; }
          exit $missing

      - name: Assume the runner-control role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CI_RUNNER_ROLE_ARN }}
          aws-region: ${{ vars.CI_RUNNER_REGION }}

      # Idempotent: on an already-running instance this is a no-op that
      # reports the current state — which is exactly what a second
      # concurrent PR wants.
      - name: Start the instance and wait for `running`
        env:
          INSTANCE_ID: ${{ vars.CI_RUNNER_INSTANCE_ID }}
        run: |
          aws ec2 start-instances --instance-ids "$INSTANCE_ID"
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
          aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' --output text

      # WHY THERE IS NO "poll until the runner reports online" STEP, though
      # deploy #130 S2 asks for one: listing a repo's self-hosted runners
      # (GET /repos/{r}/actions/runners) requires `administration: read`,
      # a permission the workflow GITHUB_TOKEN cannot be granted at all —
      # the only way to that endpoint is a PAT, i.e. a stored secret, which
      # is S7's stop. The queue does the job instead: the suite job below
      # targets [self-hosted, graviton-rig] and GitHub holds it queued until
      # that runner registers online (the runner is persistent, so it exists
      # even while stopped — a queued wait, not a "no runner" hard fail).
      # Known bound: if the runner service never comes up, the suite job
      # sits queued until GitHub's queue limit; the instance itself is
      # protected by S1's 2 h idle watchdog, so the sat-queued failure mode
      # costs minutes of hosted time, not a night of Graviton.

  # ── job B ── the bar, verbatim, on the rig-to-be.
  suite:
    needs: start
    runs-on: [self-hosted, graviton-rig]
    timeout-minutes: 120      # same figure, same reason as suite-arm64
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0

    steps:
      - uses: actions/checkout@v4

      # THE WARM CACHE LIVES OUTSIDE THE WORKSPACE, DELIBERATELY.
      # actions/checkout cleans the work tree (`git clean -ffdx`) on a
      # persistent runner, so a `target/` inside the workspace would be
      # deleted at the top of every run — silently rebuilding cold each
      # time while S1 pays for 150 GB of gp3 to avoid exactly that. No
      # actions/cache either: the disk IS the cache. `~/.cargo` (registry,
      # git db) persists on its own for the same reason.
      - name: Persistent target dir (the warm cache S1 exists for)
        run: |
          echo "CARGO_TARGET_DIR=$HOME/.cache/qumbra-lab-target" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.cache/qumbra-lab-target"

      # No toolchain install step: S1 provisions rustc/cargo/cmake/g++ into
      # the image, and this job must not assume passwordless sudo. If the
      # provenance below cannot find a tool, that is a deploy-half defect
      # to report, not something this file papers over with apt-get.
      - name: Provenance
        run: |
          echo "commit   $(git rev-parse HEAD)"
          uname -m; nproc; free -g | head -2
          rustc --version; cargo --version; cmake --version | head -1
          echo "target   $CARGO_TARGET_DIR"; df -h "$HOME" | tail -1

      # Identical command to suite-arm64's — it is the bar (CLAUDE.md §5)
      # and the whole comparison depends on it not drifting.
      - name: Full workspace suite, serial, unfiltered
        run: |
          set -o pipefail
          /usr/bin/time -v cargo test --release --workspace --locked \
            -- --test-threads=1 2>&1 | tee suite.log

      # The reconciliation, verbatim in substance from suite-arm64.yml —
      # same table, same non-gate posture (pass/fail is the suite step's
      # exit code; the greps are a human cross-check and are not allowed to
      # turn a green suite red — see the long rationale there). If that
      # step changes shape, change BOTH files in the same PR.
      - name: Reconciliation and the four answers
        if: always()
        run: |
          if [ ! -f suite.log ]; then
            echo "## Workspace suite — graviton-rig" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "🔴 **No \`suite.log\`.** The suite step did not get far enough to write one," \
                 "so there is nothing to reconcile — this is not a zero-failure run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          fail_c=$(grep -c 'FAILED' suite.log || true)
          panic_c=$(grep -c 'panicked at' suite.log || true)
          err_c=$(grep -cE '^error' suite.log || true)
          mark() { [ "$1" = "0" ] && echo "OK" || echo "SEE LOG"; }

          {
            echo "## Workspace suite — graviton-rig (\`${GITHUB_SHA:0:12}\`)"
            echo
            echo "\`cargo test --release --workspace --locked -- --test-threads=1\`"
            echo
            echo "### Reconciliation"
            echo
            echo '| | passed | failed | ignored |'
            echo '|---|---:|---:|---:|'
            grep -E '^test result:' suite.log \
              | awk '{p+=$4; f+=$6; i+=$8} END {print "| **total** | **"p"** | **"f"** | **"i"** |"}'
            echo
            echo "The coordinator's arithmetic is \`total == main's baseline + this branch's new tests\`."
            echo "**This job does not know the baseline and does not assert one** — it reports the"
            echo "left-hand side only. The per-binary table below is here so a delta is attributable"
            echo "to a crate instead of to the workspace."
            echo
            echo "### Negatives"
            echo
            echo '| grep | count | |'
            echo '|---|---:|---|'
            echo "| \`FAILED\` (case-sensitive) | $fail_c | $(mark $fail_c) |"
            echo "| \`panicked at\` | $panic_c | $(mark $panic_c) |"
            echo "| \`^error\` | $err_c | $(mark $err_c) |"
            echo
            echo "Advisory, not a gate — see suite-arm64.yml's step comment for why \`panicked at\`"
            echo "is reachable on a green run. **Pass/fail is the suite step's exit code.**"
            echo
            echo "### Cost of the run"
            echo
            echo '```'
            grep -E 'Maximum resident set size' suite.log || echo "(time -v line not captured)"
            grep -E 'Elapsed \(wall clock\)' suite.log || true
            echo '```'
            echo
            echo "<details><summary>Per-binary counts</summary>"
            echo
            echo '| binary | passed | failed | ignored |'
            echo '|---|---:|---:|---:|'
            awk '
              /^ *(Running|Doc-tests)/ { bin = $0; sub(/^ */, "", bin); next }
              /^test result:/ {
                name = bin
                if (match(name, /\/deps\/[^)]*/))
                  name = substr(name, RSTART + 6, RLENGTH - 6)
                if (name == "") name = "(unattributed)"
                print "| `" name "` | " $4 " | " $6 " | " $8 " |"
              }
            ' suite.log
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "=== 2. counts ==="
          grep -E '^test result:' suite.log \
            | awk '{p+=$4; f+=$6; i+=$8} END {print "passed="p" failed="f" ignored="i}'
          echo "(the rig baseline is compared by the coordinator at acceptance,"
          echo " not asserted here -- this job reports, it does not rule)"
          echo "=== negatives ==="
          echo "FAILED(cs)=$fail_c  panicked=$panic_c  ^error=$err_c"
          echo "=== 1. peak memory ==="
          grep -E 'Maximum resident set size' suite.log || echo "(time -v line not captured)"
          echo "=== 3. wall time ==="
          grep -E 'Elapsed \(wall clock\)' suite.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-log-graviton
          path: suite.log
          retention-days: 14

  # ── job C ── park the instance, unless someone else is using the lane.
  stop:
    needs: [start, suite]
    # `always()` so a failed or cancelled suite still parks the iron — but
    # re-gated on the same label condition as `start` (`types: [labeled]`
    # fires for ANY label, and a skipped start must not leave an always()
    # stop job free to park an instance somebody started by hand), and on
    # the vars being set at all (before the deploy half lands there is no
    # instance to stop, and one named red job — start's — beats two).
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.label.name == 'verify-graviton') &&
      vars.CI_RUNNER_INSTANCE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write         # OIDC for the stop call
      actions: read           # list this workflow's runs for the guard below
    steps:
      # ONLY stop when no OTHER run of THIS workflow is active. One API
      # call, no status enumeration: anything not `completed` (queued,
      # in_progress, waiting, pending, requested) counts as active — the
      # conservative direction, since the failure modes are asymmetric: a
      # skipped stop costs at most 2 h of watchdog-bounded idle, a wrong
      # stop kills a live suite mid-run.
      - name: Is any other run using the lane?
        id: lane
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          active=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/acceptance-graviton.yml/runs?per_page=100" \
            --jq "[.workflow_runs[] | select(.id != $RUN_ID) | select(.status != \"completed\")] | length")
          echo "active=$active" >> "$GITHUB_OUTPUT"
          if [ "$active" -eq 0 ]; then
            echo "lane free — stopping the instance" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "$active other run(s) queued or in progress — leaving the instance up for them" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Assume the runner-control role (OIDC)
        if: steps.lane.outputs.active == '0'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CI_RUNNER_ROLE_ARN }}
          aws-region: ${{ vars.CI_RUNNER_REGION }}

      # Idempotent: stopping a stopped (or never-started) instance is a
      # no-op, so a run whose start job failed before the instance woke
      # still ends green here rather than red on a phantom.
      - name: Stop the instance
        if: steps.lane.outputs.active == '0'
        env:
          INSTANCE_ID: ${{ vars.CI_RUNNER_INSTANCE_ID }}
        run: |
          aws ec2 stop-instances --instance-ids "$INSTANCE_ID"
          aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' --output text
