# The prebuilt-binary release lane (lab #437 step 2b).
#
# WHY THIS FILE EXISTS: today a stranger's only path onto T1 is Docker. That is a
# real adoption filter — Larry's own words on #437, "容器对很多用户有点难" — and the
# native-macOS verification that unblocked this lane (40 accepted, finalized blocks
# in ~100 minutes, #437) removed the last reason to keep the door container-only.
# This workflow publishes `qumbra-node` + `qumbra-wallet` + `qumbra-pool`
# archives to the PUBLIC repo's Releases so the path becomes download →
# verify → run. `qumbra-pool` ships on every platform the node does (it needs
# RandomX, the same constraint). Lab #516.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS FILE COSTS, STATED BEFORE ANYTHING ELSE
#
# `macos-14` is GitHub-hosted arm64 and bills PRIVATE-repo minutes at a 10x
# multiplier. This repo's CI budget is a $20/month cap with `Stop usage: Yes`
# (docs/ci-runner-cost-decision.md §4, measured 2026-08-02), and `qumbra-arm64-8`
# already draws on it at ~$0.014/min. **Exhausting that cap stops `suite-arm64.yml`
# too** — i.e. an expensive release cut can take the ACCEPTANCE BAR down with it,
# which is a worse failure than a release that did not happen. Three consequences,
# all deliberate:
#
#   1. `workflow_dispatch` ONLY, gated on typing `confirm=release`. This file has
#      no push trigger, no schedule, and must never grow one. (node-image.yml took
#      the same shape for the same reason and its header says so.)
#   2. The legs run **cheapest-first, each gating the next** (`needs:`). Linux is
#      1x, Windows 2x, macOS 10x — so the order is linux → windows → macos, and a
#      compile error, a drifted frozen digest or a dead genesis URL costs zero
#      expensive minutes. It costs wall-clock instead, which is the cheap side of
#      that trade. (Lab #478 added the Windows leg and put it here rather than in
#      parallel with macOS for exactly this reason: parallel would mean a Windows
#      compile error still burns a 10x macOS build.)
#   3. The secret and the publish target are checked in a FREE `preflight` job
#      before a single expensive minute is spent. Discovering a missing PAT after
#      three platform builds is the shape of waste this ordering exists to prevent.
#
# ─────────────────────────────────────────────────────────────────────────────
# THE LOAD-BEARING ASSERTION: every published node binary must be the RESUME build
#
# A bare `cargo build -p qumbra-node` is the ARMED variant — it halts at 8,640 and
# cannot follow today's chain (`crates/qumbra-node/src/release.rs`, "arming is the
# default and resuming is the flag"). #437's own preflight caught this on a human,
# and #397 is the record of what it costs when it reaches a deployed artifact: the
# public faucet sat frozen at the boundary for ~24 h. Publishing an ARMED tarball
# would hand every stranger that same dead end, with no operator able to fix it.
#
# So each artifact is interrogated with `qumbra-node halt-status` AFTER it is built
# and BEFORE anything is packaged, and the job fails on:
#   - a `halt plan:` that is not `no halt scheduled`
#   - a missing `resumes past: height 8640` line
#   - the literal string `ARMED` appearing anywhere in the output
#   - a frozen digest — declared OR recomputed-from-constants — that is not the pin
#   - `validate:` not reporting OK
# The frozen-digest half is borrowed verbatim from node-image.yml, and for the same
# reason: a consensus binary's "did it really build what I think" question is "are
# its constants the consensus constants". It is a pin, so a legitimate re-genesis
# WILL fail this file until the pin is updated here — that is the intended cost.
#
# ─────────────────────────────────────────────────────────────────────────────
# PROVENANCE, AND THE THING A TARBALL CANNOT DO
#
# The fleet image proves what it is through its `org.opencontainers.image.revision`
# OCI label. **A tarball has no labels.** So lab #437 adds `QUMBRA_BUILD_REV`: both
# binaries read it at compile time and print it — `qumbra-node halt-status` on the
# `build rev:` line, `qumbra-wallet --help` in its header. This workflow stamps the
# lab commit and then GREPS ITS OWN VALUE BACK OUT of each built binary, so a build
# that ignored the env var cannot be published as though it had honoured it.
#
# What this lane does NOT claim: **the builds are not bit-reproducible** and no
# attempt is made to make them so. "Reproducible provenance" here means an artifact
# can be tied to a revision (stamp + SHA256SUMS + release notes), not that a third
# party can rebuild the same bytes.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY THE LINUX LEGS BUILD INSIDE `rust:1.95-bookworm` RATHER THAN ON THE RUNNER
#
# A binary built on the runner's own Ubuntu 24.04 image links against glibc 2.39
# and then REFUSES TO START on Debian 12 (glibc 2.36) — which is what the fleet
# runs, what deploy/README assumes, and a very likely stranger's box. Building in
# the same `rust:1.95-bookworm` image `deploy/docker/Dockerfile` already uses puts
# the floor at 2.36 and reuses a toolchain recipe this project has proven against
# randomx-rs on both architectures. The artifact name says `-glibc` because these
# are dynamically linked against it; no musl/static build is offered or implied.
#
# ─────────────────────────────────────────────────────────────────────────────
# THE CROSS-REPO SECRET — [manual] Larry creates this, the workflow never skips
#
#   Secret name:  PUBLIC_RELEASE_TOKEN          (repository secret, on qumbra-lab)
#   Kind:         fine-grained personal access token
#   Repository:   qumbra-labs/qumbra   (the PUBLIC repo — NOT this one)
#   Permission:   Contents: Read and write     (that is the only one needed)
#
# The source is private and the artifacts are public, so the publish hop crosses a
# repo boundary that `GITHUB_TOKEN` cannot: its `permissions:` block is scoped to
# THIS repository, and no amount of widening it here reaches qumbra-labs/qumbra.
# When the secret is absent this workflow FAILS LOUDLY IN PREFLIGHT with the four
# lines above — it does not skip the publish step and it does not "succeed with no
# release", because a green run that published nothing is exactly the outcome
# nobody would investigate.
name: release binaries

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "release" to spend paid runner minutes (incl. 10x-billed macOS) and publish to the PUBLIC repo. Anything else does nothing.'
        required: true
        default: ""
      net:
        description: 'Which net to cut. t2 is the default (post-cutover). t1 stays reachable so an old T1 release can still be re-cut. A T2 cut BEFORE the seed host is repointed fails in preflight — see select-release-net.sh.'
        type: choice
        options:
          - t2
          - t1
        default: t2
      publish:
        description: 'draft = assets attached, release invisible until a human clicks Publish (default). prerelease = immediately public, flagged pre-release.'
        type: choice
        options:
          - draft
          - prerelease
        default: draft

# One release cut at a time. NOT cancel-in-progress: a half-cancelled run that has
# already created the release but not uploaded every asset leaves a public download
# page with missing platforms, which is worse than a queued job.
concurrency:
  group: release-binaries
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Tag prefix, GENESIS_HASH, the smoke's pin, and DIAL_PEERS are NOT here.
  # They were the four T1-hardwired sites (lab #516). They are selected by the
  # `net` dispatch input in preflight (scripts/select-release-net.sh) and passed
  # to later jobs as outputs. Default net is t2; T1's values stay reachable.
  #
  # The frozen consensus config the fleet runs, and the resume release's identity.
  # Same three pins node-image.yml asserts; kept as literals in both files on
  # purpose — a shared value would have to live somewhere neither file owns.
  # Re-checked against current main 2026-08-20 (lab #516 item 4): release.rs
  # REVISION_V1_1_EXACT_EMISSION / REVISION_V1_0 frozen_digest_hex, revision.rs
  # the same digest, node-image.yml FROZEN_PIN + resume EXP_DOMAIN, and
  # qlab_devnet::emission_exact::RULE_BOUNDARY_HEIGHT = 8_640. Unchanged.
  FROZEN_PIN: a54e73ce3d1c4fe9984d06b08f99b7577ed1db452b87abd712cf85ce5f3e7b5b
  EXPECTED_REVISION: v1.1-exact-emission
  EXPECTED_DOMAIN: 56447169ab09956fcb78e8fb79a7cf2b502bd42194960226f83da2fb64db20b0
  RULE_BOUNDARY_HEIGHT: "8640"
  PUBLIC_REPO: qumbra-labs/qumbra

# Every run step assumes bash (`set -euo pipefail`). On ubuntu/macos runners bash
# is the default, but inside a job `container:` the runner falls back to `sh`
# (dash), which rejects `-o pipefail` — the first dispatch died exactly there
# (run 31990079176, linux-aarch64 leg, before any build work). One default,
# workflow-wide: bash exists in rust:1.95-bookworm and on every hosted runner.
defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: the free checks — net pin, secret, target repo, tag
    if: inputs.confirm == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rev: ${{ steps.rev.outputs.rev }}
      short: ${{ steps.rev.outputs.short }}
      tag: ${{ steps.rev.outputs.tag }}
      target_sha: ${{ steps.target.outputs.sha }}
      net: ${{ steps.pins.outputs.net }}
      genesis_url: ${{ steps.pins.outputs.genesis_url }}
      genesis_hash: ${{ steps.pins.outputs.genesis_hash }}
      dial_peers: ${{ steps.pins.outputs.dial_peers }}
    steps:
      - uses: actions/checkout@v4

      # Lab #516: the smoke verifies the PUBLISHED genesis, so a T2 release can
      # only be cut AFTER cutover has repointed seed.qumbra.org. This step is
      # the cheap refusal — it fetches the file, keccak256s it, and dies with
      # 'published genesis is still t1 — run this after the cutover' if the
      # selected net is t2 and the host still serves T1. Paid runners never
      # start. Dry-run: NET=t2 bash .github/workflows/scripts/select-release-net.sh
      - name: Select net pins — refuse a pre-cutover T2
        id: pins
        env:
          NET: ${{ inputs.net }}
        run: bash .github/workflows/scripts/select-release-net.sh

      # ─────────────────────────────────────────────────────────────────────
      # WHY THE TAG IS A DATE AND NOT THE COMMIT (changed 2026-08-21)
      #
      # It used to be `${TAG_PREFIX}-$SHORT`, e.g. `t2-a89dce6`. That named the
      # source exactly — and named it a SECOND time, because the artifact
      # already carries it: `QUMBRA_BUILD_REV` is stamped into both binaries at
      # compile time, printed by `qumbra-node halt-status` on the `build rev:`
      # line, and GREPPED BACK OUT of each built binary by this workflow, so a
      # build that ignored the stamp cannot be published as though it had not.
      #
      # The tag's own job is different: it is the string a human PICKS FROM A
      # LIST. `t2-a89dce6` versus `t2-3241275` tells nobody which is newer, and
      # on 2026-08-20 we cut three releases in one day and could not order them
      # by eye. A date can. So the tag now does the thing only it can do, and
      # stops duplicating the thing the binary already proves.
      # (`qumbra-design/derived-not-duplicated.md`.)
      #
      # 🔴 ZERO-PADDED, DELIBERATELY. `2026.8.9` sorts AFTER `2026.8.21` as a
      # string, and tag lists, `sort` and `ls` are all string sorts — an unpadded
      # date scheme loses the single property it was adopted for.
      #
      # 🔴 UTC, DELIBERATELY. GitHub stamps releases in UTC and shows that date
      # beside the tag; a tag on the operator's local date would disagree with
      # the timestamp printed next to it, which is precisely the confusion this
      # change exists to remove.
      #
      # The serial `-N` is the Nth cut of that UTC day, read from the tags that
      # already exist rather than remembered.
      # ─────────────────────────────────────────────────────────────────────
      - name: Revision and tag
        id: rev
        env:
          TAG_PREFIX: ${{ steps.pins.outputs.tag_prefix }}
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          PUBLIC_REPO: ${{ vars.PUBLIC_REPO || 'qumbra-labs/qumbra' }}
        run: |
          set -euo pipefail
          REV=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y.%m.%d)

          # Nth cut of this UTC day. Read the published tags rather than guess;
          # `|| true` so an empty release list (or a transient API failure that
          # gh reports as no rows) does not abort — but see the guard below,
          # which refuses a tag that already exists, so a miscount cannot
          # silently overwrite a release.
          EXISTING=$(gh release list --repo "$PUBLIC_REPO" --limit 200 \
                       --json tagName --jq '.[].tagName' 2>/dev/null || true)
          N=$(printf '%s\n' "$EXISTING" \
                | sed -n "s/^${TAG_PREFIX}-${DATE}-\([0-9][0-9]*\)$/\1/p" \
                | sort -n | tail -1)
          N=$(( ${N:-0} + 1 ))
          TAG="${TAG_PREFIX}-${DATE}-${N}"

          # 🔴 Shape guard. A tag is a string somebody's code typed; nothing
          # downstream validates it. If the scheme is ever edited by hand and
          # loses its padding, this stops the release instead of publishing an
          # artifact that sorts wrong forever.
          case "$TAG" in
            t[0-9]-[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-[0-9]*) : ;;
            *)
              echo "::error::computed tag '$TAG' is not t<net>-YYYY.MM.DD-N (zero-padded)" >&2
              exit 1
              ;;
          esac

          # 🔴 Never reuse a tag. If the serial was miscounted — an API hiccup,
          # a release deleted by hand — this refuses rather than clobbering a
          # published release whose SHA256SUMS are already in the world.
          if printf '%s\n' "$EXISTING" | grep -qx "$TAG"; then
            echo "::error::tag $TAG already exists on $PUBLIC_REPO — refusing to republish" >&2
            exit 1
          fi

          {
            echo "rev=$REV"
            echo "short=$SHORT"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          echo "lab revision : $REV"
          echo "release tag  : $TAG   (cut $N of $DATE UTC)"
          echo "build rev    : $SHORT   — stamped into the binaries, not into the tag"
          echo "net          : ${{ inputs.net }}"

      - name: The cross-repo PAT must exist — fail loudly, never skip
        env:
          TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::PUBLIC_RELEASE_TOKEN is not set on this repository, so nothing can be published."
            echo ""
            echo "[manual] Create it (Larry — this step is deliberately not automatable):"
            echo "  1. github.com/settings/personal-access-tokens → Generate new token (fine-grained)"
            echo "  2. Resource owner: qumbra-labs   Repository access: ONLY qumbra-labs/qumbra"
            echo "  3. Repository permissions → Contents: Read and write   (nothing else is needed)"
            echo "  4. Save the token as a repository secret on qumbra-labs/qumbra-lab named:"
            echo ""
            echo "       PUBLIC_RELEASE_TOKEN"
            echo ""
            echo "GITHUB_TOKEN cannot do this: its permissions are scoped to this repository and"
            echo "the artifacts are published to a different one."
            exit 1
          fi
          echo "PUBLIC_RELEASE_TOKEN is present (value never printed)."

      - name: The token can actually see the public repo
        id: target
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          # Reachability is a hard gate: an expired or wrong-owner token discovered
          # here costs nothing, and discovered after three builds costs the run.
          if ! OUT=$(gh api "repos/${PUBLIC_REPO}" 2>&1); then
            echo "::error::PUBLIC_RELEASE_TOKEN cannot read ${PUBLIC_REPO} — expired, revoked, or scoped to the wrong repository. Nothing was built and nothing was published."
            echo "$OUT"
            exit 1
          fi
          PUSH=$(echo "$OUT" | jq -r '.permissions.push // false')
          SHA=$(gh api "repos/${PUBLIC_REPO}/commits/$(echo "$OUT" | jq -r .default_branch)" --jq .sha)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "publish target: ${PUBLIC_REPO}@$SHA"
          # Write access is WARNED, not failed. `permissions.push` is the clearest
          # signal available without actually writing, but fine-grained tokens have
          # been known to report it conservatively — and a false hard-fail here
          # would block a legitimate release behind a workflow edit. The fatal case
          # (token cannot see the repo at all) is caught above; this one is loud.
          if [ "$PUSH" != "true" ]; then
            echo "::warning::${PUBLIC_REPO} reports push=false for this token. If the publish step 403s, Contents: Read and write is the permission to add."
          fi

  linux:
    name: build ${{ matrix.platform }}
    needs: preflight
    # A release needs all three platforms, so one dead leg means no release and
    # cancelling its sibling is the cheap outcome. (This cannot reach the macOS
    # job — that one is gated on `needs` instead, which is stronger.)
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x86_64-glibc
            runner: ubuntu-latest
          - platform: linux-aarch64-glibc
            runner: qumbra-arm64-8
    runs-on: ${{ matrix.runner }}
    container:
      image: rust:1.95-bookworm
    timeout-minutes: 90
    env:
      GENESIS_URL: ${{ needs.preflight.outputs.genesis_url }}
      GENESIS_HASH: ${{ needs.preflight.outputs.genesis_hash }}
      DIAL_PEERS: ${{ needs.preflight.outputs.dial_peers }}
      NET: ${{ needs.preflight.outputs.net }}
    steps:
      - uses: actions/checkout@v4

      - name: C++ toolchain for randomx-rs
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends cmake clang libclang-dev build-essential ca-certificates curl jq
      - name: Build provenance
        run: |
          set -euo pipefail
          rustc -V; cargo -V; uname -m
          ldd --version | sed -n 1p
          echo "lab revision: ${{ needs.preflight.outputs.rev }}"

      - name: Build the node — RESUME variant, and only the resume variant
        env:
          QUMBRA_BUILD_REV: ${{ needs.preflight.outputs.rev }}
          # Lab #527: `qumbra-node mine` used to bake ONE net's genesis hash as a
          # Rust literal, so the T2 release downloaded the correct T2 genesis and
          # refused it. These two stamps are the same preflight outputs the smoke
          # and the packaging already use — and `genesis_hash` is not read off a
          # shelf, it is what select-release-net.sh keccak256'd off the file
          # actually being served at GENESIS_URL. The artifact gate below greps
          # it back out of the built binary.
          QUMBRA_NET: ${{ needs.preflight.outputs.net }}
          QUMBRA_GENESIS_HASH: ${{ needs.preflight.outputs.genesis_hash }}
        run: cargo build --release --locked -p qumbra-node --features rule-boundary-resume

      - name: Build the wallet
        env:
          QUMBRA_BUILD_REV: ${{ needs.preflight.outputs.rev }}
        run: cargo build --release --locked -p qumbra-wallet

      - name: Build the pool — RandomX, same constraint as the node
        env:
          QUMBRA_BUILD_REV: ${{ needs.preflight.outputs.rev }}
        run: cargo build --release --locked -p qumbra-pool

      - name: Assert the artifacts — resume, frozen digest, build stamp
        run: bash .github/workflows/scripts/assert-release-artifacts.sh
        env:
          NODE_BIN: target/release/qumbra-node
          WALLET_BIN: target/release/qumbra-wallet
          POOL_BIN: target/release/qumbra-pool
          EXPECTED_BUILD_REV: ${{ needs.preflight.outputs.rev }}

      - name: Smoke — `check` against the PUBLISHED genesis, the way a joiner starts
        run: bash .github/workflows/scripts/smoke-release-artifacts.sh
        env:
          NODE_BIN: target/release/qumbra-node

      - name: Package
        run: bash .github/workflows/scripts/package-release-artifacts.sh
        env:
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ needs.preflight.outputs.tag }}
          LAB_REV: ${{ needs.preflight.outputs.rev }}

      - uses: actions/upload-artifact@v4
        with:
          name: qumbra-${{ needs.preflight.outputs.tag }}-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  windows:
    name: build windows-x86_64
    # Gated on both Linux legs (lab #478). 2x-billed, so it sits between the 1x
    # Linux legs and the 10x macOS one — see the cost header.
    #
    # THREE THINGS ARE DIFFERENT HERE AND ALL THREE ARE FORCED BY THE PLATFORM:
    #
    #   1. It builds ON Windows and does not cross-compile TO it. randomx-rs's
    #      build script guards its `advapi32` link with `cfg!(target_os =
    #      "windows")`, which in a build script evaluates the HOST — a cross-build
    #      from Linux would silently omit it.
    #   2. The C++ generator is discovered from `vswhere` rather than assumed. The
    #      `cmake` crate panics with "couldn't determine visual studio generator"
    #      when it cannot recognise the install, and an opaque panic inside a
    #      dependency is the worst place for this to surface.
    #   3. The artifact is a **zip**, not a tar.gz, and the binaries carry `.exe`.
    #      `package-release-artifacts.sh` derives both from `$PLATFORM`, so the two
    #      cannot disagree, and it reads the finished archive back to prove the
    #      layout is the one the join doc documents.
    needs: [preflight, linux]
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GENESIS_URL: ${{ needs.preflight.outputs.genesis_url }}
      GENESIS_HASH: ${{ needs.preflight.outputs.genesis_hash }}
      DIAL_PEERS: ${{ needs.preflight.outputs.dial_peers }}
      NET: ${{ needs.preflight.outputs.net }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain — pinned to the same rustc the other legs use
        run: |
          set -euo pipefail
          rustup toolchain install 1.95 --profile minimal --no-self-update
          rustup default 1.95
          rustc -V; cargo -V
          rustc -vV | sed -n 's/^host: /host triple: /p'
          command -v cmake >/dev/null || { echo "::error::cmake is missing from the windows-latest image — randomx-rs cannot build"; exit 1; }
          cmake --version | sed -n 1p

      - name: The C++ generator, discovered rather than assumed
        run: bash .github/workflows/scripts/windows-cmake-generator.sh

      - name: Build the node — RESUME variant, and only the resume variant
        env:
          QUMBRA_BUILD_REV: ${{ needs.preflight.outputs.rev }}
          # Lab #527: `qumbra-node mine` used to bake ONE net's genesis hash as a
          # Rust literal, so the T2 release downloaded the correct T2 genesis and
          # refused it. These two stamps are the same preflight outputs the smoke
          # and the packaging already use — and `genesis_hash` is not read off a
          # shelf, it is what select-release-net.sh keccak256'd off the file
          # actually being served at GENESIS_URL. The artifact gate below greps
          # it back out of the built binary.
          QUMBRA_NET: ${{ needs.preflight.outputs.net }}
          QUMBRA_GENESIS_HASH: ${{ needs.preflight.outputs.genesis_hash }}
        run: cargo build --release --locked -p qumbra-node --features rule-boundary-resume

      - name: Build the wallet
        env:
          QUMBRA_BUILD_REV: ${{ needs.preflight.outputs.rev }}
        run: cargo build --release --locked -p qumbra-wallet

      - name: Build the pool — RandomX, same constraint as the node
        env:
          QUMBRA_BUILD_REV: ${{ needs.preflight.outputs.rev }}
        run: cargo build --release --locked -p qumbra-pool

      - name: Assert the artifacts — resume, frozen digest, build stamp
        run: bash .github/workflows/scripts/assert-release-artifacts.sh
        env:
          NODE_BIN: target/release/qumbra-node.exe
          WALLET_BIN: target/release/qumbra-wallet.exe
          POOL_BIN: target/release/qumbra-pool.exe
          EXPECTED_BUILD_REV: ${{ needs.preflight.outputs.rev }}

      - name: Smoke — `check` against the PUBLISHED genesis, the way a joiner starts
        run: bash .github/workflows/scripts/smoke-release-artifacts.sh
        env:
          NODE_BIN: target/release/qumbra-node.exe

      - name: Package
        run: bash .github/workflows/scripts/package-release-artifacts.sh
        env:
          PLATFORM: windows-x86_64
          TAG: ${{ needs.preflight.outputs.tag }}
          LAB_REV: ${{ needs.preflight.outputs.rev }}

      - uses: actions/upload-artifact@v4
        with:
          name: qumbra-${{ needs.preflight.outputs.tag }}-windows-x86_64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  macos:
    name: build macos-arm64
    # Gated on the Linux legs AND the Windows leg. This is the 10x-billed leg, and
    # every class of failure the cheaper legs can find — compile error,
    # frozen-digest drift, an unreachable genesis URL, a build stamp that did not
    # take — is a failure this leg would find too, later and more expensively.
    needs: [preflight, linux, windows]
    runs-on: macos-14
    timeout-minutes: 120
    env:
      GENESIS_URL: ${{ needs.preflight.outputs.genesis_url }}
      GENESIS_HASH: ${{ needs.preflight.outputs.genesis_hash }}
      DIAL_PEERS: ${{ needs.preflight.outputs.dial_peers }}
      NET: ${{ needs.preflight.outputs.net }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain — pinned to the same rustc the Linux legs and the fleet use
        run: |
          set -euo pipefail
          # `macos-14` ships whatever stable it shipped with; pinning 1.95 keeps one
          # toolchain across all three artifacts of a single release, which is worth
          # more than the few minutes the install costs.
          rustup toolchain install 1.95 --profile minimal --no-self-update
          rustup default 1.95
          rustc -V; cargo -V; uname -m; sw_vers
          # randomx-rs builds its C++ chain with cmake. Preinstalled on this image
          # today; assert rather than assume, so an image change fails here by name
          # instead of inside a dependency's build script.
          command -v cmake >/dev/null || { echo "::error::cmake is missing from the macos-14 image — add a brew install step"; exit 1; }
          cmake --version | sed -n 1p

      - name: Build the node — RESUME variant, and only the resume variant
        env:
          QUMBRA_BUILD_REV: ${{ needs.preflight.outputs.rev }}
          # Lab #527: `qumbra-node mine` used to bake ONE net's genesis hash as a
          # Rust literal, so the T2 release downloaded the correct T2 genesis and
          # refused it. These two stamps are the same preflight outputs the smoke
          # and the packaging already use — and `genesis_hash` is not read off a
          # shelf, it is what select-release-net.sh keccak256'd off the file
          # actually being served at GENESIS_URL. The artifact gate below greps
          # it back out of the built binary.
          QUMBRA_NET: ${{ needs.preflight.outputs.net }}
          QUMBRA_GENESIS_HASH: ${{ needs.preflight.outputs.genesis_hash }}
        run: cargo build --release --locked -p qumbra-node --features rule-boundary-resume

      - name: Build the wallet
        env:
          QUMBRA_BUILD_REV: ${{ needs.preflight.outputs.rev }}
        run: cargo build --release --locked -p qumbra-wallet

      - name: Build the pool — RandomX, same constraint as the node
        env:
          QUMBRA_BUILD_REV: ${{ needs.preflight.outputs.rev }}
        run: cargo build --release --locked -p qumbra-pool

      - name: Assert the artifacts — resume, frozen digest, build stamp
        run: bash .github/workflows/scripts/assert-release-artifacts.sh
        env:
          NODE_BIN: target/release/qumbra-node
          WALLET_BIN: target/release/qumbra-wallet
          POOL_BIN: target/release/qumbra-pool
          EXPECTED_BUILD_REV: ${{ needs.preflight.outputs.rev }}

      # Acceptance item (c): the macos-arm64 artifact is smoke-run ON a macOS runner.
      # #437's live verification was a hand-built binary on Larry's laptop; this is
      # the same claim made by the lane that publishes it.
      - name: Smoke — `check` against the PUBLISHED genesis, the way a joiner starts
        run: bash .github/workflows/scripts/smoke-release-artifacts.sh
        env:
          NODE_BIN: target/release/qumbra-node

      - name: Package
        run: bash .github/workflows/scripts/package-release-artifacts.sh
        env:
          PLATFORM: macos-arm64
          TAG: ${{ needs.preflight.outputs.tag }}
          LAB_REV: ${{ needs.preflight.outputs.rev }}

      - uses: actions/upload-artifact@v4
        with:
          name: qumbra-${{ needs.preflight.outputs.tag }}-macos-arm64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish (${{ inputs.publish }}) to the public repo
    needs: [preflight, linux, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: incoming
          merge-multiple: true

      - name: Assemble SHA256SUMS — and refuse a partial release
        id: assemble
        run: |
          set -euo pipefail
          mkdir -p release
          find incoming -name '*.tar.gz' -exec mv {} release/ \;
          find incoming -name '*.zip'    -exec mv {} release/ \;
          find incoming -name '*.sha256' -exec mv {} release/ \;
          cd release
          # FOUR platforms or nothing (three until lab #478 added windows-x86_64).
          # A release page missing an architecture is the silent-truncation shape
          # this project keeps paying for: it looks complete to everyone except
          # the person whose platform is absent.
          #
          # The Windows artifact is a `.zip` and the other three are `.tar.gz`, so
          # the count is taken over BOTH extensions — a check that still only
          # counted tarballs would read "3 of 3, fine" on a release whose Windows
          # leg silently produced nothing, which is precisely the failure this
          # block exists to refuse.
          COUNT=$(ls -1 *.tar.gz *.zip 2>/dev/null | wc -l)
          [ "$COUNT" -eq 4 ] || { echo "::error::expected 4 platform archives, found $COUNT — refusing to publish a partial release"; ls -la; exit 1; }
          for p in linux-x86_64-glibc linux-aarch64-glibc macos-arm64; do
            ls -1 *"$p".tar.gz >/dev/null || { echo "::error::no tarball for $p"; exit 1; }
          done
          ls -1 *windows-x86_64.zip >/dev/null || { echo "::error::no zip for windows-x86_64"; exit 1; }
          # Re-verify each digest against the file that arrived, then concatenate.
          # The per-platform .sha256 was computed on the machine that built it; this
          # proves the artifact upload/download round trip did not alter it.
          cat *.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS
          rm -f *.sha256
          echo "--- SHA256SUMS ---"; cat SHA256SUMS

      - name: Release notes
        run: bash .github/workflows/scripts/release-notes.sh
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          LAB_REV: ${{ needs.preflight.outputs.rev }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NET: ${{ needs.preflight.outputs.net }}
          GENESIS_HASH: ${{ needs.preflight.outputs.genesis_hash }}
          GENESIS_URL: ${{ needs.preflight.outputs.genesis_url }}

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
          MODE: ${{ inputs.publish }}
          NET: ${{ needs.preflight.outputs.net }}
        run: |
          set -euo pipefail
          case "$MODE" in
            draft)      FLAGS=(--draft) ;;
            prerelease) FLAGS=(--prerelease) ;;
            *) echo "::error::unknown publish mode '$MODE'"; exit 1 ;;
          esac
          case "$NET" in
            t1) NET_LABEL=T1 ;;
            t2) NET_LABEL=T2 ;;
            *) echo "::error::unknown net '$NET'"; exit 1 ;;
          esac
          # --target pins the tag to a commit read in preflight rather than to
          # whatever the mirror's default branch happens to be seconds from now.
          if ! gh release create "$TAG" \
                --repo "$PUBLIC_REPO" \
                --target "$TARGET_SHA" \
                --title "Qumbra ${NET_LABEL} — prebuilt binaries ($TAG · rev ${{ needs.preflight.outputs.short }})" \
                --notes-file release-notes.md \
                "${FLAGS[@]}" \
                release/*.tar.gz release/*.zip release/SHA256SUMS; then
            echo "::error::gh release create failed. If this was a 403, PUBLIC_RELEASE_TOKEN is missing Contents: Read and write on ${PUBLIC_REPO} (preflight warns about this and cannot prove it without writing)."
            exit 1
          fi
          echo "published ($MODE): ${{ github.server_url }}/${PUBLIC_REPO}/releases/tag/$TAG"

      - name: Read the release back
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          # The lesson of lab #224/#428, ported from images to files: what the API
          # says is on the release is the only evidence that the upload landed.
          gh release view "$TAG" --repo "$PUBLIC_REPO" --json isDraft,isPrerelease,assets \
            --jq '{draft: .isDraft, prerelease: .isPrerelease, assets: [.assets[].name]}'
          N=$(gh release view "$TAG" --repo "$PUBLIC_REPO" --json assets --jq '[.assets[].name] | length')
          [ "$N" -eq 5 ] || { echo "::error::expected 5 assets (3 tarballs + 1 windows zip + SHA256SUMS) on the release, the API reports $N"; exit 1; }
          echo ""
          echo "Next, and it is a human step: the join doc's binary path quotes this tag and"
          echo "these digests. Sync docs/join-and-mine{,-zh}.md to the public mirror, and tell"
          echo "the announcement lane the download path is live."
