# The explorer image: an alarm that is nearly free, and a build that is not.
#
# WHY THIS FILE EXISTS, measured rather than supposed:
#
# `explorer-api` on svc0 ran `sha-d48c7bc` from 2026-08-07 to 2026-08-11 because
# NOTHING REBUILDS THIS IMAGE. That single hand-built version was the only one on
# GHCR, so there was nothing to roll to. It was found by grepping the running
# binary, which returned 0 for both `KNOWN_SCAR` and `s_atomic_exact` — i.e. it
# carried none of PR #325. `qumbra-deploy/OPERATOR.md` had recorded the gap
# ("neither repo has a working GHCR workflow today") on 2026-08-07 and recording
# it was not enough.
#
# What it cost: the public page rendered the grandfathered height-1377 scar as a
# plain red DIVERGENT — precisely what #299 ruling item 2 exists to prevent — and
# the binary had no piecewise straddle branch, so at RULE_BOUNDARY_HEIGHT it could
# have shown a FALSE DIVERGENT for the straddling epoch at the upgrade moment.
#
# Lab #444 (2026-08-16): a second, independent defect — this workflow used to
# publish an ARMED explorer by default (`inputs.explorer_features` empty), the
# pre-push gate could not tell the variants apart (KNOWN_SCAR / s_atomic_exact
# are present in BOTH), and the tag (`sha-<short>`) carried no variant. Caught
# one edit away from re-arming the public health page ~5,000 blocks past the
# boundary (would have been deploy #127 a third time). Fixed by mirroring
# node-image.yml: explicit `variant` choice (safe default emission-resume),
# pre-push assert on `v1.1-exact-emission` (present ⇔ resume), and the variant
# in the tag (`emission-resume-*` / `armed-*`).
#
# THE TWO JOBS ARE DELIBERATELY ASYMMETRIC, because the failure mode and the
# remedy have very different prices:
#
#   drift   the thing that was actually missing. Nobody knew. Seconds on
#           `ubuntu-latest`, so it can run often.
#   image   removes the "build it by hand from a laptop" step. Runs on the
#           standard hosted `ubuntu-24.04-arm` (4 vCPU; free because this repo is public — the
#           org is on the free plan as of 2026-09-25, where the paid `qumbra-arm64-8` larger
#           runner can no longer be scheduled; it sat queued, never started). It stays
#           `workflow_dispatch` ONLY: an image build is a deliberate act.
#
# WHAT `drift` CANNOT SEE, stated so nobody reads more into a green tick: it
# compares the newest PUBLISHED image against this repo. It cannot reach svc0, so
# "an image exists but the host was never rolled" is a different gap and this does
# not close it. That one is `qumbra-deploy`'s to hold. And green means *current*,
# never *correct variant*: for legacy `sha-*` tags the variant is not in the tag
# (lab #444 table: sha-23e7330 was armed, sha-1651799 was resume). New tags carry
# the variant; the alarm keys on `emission-resume-*` first (the running variant)
# and still matches legacy `sha-*` so the currently-published pin does not go
# invisible.
name: explorer image

on:
  # Every push to main, but the comparison is against the newest commit that
  # actually TOUCHED the explorer — not against HEAD. Comparing to HEAD would
  # report lag for a docs commit and train readers to ignore the alarm, which is
  # the same mistake #299 ruling item 2 is about.
  push:
    branches: [main]
  # The backstop: the failure mode is "days pass and nobody notices", so a daily
  # check bounds the blindness even if a push trigger is ever narrowed away.
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "build" to spend runner minutes on an image build. Anything else runs only the free drift check.'
        required: false
        default: ""
      variant:
        description: 'Which explorer to cut. emission-resume is the RUNNING page variant (v1.1-exact-emission, past RULE_BOUNDARY_HEIGHT); armed is the boundary-halt announcement variant. Safe default is emission-resume — an unqualified build must never re-arm the public page (lab #444).'
        type: choice
        options:
          - emission-resume
          - armed
        default: emission-resume

concurrency:
  group: explorer-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drift:
    name: is a published image current with the explorer's code?
    # AFTER `image`, never beside it (#616, found on node-image.yml — this file
    # was written from the same reasoning and carried the same race): on a
    # dispatch that builds, a parallel drift reads the registry BEFORE the push
    # exists, so a successful build ends red. `image` is skipped on push and
    # schedule, and a skipped need skips its dependents unless the dependent
    # carries a status-check function in `if` — hence the pair below. NOT
    # `always()`: that runs even when the run is cancelled, i.e. a drift
    # verdict against a half-pushed cancelled build — the same wrong-moment
    # reading this `needs:` exists to end. `!cancelled()` is GitHub's own
    # recommended form and still runs drift when `image` is skipped or failed.
    needs: [image]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # merge-base and rev-list need history

      - name: The newest commit that affects the explorer image
        id: src
        run: |
          set -euo pipefail
          # The paths whose change makes a published image stale. `qlab-node` is
          # in here on purpose: the supply projection's expected side, the
          # piecewise straddle branch and the emission schedule all live there,
          # and that is exactly what went stale in the 2026-08-07..11 window.
          # Paths written literally, never via an unquoted variable. `$PATHS`
          # word-splits under bash and does NOT under zsh, so the same line means
          # "six pathspecs" on the runner and "one pathspec that matches nothing"
          # in a local zsh dry-run — which silently returned an empty SRC while
          # this was being tested. Literal removes the class.
          SRC=$(git log -1 --format=%H -- \
            crates/qumbra-explorer crates/qlab-node crates/qlab-econ \
            crates/qlab-devnet deploy/docker/Dockerfile Cargo.lock)
          if [ -z "$SRC" ]; then
            echo "::error::no commit found touching the explorer paths — pathspec is wrong"
            exit 1
          fi
          echo "sha=$SRC" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short "$SRC")" >> "$GITHUB_OUTPUT"
          echo "newest explorer-affecting commit: $SRC"
          git log -1 --format='  %h %ad %s' --date=short "$SRC"

      - name: The newest published image, and what it was built from
        id: pub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Tag convention (lab #444): `emission-resume-<short>` / `armed-<short>`
          # — the variant is in the tag, same shape as node-image.yml. Legacy
          # `sha-<short>` tags (pre-#444) still match so the currently-published
          # pin (svc0 runs sha-1651799 as of the issue) does not go invisible
          # and falsely trip "no published image".
          #
          # The VERDICT keys on emission-resume first, then falls back to
          # legacy sha-*. That is the variant the public page must run;
          # `armed` is a boundary announcement artifact whose staleness
          # endangers no running host, so it is reported but never trips the
          # alarm. A legacy sha-* tag does not prove variant (lab #444 table),
          # but it does prove "an image exists at this commit" — enough for
          # the ancestry check until the next resume build lands a new tag.
          TAGS=$(gh api "/orgs/${{ github.repository_owner }}/packages/container/qumbra-explorer/versions?per_page=100" \
                   --jq '[.[].metadata.container.tags[]?] | .[]' 2>/dev/null || true)
          if [ -n "$TAGS" ]; then
            echo "published tags:"; echo "$TAGS" | sed 's/^/  /'
          else
            echo "no published tags readable"
          fi
          best_for() { # $1 = tag prefix; prints newest matching build commit we still have
            local BEST="" BEST_TS=0 t c ts
            for t in $TAGS; do
              case "$t" in "$1"-*) c="${t#"$1"-}";; *) continue;; esac
              if git cat-file -e "$c^{commit}" 2>/dev/null; then
                ts=$(git log -1 --format=%ct "$c")
                if [ "$ts" -gt "$BEST_TS" ]; then BEST_TS=$ts; BEST=$c; fi
              fi
            done
            echo "$BEST"
          }
          # Newest among a list of prefixes (first non-empty wins for reporting
          # which convention hit; for the fleet pin we take the absolute newest
          # commit across resume + legacy so neither class goes invisible).
          best_across() {
            local BEST="" BEST_TS=0 p c ts
            for p in "$@"; do
              c=$(best_for "$p")
              [ -n "$c" ] || continue
              ts=$(git log -1 --format=%ct "$c")
              if [ "$ts" -gt "$BEST_TS" ]; then BEST_TS=$ts; BEST=$c; fi
            done
            echo "$BEST"
          }
          FLEET=$(best_across emission-resume sha)
          RESUME=$(best_for emission-resume)
          LEGACY=$(best_for sha)
          ARMED=$(best_for armed)
          echo "fleet=${FLEET:-none}" >> "$GITHUB_OUTPUT"
          echo "newest published fleet (emission-resume|sha-*) build commit: ${FLEET:-none}"
          echo "  emission-resume: ${RESUME:-none}"
          echo "  legacy sha-*:    ${LEGACY:-none}"
          echo "newest published armed build commit: ${ARMED:-none} (informational only)"

      - name: Verdict
        run: |
          set -euo pipefail
          SRC='${{ steps.src.outputs.sha }}'
          PUB='${{ steps.pub.outputs.fleet }}'
          if [ "$PUB" = "none" ]; then
            echo "::error::No published explorer image (emission-resume-* or legacy sha-*) can be matched to a commit in this repo."
            echo "Build one:  gh workflow run 'explorer image' -f confirm=build -f variant=emission-resume"
            exit 1
          fi
          # Current when the published build contains the newest
          # explorer-affecting commit — i.e. SRC is an ancestor of PUB, or equal.
          if git merge-base --is-ancestor "$SRC" "$PUB"; then
            echo "CURRENT — published $(git rev-parse --short "$PUB") contains $(git rev-parse --short "$SRC")"
            exit 0
          fi
          BEHIND=$(git rev-list --count "$PUB..$SRC" -- \
            crates/qumbra-explorer crates/qlab-node crates/qlab-econ crates/qlab-devnet deploy/docker/Dockerfile Cargo.lock)
          echo "::error::STALE — the published explorer image predates $BEHIND explorer-affecting commit(s)."
          echo "  published : $(git rev-parse --short "$PUB")  $(git log -1 --format=%ad --date=short "$PUB")"
          echo "  needed    : $(git rev-parse --short "$SRC")  $(git log -1 --format=%ad --date=short "$SRC")"
          echo ""
          echo "Build:  gh workflow run 'explorer image' -f confirm=build -f variant=emission-resume"
          echo "Then roll it in qumbra-deploy — this job cannot see svc0 and does not"
          echo "claim the host is current. See OPERATOR.md 9.2a."
          exit 1

  image:
    name: build + push the explorer image (manual, paid runner)
    # Manual only. The runner is charged per minute and its trigger was narrowed
    # for that reason; see the header.
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'build'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: C++ toolchain for randomx-rs
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cmake g++

      - name: Provenance
        run: |
          echo "commit   $(git rev-parse HEAD)"
          echo "variant  ${{ inputs.variant }}"
          uname -m; nproc; free -g | head -2
          docker --version; docker buildx version

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        run: |
          set -euo pipefail
          REV=$(git rev-parse HEAD); SHORT=$(git rev-parse --short HEAD)
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          # --target runtime-explorer, and it MUST stay a separate stage from
          # `builder`: adding the explorer's cargo build to `builder` would move
          # the FLEET image's digest because a page's backend was compiled
          # (deploy/docker/Dockerfile, the capitalised note at the stage).
          # Native arm64 on an arm64 runner — no QEMU, no emulation tax.
          #
          # Variant → EXPLORER_FEATURES (lab #444). emission-resume is the safe
          # default at the input level; an unqualified confirm=build must never
          # re-arm the public page. armed is the deliberate boundary-halt cut.
          case "${{ inputs.variant }}" in
            emission-resume)
              FEATS="qumbra-node/rule-boundary-resume"
              ;;
            armed)
              FEATS=""
              ;;
            *) echo "::error::unknown variant '${{ inputs.variant }}'"; exit 1 ;;
          esac
          TAG="${{ inputs.variant }}-$SHORT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "EXPLORER_FEATURES=${FEATS:-<armed default>}  tag=$TAG"
          docker build -f deploy/docker/Dockerfile --target runtime-explorer \
            --platform linux/arm64 --load \
            --build-arg GIT_REVISION="$REV" \
            --build-arg EXPLORER_FEATURES="$FEATS" \
            -t "ghcr.io/${{ github.repository_owner }}/qumbra-explorer:$TAG" .

      - name: The binary is what we think it is, BEFORE publishing it
        run: |
          set -euo pipefail
          T="ghcr.io/${{ github.repository_owner }}/qumbra-explorer:${{ steps.build.outputs.tag }}"
          # Not a smoke test — a check that the build actually recompiled. A
          # cached `build-explorer` layer produces a green build carrying an OLD
          # binary, which is the shape that hid the 4-day staleness. Assert on
          # symbols the current tree is known to contain.
          docker run --rm --entrypoint sh "$T" -c '
            set -e
            for s in KNOWN_SCAR s_atomic_exact; do
              n=$(grep -c "$s" /usr/local/bin/qumbra-explorer || true)
              echo "  $s = ${n:-0}"
              [ "${n:-0}" -ge 1 ] || { echo "::error::$s absent — the build did not include current source"; exit 1; }
            done'
          # Variant gate (lab #444). KNOWN_SCAR / s_atomic_exact are present in
          # BOTH variants, so they cannot tell armed from resume. The measured
          # distinguisher is `v1.1-exact-emission`: present ⇔ resume, absent ⇔
          # armed (issue #444 grep table). Same shape as node-image.yml's #397
          # faucet-binary check. A mismatch fails BEFORE push and names both
          # the asked-for and the detected variant.
          docker run --rm -e VARIANT="${{ inputs.variant }}" --entrypoint sh "$T" -c '
            set -e
            n=$(grep -c "v1.1-exact-emission" /usr/local/bin/qumbra-explorer || true)
            echo "  v1.1-exact-emission = ${n:-0}"
            if [ "$VARIANT" = "emission-resume" ]; then
              if [ "${n:-0}" -lt 1 ]; then
                echo "::error::variant mismatch — asked for emission-resume, detected armed (v1.1-exact-emission absent). Do not push."
                exit 1
              fi
              echo "variant OK: emission-resume (v1.1-exact-emission present)"
            else
              if [ "${n:-0}" -ge 1 ]; then
                echo "::error::variant mismatch — asked for armed, detected emission-resume (v1.1-exact-emission present). Do not push."
                exit 1
              fi
              echo "variant OK: armed (v1.1-exact-emission absent)"
            fi'

      - name: Push
        run: docker push "ghcr.io/${{ github.repository_owner }}/qumbra-explorer:${{ steps.build.outputs.tag }}"

      - name: Read the provenance back from the registry
        run: |
          set -euo pipefail
          T="ghcr.io/${{ github.repository_owner }}/qumbra-explorer:${{ steps.build.outputs.tag }}"
          DIG=$(docker buildx imagetools inspect "$T" --format '{{.Manifest.Digest}}')
          echo "digest: $DIG"

          # WHY THIS IS jq AND NOT grep, measured rather than supposed: the
          # pattern here used to be '"...revision":"[0-9a-f]*"' -- no space
          # after the colon. buildx renders `{{json .Image}}` through
          # json.MarshalIndent, so the real bytes are `"...revision": "<sha>"`,
          # two-space indented and newline-wrapped. The pattern matched
          # NOTHING on a perfectly good image, and a green build+push then
          # reported the whole workflow red.
          #
          # The `-e` in the default shell is NOT what failed it -- grep was
          # not the last command in `grep | head | sed`, so `-e` saw sed's 0.
          # It was `set -o pipefail` on the line above. Recorded because the
          # obvious reading of this failure is the wrong one.
          #
          # The lesson generalised: a readback must ASSERT, never rely on a
          # matcher's exit status to mean something. A tool that finds nothing
          # and a tool that finds the wrong thing are different verdicts, and
          # neither of them is "the pipeline exited non-zero".
          command -v jq >/dev/null 2>&1 || sudo apt-get install -y --no-install-recommends jq

          # Per-platform, never `{{json .}}`: an OCI index has no config labels,
          # and reading the index made a good image look unlabelled on 2026-08-07.
          #
          # `.Image` has TWO shapes and which one arrives is a property of the
          # runner's image store, not of this repo: a single-platform manifest
          # renders one config object (`.config.Labels`), while an index
          # renders a MAP KEYED BY PLATFORM (`.["linux/arm64"].config.Labels`).
          # Both were captured from real registries -- see
          # `.github/workflows/tests/explorer-provenance/`. A reader pinned to
          # `.config.Labels` returns empty against the map and would red a good
          # push all over again, just one layer further in. Recursive descent
          # reads either, and also absorbs the `.Config` casing some buildx
          # versions emit.
          IMG=$(docker buildx imagetools inspect "$T" --format '{{json .Image}}')
          REVS=$(printf '%s' "$IMG" | jq -r '
            [ .. | objects | .Labels? // empty | objects
              | .["org.opencontainers.image.revision"]? // empty ]
            | map(select(type == "string" and . != "")) | unique | .[]')

          if [ -z "$REVS" ]; then
            echo "::error::provenance unreadable -- the pushed image carries no org.opencontainers.image.revision label. This is NOT a mismatch verdict; the label could not be read at all."
            printf '%s\n' "$IMG" | head -40
            exit 1
          fi
          if [ "$(printf '%s\n' "$REVS" | wc -l)" -gt 1 ]; then
            echo "::error::provenance mismatch -- platforms disagree on the revision label:"
            printf '%s\n' "$REVS" | sed 's/^/  /'
            exit 1
          fi
          GOT="$REVS"

          # The Dockerfile stamps GIT_REVISION from `git rev-parse HEAD` in the
          # Build step, so a full 40-hex label equal to $GITHUB_SHA is the
          # normal path. An abbreviated label names the SAME commit, so it is
          # accepted -- with a warning, because the Dockerfile is meant to
          # stamp the full sha and a short one means something upstream changed.
          # Refusing it would be a second false red of a good image.
          if [ "$GOT" = "$GITHUB_SHA" ]; then
            echo "provenance OK: revision=$GOT"
          elif [ "${#GOT}" -ge 7 ] && [ "${GITHUB_SHA#"$GOT"}" != "$GITHUB_SHA" ]; then
            echo "::warning::the revision label is abbreviated ('$GOT'). It does name $GITHUB_SHA, so provenance holds, but the Dockerfile is meant to stamp the full sha."
            echo "provenance OK: revision=$GOT (abbreviated)"
          else
            echo "::error::provenance mismatch -- image revision '$GOT' != expected '$GITHUB_SHA'"
            exit 1
          fi
          echo ""
          echo "Pin this in qumbra-deploy/compose/docker-compose.svc-light.yml:"
          echo "  image: ghcr.io/${{ github.repository_owner }}/qumbra-explorer@$DIG"
          echo "  (tag was: ${{ steps.build.outputs.tag }} — variant is in the tag)"
          echo "Then roll svc0 per OPERATOR.md 9.2a — dump the outgoing container's"
          echo "logs first, up -d explorer-api only, and read the epoch-1 verdict back."
          echo "Before pinning, grep the binary for v1.1-exact-emission (lab #444)."
