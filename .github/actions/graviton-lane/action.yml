name: graviton-lane
description: >-
  Start or park the on-demand Graviton rigs, counting the WHOLE lane rather than
  one workflow's runs. Use `mode: start` before a job that runs on
  [self-hosted, graviton-rig], and `mode: stop` after it with `if: always()`.

# ─────────────────────────────────────────────────────────────────────────────
# WHY THIS EXISTS: THE LANE HAS MORE THAN ONE USER NOW
#
# The start/stop logic began inside acceptance-graviton.yml and counted THAT
# WORKFLOW'S runs to decide both how many instances to wake and whether the lane
# was free to park. That is correct while it is the only user and silently wrong
# the moment it is not: a second workflow's build would be running on a rig that
# acceptance-graviton's stop job believes nobody is using, and it would park the
# iron out from under it.
#
# So the lane's occupancy is computed HERE, over LANE_WORKFLOWS, and that list is
# the single place a new user of the rigs is declared. Add a workflow to the
# rigs => add its filename there, or the guard is wrong again in the same way.
#
# 🔴 WHY OCCUPANCY IS COUNTED BY WORKFLOW RUNS AND NOT BY RUNNER BUSY-STATE.
# Asking "is any graviton runner busy?" is the direct question and it is NOT
# available here: GET /repos/{r}/actions/runners needs `administration: read`,
# which a workflow GITHUB_TOKEN cannot be granted at all — the only route is a
# stored PAT, which deploy #130 S7 refuses. Run-counting is the reachable proxy.
# (A local operator CAN ask that question — qumbra-deploy's ci-runner/apply.sh
# does exactly that, because `gh` there carries a real user token.)
#
# ASYMMETRY, inherited deliberately: a skipped stop costs at most 2 h of
# watchdog-bounded idle; a wrong stop kills a live job mid-run. Every ambiguous
# case therefore resolves to "leave it running".
# ─────────────────────────────────────────────────────────────────────────────

inputs:
  mode:
    description: 'start | stop'
    required: true
  instance-ids:
    description: 'Space-separated EC2 instance IDs (vars.CI_RUNNER_INSTANCE_ID)'
    required: true
  gh-token:
    description: 'github.token — needs `actions: read` to count lane runs'
    required: true
  this-run-id:
    description: 'github.run_id, excluded from the occupancy count on stop'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Count the whole lane, not one workflow
      id: lane
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        REPO: ${{ github.repository }}
        THIS_RUN: ${{ inputs.this-run-id }}
      run: |
        set -euo pipefail
        # THE LANE REGISTER. Every workflow whose jobs run on the graviton rigs
        # must be listed here. This is the one place that knows.
        LANE_WORKFLOWS="acceptance-graviton.yml explorer-image.yml"

        total=0
        for wf in $LANE_WORKFLOWS; do
          # A workflow that does not exist yet (or was retired) must not silently
          # contribute 0 and read as "lane quiet" — it must be visible.
          if ! out=$(gh api "repos/$REPO/actions/workflows/$wf/runs?per_page=100" 2>&1); then
            echo "::error::could not count runs for $wf — refusing to guess lane occupancy"
            echo "$out"
            exit 1
          fi
          n=$(printf '%s' "$out" | jq --arg this "$THIS_RUN" \
              '[.workflow_runs[] | select((.id|tostring) != $this) | select(.status != "completed")] | length')
          echo "  $wf: $n active"
          total=$((total + n))
        done
        echo "active=$total" >> "$GITHUB_OUTPUT"
        echo "lane occupancy (excluding this run): $total" >> "$GITHUB_STEP_SUMMARY"

    - name: Start as many instances as the lane needs
      if: inputs.mode == 'start'
      shell: bash
      env:
        INSTANCE_ID: ${{ inputs.instance-ids }}
        ACTIVE: ${{ steps.lane.outputs.active }}
      run: |
        set -euo pipefail
        want=$((ACTIVE + 1))          # +1: this run itself needs a rig
        set -- $INSTANCE_ID           # unquoted on purpose: space-separated LIST
        [ "$want" -gt $# ] && want=$#
        [ "$want" -lt 1 ] && want=1
        to_start=$(printf '%s\n' "$@" | head -n "$want" | tr '\n' ' ')
        echo "lane depth $ACTIVE + this run → starting $want of $#: $to_start"
        aws ec2 start-instances --instance-ids $to_start
        aws ec2 wait instance-running --instance-ids $to_start
        aws ec2 describe-instances --instance-ids $to_start \
          --query 'Reservations[].Instances[].[InstanceId,State.Name]' --output text

    - name: Park the iron only if the whole lane is free
      if: inputs.mode == 'stop'
      shell: bash
      env:
        INSTANCE_ID: ${{ inputs.instance-ids }}
        ACTIVE: ${{ steps.lane.outputs.active }}
      run: |
        set -euo pipefail
        if [ "$ACTIVE" -ne 0 ]; then
          echo "$ACTIVE other lane run(s) active — leaving the instances up for them" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        echo "lane free — parking" | tee -a "$GITHUB_STEP_SUMMARY"
        aws ec2 stop-instances --instance-ids $INSTANCE_ID
