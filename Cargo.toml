[workspace]
resolver = "2"
members = ["crates/qlab-air", "crates/qlab-bench", "crates/qlab-consensus", "crates/qlab-node", "crates/qlab-note", "crates/qlab-devnet", "crates/qlab-ledger", "crates/qlab-wallet", "crates/qlab-cbserver", "crates/qlab-econ", "crates/qlab-demo", "crates/qlab-faucet", "crates/qlab-disclosure", "crates/qlab-pow", "crates/qlab-p2p", "crates/qlab-stratum", "crates/qumbra-pool", "crates/qumbra-node", "crates/qumbra-opview", "crates/qumbra-faucet", "crates/qumbra-explorer", "crates/qumbra-wallet", "crates/qumbra-ffi", "crates/qlab-vask", "crates/qumbra-credit-ref"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Signal handling for every long-running binary in this workspace. ONE
# declaration, on purpose: default ctrlc registers SIGINT only, and the
# `termination` feature is what also arms SIGTERM/SIGHUP — the signals Docker
# `stop` and `systemctl stop` actually send (issue #145, regressed once in
# #238 when qumbra-faucet redeclared the dep bare and inherited the feature
# only by unification through qumbra-node). Crates take this via
# `ctrlc = { workspace = true }`; a bare per-crate `ctrlc = "..."` fails
# qumbra-node's `ctrlc_pairing` test.
ctrlc = { version = "3.4", features = ["termination"] }

# Plonky3 deps intentionally NOT pinned yet — M1 starts by selecting and
# pinning exact revs (bench numbers are meaningless against a moving prover).
